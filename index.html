   Bridge to 0.1 only in tier 3 ("we can also write 1/10 as 0.1"). */
(function(){
  function F(n, d){ return fracHTML(n, d); }
  function fK(n, d){ return K.frac(n, d); }
  const NAMES = ['Ana', 'Marcus', 'Sophie', 'Ivan', 'Lucy', 'Diego', 'Ellen', 'Tom', 'Aisha', 'Kai', 'Mei', 'Leo'];
  const THINGS = ['stickers', 'marbles', 'shells', 'sweets', 'football cards', 'beads', 'stamps', 'pencils'];
  const TENTHS = ['', 'one tenth', 'two tenths', 'three tenths', 'four tenths', 'five tenths', 'six tenths', 'seven tenths', 'eight tenths', 'nine tenths'];

  function line10(n, o){ // 0-1 line with 10 steps; only 0 and 1 labelled; marker at n/10
    o = o || {};
    return V.numberLine({ min: 0, max: 1, minor: 0.1, major: 1, width: 300, marks: [{ value: n / 10, kind: o.dot ? 'dot' : 'q' }], labels: function(v){ return v < 0.5 ? '0' : '1'; } });
  }
  function readTenths(html){ return { num: Math.round(V.decodeNumberLine(html) * (V.countTicks(html) - 1)), den: V.countTicks(html) - 1 }; }

  /* distractors for "which fraction" with tenths */
  function fracWrongs(n, why1){
    const w = [
      { n: 10 - n, d: 10, why: 'That counts the WHITE parts (or reads from the other end). Count from 0 / count the coloured parts.' },
      { n: n, d: 9, why: 'The bar has 10 equal parts, so the bottom number is 10, not 9.' },
      { n: 10, d: n, why: 'You flipped it. The top number is the parts we have, the bottom is 10.' },
      { n: 1, d: 10, why: 'That is only ONE tenth. Count every one.' }
    ];
    const pool = [];
    for(let k = 1; k < 10; k++) pool.push({ n: k, d: 10, why: why1 });
    return w.concat(shuffle(pool)).filter(function(x){ return x.d >= 2 && x.n >= 1 && x.n < x.d || (x.n > x.d && x.d >= 2); });
  }

  function barQ(n){
    const vis = V.fractionBar(n, 10);
    return mcq({
      prompt: 'The bar is cut into 10 equal parts. What fraction is coloured?', visual: vis,
      correct: opt(fK(n, 10), F(n, 10)), distractors: fracWrongs(n, 'Count the coloured parts again. The top number is how many are coloured.').map(function(x){ return opt(fK(x.n, x.d), F(x.n, x.d), x.why); }), keepOrder: true,
      hint: 'There are 10 parts in all (bottom number). Count only the coloured ones for the top number.',
      explain: ex('Reading tenths', ['The bar has <b>10</b> equal parts, so the bottom number is 10 (tenths).', '<b>' + n + '</b> parts are coloured.', 'So ' + TENTHS[n] + ' is coloured: <b>' + n + '/10</b>. ✅']),
      truth: fK(n * 3, 30),
      decode: function(){ const r = V.decodeFractionBar(vis); return fK(r.num, r.den); }
    });
  }
  function wholeQ(){
    const vis = V.fractionBar(10, 10);
    return mcqNum({
      prompt: 'The whole bar is coloured. How many tenths make one whole?', visual: vis, answer: 10,
      wrong: [{ v: 1, why: 'One whole, yes — but we are counting TENTHS. There are 10 of them.' }, { v: 9, why: 'Count every part: there are 10, not 9.' }, { v: 100, why: 'That is too many. A whole is cut into 10 equal parts.' }],
      nearby: [1, -1, 2, 5, -5],
      hint: 'Count all the coloured parts in the bar.',
      explain: ex('Tenths in a whole', ['The bar is cut into <b>10</b> equal parts.', 'All of them are coloured, so that is 10/10.', '<b>10</b> tenths make one whole. ✅']),
      truth: 10, decode: function(){ return V.decodeFractionBar(vis).den; }
    });
  }
  function countQ(tier){
    const down = tier === 3 && chance(0.4);
    const len = 5, start = down ? randInt(5, 9) : randInt(1, 5);
    const seq = []; for(let i = 0; i < len; i++) seq.push(down ? start - i : start + i);
    const hole = tier === 1 ? len - 1 : randInt(1, len - 2);
    const m = seq[hole];
    const shown = seq.map(function(k, i){ return i === hole ? '?' : F(k, 10); });
    const ds = [];
    [[m + 1, 'You skipped a tenth.'], [m - 1, 'You went the wrong way — or repeated a tenth.'], [m + 2, 'That jumps too far. Count on one tenth at a time.'], [m - 2, 'That is too small. Count on one tenth at a time.']].forEach(function(x){
      if(x[0] >= 1 && x[0] <= 9) ds.push(opt(fK(x[0], 10), F(x[0], 10), x[1]));
    });
    for(let k = 1; k <= 9; k++) ds.push(opt(fK(k, 10), F(k, 10), 'Check the pattern: each fraction changes by one tenth.'));
    return mcq({
      prompt: (down ? 'Count back in tenths. ' : 'Count on in tenths. ') + 'What is the missing fraction?', visual: '<div style="font-size:22px;font-weight:800;text-align:center;line-height:2">' + shown.join(' , ') + '</div>',
      correct: opt(fK(m, 10), F(m, 10)), distractors: ds, keepOrder: true,
      hint: 'The bottom number stays 10. The top number goes ' + (down ? 'down' : 'up') + ' by 1 each time.',
      explain: ex('Counting in tenths', ['The bottom number stays <b>10</b> because every part is a tenth.', 'The top number goes ' + (down ? 'down' : 'up') + ' by 1: ' + seq.join(', ') + '.', 'The missing fraction is <b>' + m + '/10</b>. ✅']),
      truth: fK(m * 7, 70)
    });
  }
  function lineQ(n){
    const vis = line10(n);
    return mcq({
      prompt: 'The number line from 0 to 1 is cut into 10 equal steps. What fraction is the ? at?', visual: vis,
      correct: opt(fK(n, 10), F(n, 10)), keepOrder: true,
      distractors: [
        n + 1 < 10 ? opt(fK(n + 1, 10), F(n + 1, 10), 'You counted the 0 mark as a step. Count the jumps from 0.') : null,
        opt(fK(10 - n, 10), F(10 - n, 10), 'You counted from the 1. Count the steps from 0.'),
        opt(fK(n, 11), F(n, 11), 'You counted the tick marks. There are 10 equal steps, so the bottom is 10.'),
        n - 1 >= 1 ? opt(fK(n - 1, 10), F(n - 1, 10), 'Count the jumps again — you are one short.') : null
      ].filter(Boolean).concat([1, 2, 3, 4, 6, 7, 8, 9].map(function(k){ return opt(fK(k, 10), F(k, 10), 'Count the jumps from 0 to the ? carefully.'); })),
      hint: 'Count the jumps from 0 to the ?. Each jump is one tenth.',
      explain: ex('Tenths on the line', ['From 0 to 1 there are <b>10</b> equal steps, so each step is 1/10.', 'The ? is <b>' + plural(n, 'step') + '</b> from 0.', 'It is at <b>' + n + '/10</b> (' + TENTHS[n] + '). ✅']),
      truth: fK(n * 5, 50),
      decode: function(){ const r = readTenths(vis); return fK(r.num, r.den); }
    });
  }
  function lineTyped(n){
    const vis = line10(n);
    return numeric({
      prompt: 'The ? is at ?/10 on this number line. Type the missing top number.', visual: vis, answer: n,
      hint: 'Count the jumps from 0 to the ?. Each jump is one tenth.',
      explain: ex('Counting tenths', ['Each step is 1/10.', 'The ? is <b>' + plural(n, 'step') + '</b> from 0.', 'It is at ' + n + '/10, so the missing number is <b>' + n + '</b>. ✅']),
      truth: n, decode: function(){ return readTenths(vis).num; },
      wrong: function(v){ return v === n + 1 ? 'You counted the 0 mark. Count the jumps instead.' : v === 10 - n ? 'You counted from the 1. Count from 0.' : ''; }
    });
  }

  function divExplain(n, per, total){
    return ex(n + '/10 of ' + total, [
      'The bottom number is <b>10</b>, so share ' + total + ' into 10 equal groups: ' + total + ' ÷ 10 = <b>' + per + '</b> in each group.',
      n === 1 ? 'The top number is 1, so take 1 group: <b>' + per + '</b>.' : 'The top number is ' + n + ', so take ' + n + ' groups: ' + n + ' × ' + per + ' = <b>' + (n * per) + '</b>.',
      n + '/10 of ' + total + ' is <b>' + (n * per) + '</b>. ✅'
    ]);
  }
  function groupsQ(per){
    const total = per * 10, vis = V.groups(10, per);
    return mcqNum({
      prompt: total + ' counters are shared equally into 10 groups. How many counters are in each group? (That is 1/10 of ' + total + '.)', visual: vis, answer: per,
      wrong: [{ v: 10, why: 'That is the number of groups. We want how many are IN each group.' }, { v: total, why: 'That is all the counters. Share them into 10 groups.' }],
      nearby: [1, -1, 2, -2, 3],
      hint: 'Count the counters in just ONE group. Or divide ' + total + ' by 10.',
      explain: divExplain(1, per, total),
      truth: total / 10, decode: function(){ return V.decodeGroups(vis).per; }
    });
  }
  function divWordQ(n, per, typed){
    const total = per * 10, a = pick(NAMES), t = pick(THINGS);
    const prompt = pick([
      a + ' has ' + total + ' ' + t + '. ' + a + ' gives ' + F(n, 10) + ' of them away. How many ' + t + ' does ' + a + ' give away?',
      'A box has ' + total + ' ' + t + '. ' + F(n, 10) + ' of them are gold. How many are gold?'
    ]);
    const ans = n * per;
    if(typed) return numeric({
      prompt: prompt, answer: ans, hint: 'Divide ' + total + ' by 10 to find 1/10. Then multiply by the top number.', explain: divExplain(n, per, total), truth: (total * n) / 10,
      wrong: function(v){ return (n > 1 && v === per) ? 'You found 1/10 (' + per + '). Now multiply by the top number ' + n + '.' : v === total * 10 ? 'You multiplied by 10. Dividing by 10 makes the number smaller.' : v === 10 ? 'That is the bottom number, not the answer.' : ''; }
    });
    const wr = [{ v: total * 10, why: 'You multiplied by 10. Finding a tenth means DIVIDING by 10.' }, { v: 10, why: 'That is the bottom number of the fraction, not the answer.' }];
    if(n > 1) wr.unshift({ v: per, why: 'You found 1/10 (' + per + '). Now multiply by the top number ' + n + '.' });
    wr.push({ v: total, why: 'That is the whole amount. A fraction of it is smaller.' }, { v: total - 10, why: 'You took 10 away. To find a tenth, divide by 10.' });
    return mcqNum({
      prompt: prompt, answer: ans, wrong: wr, nearby: [1, -1, 2, -2, 5, 10],
      hint: 'Divide ' + total + ' by 10 to find 1/10' + (n > 1 ? ', then multiply by ' + n + '.' : '.'),
      explain: divExplain(n, per, total), truth: (total * n) / 10
    });
  }
  function divSumQ(per, typed){
    const total = per * 10;
    const base = { prompt: 'What is ' + total + ' ÷ 10?', hint: 'Dividing by 10 moves every digit one place smaller. Cover the 0 at the end of ' + total + '.',
      explain: ex(total + ' ÷ 10', ['Dividing by 10 makes the number 10 times smaller.', 'Cover the last 0 of ' + total + ' and you are left with <b>' + per + '</b>.', 'Check: ' + per + ' × 10 = ' + total + '. So ' + total + ' ÷ 10 = <b>' + per + '</b>. ✅']), truth: total / 10 };
    if(typed) return numeric(Object.assign({ answer: per, wrong: function(v){ return v === total * 10 ? 'You multiplied. ÷ means share into 10 groups, which makes the number smaller.' : v === total - 10 ? 'You took 10 away. Divide by 10 instead.' : ''; } }, base));
    return mcqNum(Object.assign({ answer: per, wrong: [{ v: total * 10, why: 'You multiplied by 10. ÷ 10 makes the number smaller.' }, { v: total - 10, why: 'You took 10 away. Divide by 10 instead.' }, { v: total / 5, why: 'That is dividing by 5 (or halving the number of groups). We divide by 10.' }], nearby: [1, -1, 2, -2, 10] }, base));
  }
  function decimalQ(){
    const vis = line10(1, {});
    const ds = [
      opt(K.num(0.01), '0.01', 'That is one HUNDREDTH. One tenth is 0.1.'),
      opt(K.num(1), '1.0', 'That is one whole (the same as 1). One tenth is a small part of a whole.'),
      opt(K.num(10), '10', 'That is ten wholes! One tenth is less than 1.'),
      opt(K.num(1.1), '1.1', 'That is one whole and one tenth. We want just ONE tenth.')
    ];
    return mcq({
      prompt: 'The ? is at 1/10. We can also write 1/10 as a decimal. Which one is it?', visual: vis,
      correct: opt(K.num(0.1), '0.1'), distractors: ds, count: 4, keepOrder: false,
      hint: 'Decimals use a point to show parts of a whole. One tenth is the first place after the point.',
      explain: ex('1/10 as a decimal', ['The ? is one step from 0 on a line cut into 10 steps, so it is at 1/10.', 'The first place after the decimal point shows <b>tenths</b>.', 'So 1/10 can also be written as <b>0.1</b>. ✅']),
      truth: K.num(1 / 10),
      decode: function(){ const r = readTenths(vis); return K.num(r.num / r.den); }
    });
  }
  function leftQ(){
    const per = randInt(3, 9), total = per * 10, a = pick(NAMES), t = pick(THINGS);
    return numeric({
      prompt: a + ' has ' + total + ' ' + t + ' and gives away ' + F(1, 10) + ' of them. How many are left?', answer: total - per,
      hint: 'First find 1/10 of ' + total + ' (divide by 10). Then take it away from ' + total + '.',
      explain: ex('Two steps', ['1/10 of ' + total + ' = ' + total + ' ÷ 10 = <b>' + per + '</b>.', 'Take it away: ' + total + ' − ' + per + ' = <b>' + (total - per) + '</b>.', (total - per) + ' ' + t + ' are left. ✅']),
      truth: total * 9 / 10,
      wrong: function(v){ return v === per ? 'That is the number given away. The question asks how many are LEFT.' : ''; }
    });
  }

  registerSkill({
    id: 'frac-tenths', strand: 'fractions', name: 'Tenths', emoji: '🔟', year: 3, order: 450, prereq: ['frac-number-line', 'frac-of-quantity'],
    lesson: {
      title: 'Counting in tenths',
      steps: [
        { say: 'A <b>tenth</b> is one of <b>10 equal parts</b>. We write it <b>1/10</b>. This bar has 10 equal parts and 1 of them is coloured.', vis: { kind: 'fractionBar', args: [1, 10] } },
        { say: 'We can count in tenths: 1/10, 2/10, 3/10… The bottom number stays <b>10</b> and the top number goes up. Here 3 parts are coloured: <b>3/10</b>, “three tenths”.', vis: { kind: 'fractionBar', args: [3, 10] },
          quiz: { prompt: 'What fraction of this bar is coloured?', options: [{ label: '3/10', ok: true }, { label: '7/10', ok: false }, { label: '3/7', ok: false }], right: 'Yes! 3 coloured parts out of 10 is 3/10.', wrong: 'The bar has 10 parts (bottom) and 3 are coloured (top). So 3/10.' } },
        { say: 'When all <b>10</b> tenths are coloured we have the whole bar. <b>10/10 = 1 whole</b>.', vis: { kind: 'fractionBar', args: [10, 10] } },
        { say: 'Tenths on a number line: the space from 0 to 1 is cut into <b>10</b> equal steps. The dot is <b>4</b> steps from 0, so it is at <b>4/10</b>.', vis: { kind: 'numberLine', args: [{ min: 0, max: 1, minor: 0.1, major: 1, width: 300, marks: [{ value: 0.4, kind: 'dot' }], labels: function(v){ return v < 0.5 ? '0' : '1'; } }] } },
        { say: 'To find <b>1/10</b> of a number, <b>divide by 10</b>. Share 40 counters into 10 equal groups: there are <b>4</b> in each group. So 1/10 of 40 = 4.', vis: { kind: 'groups', args: [10, 4] },
          quiz: { prompt: 'What is 1/10 of 40?', options: [{ label: '4', ok: true }, { label: '10', ok: false }, { label: '400', ok: false }], right: 'Yes! 40 ÷ 10 = 4.', wrong: 'A tenth means divide by 10: 40 ÷ 10 = 4. It gets smaller, not bigger.' } }
      ]
    },
    trick: {
      title: 'Cover the zero',
      say: 'To divide a number that ends in 0 by 10, just <b>cover the last 0</b>! The digits that are left are your answer. This works because every digit moves one place smaller.',
      vis: { kind: 'groups', args: [10, 3] },
      example: '30 ÷ 10 → cover the 0 → <b>3</b>, so 1/10 of 30 = 3'
    },
    gen: {
      1: function(){
        const r = randInt(0, 4);
        if(r === 0) return wholeQ();
        if(r === 1) return countQ(1);
        if(r === 2) return groupsQ(randInt(1, 4));
        return barQ(pick([1, 2, 3, 4, 6, 7, 8, 9]));
      },
      2: function(){
        const r = randInt(0, 5);
        if(r === 0) return barQ(randInt(1, 9));
        if(r === 1) return countQ(2);
        if(r === 2) return lineQ(randInt(1, 9));
        if(r === 3) return divSumQ(randInt(2, 9), false);
        return divWordQ(1, randInt(2, 9), false);
      },
      3: function(){
        const r = randInt(0, 6);
        if(r === 0) return decimalQ();
        if(r === 1) return divWordQ(randInt(2, 9), randInt(2, 9), true);
        if(r === 2) return divSumQ(randInt(3, 10), true);
        if(r === 3) return lineTyped(randInt(2, 9));
        if(r === 4) return leftQ();
        if(r === 5) return countQ(3);
        return divWordQ(1, randInt(3, 10), true);
      }
    }
  });
})();

/* ===== src/skills/geometry-2d-shapes.js ===== */
/* GEOMETRY 1 — 2D shapes. Every shape is NAMED by reading the drawn points (sides, right angles, equal sides, parallel pairs). */
(function(){
  const ALL = ['equilateral triangle', 'isosceles triangle', 'right-angled triangle', 'scalene triangle', 'square', 'rectangle', 'rhombus', 'parallelogram', 'trapezium', 'kite', 'pentagon', 'hexagon', 'octagon', 'circle'];
  const SHAPEKEY = { 'equilateral triangle': 'triangle_equilateral', 'isosceles triangle': 'triangle_isosceles', 'right-angled triangle': 'triangle_right', 'scalene triangle': 'triangle_scalene' };
  // hand-counted corners (independent of any drawing)
  const LITN = { triangle: 3, 'equilateral triangle': 3, 'isosceles triangle': 3, 'right-angled triangle': 3, 'scalene triangle': 3, square: 4, rectangle: 4, rhombus: 4, parallelogram: 4, trapezium: 4, kite: 4, pentagon: 5, hexagon: 6, octagon: 8 };
  const LITRA = { 'right-angled triangle': 1, square: 4, rectangle: 4 };
  const DEF = {
    triangle: 'has 3 sides', 'equilateral triangle': 'has 3 equal sides', 'isosceles triangle': 'has exactly 2 equal sides', 'right-angled triangle': 'has 1 right angle', 'scalene triangle': 'has 3 sides that are all different',
    square: 'has 4 equal sides and 4 right angles', rectangle: 'has 4 sides and 4 right angles', rhombus: 'has 4 equal sides and no right angles', parallelogram: 'has 2 pairs of parallel sides and no right angles',
    trapezium: 'has 4 sides and just 1 pair of parallel sides', kite: 'has 2 pairs of equal sides that sit next to each other', pentagon: 'has 5 sides', hexagon: 'has 6 sides', octagon: 'has 8 sides', circle: 'has no straight sides and no corners'
  };

  // NOTE: V.SHAPES.rhombus in visuals.js is really a square turned 45 degrees (4 right angles), so the rhombus is drawn here from its own points.
  const RHOMBUS = [[100, 25], [170, 85], [100, 145], [30, 85]];
  function draw(name, o){
    if(name === 'circle') return V.circle(o);
    if(name === 'rhombus') return V.polygon(RHOMBUS, o);
    if(name === 'triangle') return V.shape2D(pick(['triangle_equilateral', 'triangle_isosceles', 'triangle_scalene', 'triangle_right']), o);
    return V.shape2D(SHAPEKEY[name] || name, o);
  }
  function art(n){ return /^[aeiou]/.test(n) ? 'an ' + n : 'a ' + n; }
  function artB(n){ return (/^[aeiou]/.test(n) ? 'An ' : 'A ') + '<b>' + n + '</b>'; }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function basic(n){ return /triangle$/.test(n) ? 'triangle' : n; }

  // facts read straight from the drawn polygon points (my own measurements)
  function polyFacts(html){
    const m = /class="poly" points="([^"]*)"/.exec(html);
    if(!m){ if(/class="circ"/.test(html)) return { circle: true, n: 0, ra: 0, pp: 0, adj: 0, eqMax: 0, allEq: false }; return null; }
    const pts = m[1].trim().split(/\s+/).map(function(p){ return p.split(',').map(Number); });
    const n = pts.length, len = [], vec = [];
    for(let i = 0; i < n; i++){ const a = pts[i], b = pts[(i + 1) % n]; vec.push([b[0] - a[0], b[1] - a[1]]); len.push(Math.hypot(b[0] - a[0], b[1] - a[1])); }
    let ra = 0;
    for(let i = 0; i < n; i++){ const u = vec[(i + n - 1) % n], v = vec[i]; if(Math.abs(u[0] * v[0] + u[1] * v[1]) / (len[(i + n - 1) % n] * len[i]) < 0.01) ra++; }
    let pp = 0;
    for(let i = 0; i < n; i++) for(let j = i + 1; j < n; j++) if(Math.abs(vec[i][0] * vec[j][1] - vec[i][1] * vec[j][0]) / (len[i] * len[j]) < 0.004) pp++;
    let adj = 0; for(let i = 0; i < n; i++) if(Math.abs(len[i] - len[(i + 1) % n]) <= 1.5) adj++;
    let eqMax = 1; for(let i = 0; i < n; i++){ let c = 0; for(let j = 0; j < n; j++) if(Math.abs(len[i] - len[j]) <= 1.5) c++; if(c > eqMax) eqMax = c; }
    return { circle: false, n: n, ra: ra, pp: pp, adj: adj, eqMax: eqMax, allEq: eqMax === n };
  }
  // the same facts, but from the library decoders (a different code path)
  function decFacts(html){
    if(V.decodeCircle(html)) return { circle: true, n: 0, ra: 0, pp: 0, eqMax: 0, allEq: false };
    const d = V.decodePolygon(html);
    return { circle: false, n: d.vertices, ra: d.rightAngles, pp: d.parallelPairs, eqMax: d.equalSides, allEq: d.allEqual };
  }
  // one exact name for a drawn shape
  function nameOf(f){
    if(f.circle) return 'circle';
    if(f.n === 3){ if(f.ra === 1) return 'right-angled triangle'; if(f.allEq) return 'equilateral triangle'; if(f.eqMax === 2) return 'isosceles triangle'; return 'scalene triangle'; }
    if(f.n === 4){
      if(f.ra === 4) return f.allEq ? 'square' : 'rectangle';
      if(f.allEq) return 'rhombus';
      if(f.pp === 2) return 'parallelogram';
      if(f.pp === 1) return 'trapezium';
      if(f.adj === undefined || f.adj >= 2 || f.eqMax === 2) return 'kite';
      return 'quadrilateral';
    }
    if(f.n === 5) return 'pentagon'; if(f.n === 6) return 'hexagon'; if(f.n === 8) return 'octagon';
    return 'polygon';
  }
  // "is this name TRUE of this shape?" using the loose (inclusive) maths meaning, so a distractor can never also be right
  const IS = {
    triangle: function(f){ return f.n === 3; },
    'equilateral triangle': function(f){ return f.n === 3 && f.allEq; },
    'isosceles triangle': function(f){ return f.n === 3 && f.eqMax >= 2; },
    'right-angled triangle': function(f){ return f.n === 3 && f.ra >= 1; },
    'scalene triangle': function(f){ return f.n === 3 && f.eqMax === 1; },
    square: function(f){ return f.n === 4 && f.ra === 4 && f.allEq; },
    rectangle: function(f){ return f.n === 4 && f.ra === 4; },
    rhombus: function(f){ return f.n === 4 && f.allEq; },
    parallelogram: function(f){ return f.n === 4 && f.pp >= 2; },
    trapezium: function(f){ return f.n === 4 && f.pp >= 1; },
    kite: function(f){ return f.n === 4 && (f.allEq || f.adj >= 2); },
    pentagon: function(f){ return f.n === 5; }, hexagon: function(f){ return f.n === 6; }, octagon: function(f){ return f.n === 8; },
    circle: function(f){ return !!f.circle; }
  };
  const FACT = {}; ALL.forEach(function(n){ FACT[n] = polyFacts(draw(n)); }); FACT.triangle = FACT['equilateral triangle'];

  function describe(f){
    if(f.circle) return 'has no straight sides and no corners';
    return 'has ' + f.n + ' sides' + (f.allEq ? ' (all equal)' : '') + ', ' + (f.ra ? f.ra + ' right angle' + (f.ra > 1 ? 's' : '') : 'no right angles') + ' and ' + (f.pp ? f.pp + ' pair' + (f.pp > 1 ? 's' : '') + ' of parallel sides' : 'no parallel sides');
  }
  function sidesOf(n){ return FACT[n] ? FACT[n].n : 3; }
  function closeFirst(names, n){ return shuffle(names).sort(function(a, b){ return Math.abs(sidesOf(a) - n) - Math.abs(sidesOf(b) - n); }); }
  function whyName(x, f){ return cap(art(x)) + ' ' + DEF[x] + ', but this shape ' + describe(f) + '.'; }
  function explainName(target, f){
    const steps = [];
    steps.push(f.circle ? 'It has <b>no straight sides</b> and <b>no corners</b>: it is one smooth curved line.' : 'Count the straight sides: <b>' + f.n + '</b>. A shape has as many corners as sides: <b>' + f.n + '</b>.');
    if(!f.circle && f.n === 4) steps.push('Look at the corners: <b>' + (f.ra ? f.ra + ' right angles' : 'no right angles') + '</b>. Are all 4 sides the same length? <b>' + (f.allEq ? 'Yes' : 'No') + '</b>.');
    else if(!f.circle && f.n === 3) steps.push('Look closely: <b>' + (f.ra ? 'it has a right angle' : 'no right angles') + '</b>, and the number of equal sides is <b>' + (f.allEq ? '3' : (f.eqMax === 2 ? '2' : 'none')) + '</b>.');
    steps.push(artB(target) + ' ' + DEF[target] + '. So this is ' + art(target).replace(target, '<b>' + target + '</b>') + '. ✅');
    return ex('Naming the shape', steps);
  }

  /* ----- generic builders ----- */
  function nameQ(targets, cands, count, hint){
    const target = pick(targets), vis = draw(target), f = polyFacts(vis);
    const wrongs = closeFirst(cands.filter(function(x){ return !IS[x](f); }), f.n);
    const ds = wrongs.map(function(x){ return opt(K.text(x), x, whyName(x, f)); });
    return mcq({
      prompt: 'What is the name of this shape?', visual: vis,
      correct: opt(K.text(target), target), distractors: ds, keepOrder: true, count: count, hint: hint,
      explain: explainName(target, f),
      truth: K.text(basic(nameOf(polyFacts(vis)))), decode: function(){ return K.text(cands.indexOf('triangle') >= 0 ? basic(nameOf(decFacts(vis))) : nameOf(decFacts(vis))); }
    });
  }
  function picKey(html, basicNames){ const nm = nameOf(decFacts(html)); return K.text(basicNames ? basic(nm) : nm); }

  // property question: "Which shape <text>?" with names or with pictures. Distractors are CHECKED against the property.
  function propQ(props, pool, asPics, count, hintTxt){
    const prop = pick(props);
    const matching = pool.filter(function(n){ return prop.pred(FACT[n]); });
    const non = pool.filter(function(n){ return !prop.pred(FACT[n]); });
    const target = pick(matching);
    const dn = closeFirst(non, FACT[target].n);
    const ds = dn.map(function(x){
      return opt(K.text(x), asPics ? draw(x, { width: 120 }) : x, cap(art(x)) + ' ' + describe(FACT[x]) + '. That does not match: the clue says the shape ' + prop.text + '.');
    });
    const q = mcq({
      prompt: 'Which shape ' + prop.text + '?', visual: '',
      correct: opt(K.text(target), asPics ? draw(target, { width: 120 }) : target), distractors: ds, keepOrder: true, count: count,
      hint: hintTxt || 'Check each shape against the clue, one at a time. Cross out any shape that does not fit.',
      explain: ex('Checking the clue', [
        'The clue says the shape <b>' + prop.text + '</b>.',
        artB(target) + ' ' + describe(FACT[target]) + ' — that fits the clue.',
        'The others do not fit. For example, ' + art(dn[0]) + ' ' + describe(FACT[dn[0]]) + '.',
        'So the answer is the <b>' + target + '</b>. ✅'
      ]),
      truth: 'pending'
    });
    function nameOfKey(k){ return k.slice(2); }
    // independent recompute: draw each option, measure it, and see which one fits the clue
    const fits = q.options.filter(function(o){ return prop.pred(polyFacts(draw(nameOfKey(o.key)))); });
    q.truthKey = fits.length === 1 ? fits[0].key : 'fits:' + fits.length;
    if(asPics){
      q.optionsAreVisual = true;
      q.decodeKey = function(){
        const found = [];
        for(let i = 0; i < q.options.length; i++){
          const o = q.options[i];
          if(picKey(o.label, false) !== o.key) return 'option ' + i + ' picture does not match its key';
          if(prop.pred(decFacts(o.label))) found.push(o.key);
        }
        return found.length === 1 ? found[0] : 'fits:' + found.length;
      };
    } else {
      q.decodeKey = function(){
        const found = [];
        q.options.forEach(function(o){ if(prop.pred(decFacts(draw(nameOfKey(o.key))))) found.push(o.key); });
        return found.length === 1 ? found[0] : 'fits:' + found.length;
      };
    }
    return q;
  }

  const T1 = ['triangle', 'square', 'rectangle', 'pentagon', 'hexagon', 'octagon', 'circle'];
  const P2 = [
    { text: 'has 3 sides', pred: function(f){ return f.n === 3; } },
    { text: 'has 5 sides', pred: function(f){ return f.n === 5; } },
    { text: 'has 6 sides', pred: function(f){ return f.n === 6; } },
    { text: 'has 8 sides', pred: function(f){ return f.n === 8; } },
    { text: 'has no corners and no straight sides', pred: function(f){ return !!f.circle; } },
    { text: 'has 4 right angles', pred: function(f){ return f.ra === 4; } },
    { text: 'has 4 equal sides and 4 right angles', pred: function(f){ return f.n === 4 && f.allEq && f.ra === 4; } },
    { text: 'has 4 equal sides and no right angles', pred: function(f){ return f.n === 4 && f.allEq && f.ra === 0; } }
  ];
  const P3 = [
    { text: 'has 4 sides and just 1 pair of parallel sides', pred: function(f){ return f.n === 4 && f.pp === 1; } },
    { text: 'has 4 sides and no parallel sides', pred: function(f){ return f.n === 4 && f.pp === 0; } },
    { text: 'has 2 pairs of parallel sides, no right angles and sides that are not all equal', pred: function(f){ return f.n === 4 && f.pp === 2 && f.ra === 0 && !f.allEq; } },
    { text: 'has 4 right angles but sides that are not all equal', pred: function(f){ return f.n === 4 && f.ra === 4 && !f.allEq; } },
    { text: 'has 3 equal sides', pred: function(f){ return f.n === 3 && f.allEq; } },
    { text: 'is a triangle with exactly 2 equal sides', pred: function(f){ return f.n === 3 && f.eqMax === 2; } },
    { text: 'has 1 right angle', pred: function(f){ return f.ra === 1; } },
    { text: 'has 3 pairs of parallel sides', pred: function(f){ return f.pp === 3; } },
    { text: 'has 4 equal sides and no right angles', pred: function(f){ return f.n === 4 && f.allEq && f.ra === 0; } },
    { text: 'has more than 5 sides', pred: function(f){ return f.n > 5; } },
    { text: 'has no right angles and no parallel sides', pred: function(f){ return !f.circle && f.ra === 0 && f.pp === 0; } }
  ];
  const POOL2 = ['right-angled triangle', 'square', 'rectangle', 'rhombus', 'parallelogram', 'trapezium', 'kite', 'pentagon', 'hexagon', 'octagon', 'circle'];

  V.extra.geoShape = {
    render: function(name, o){ return draw(name, o); },
    verify: function(args, html){ const n = nameOf(decFacts(html)); return (n === args[0] || basic(n) === args[0]) ? '' : 'shape draws ' + n + ' not ' + args[0]; }
  };

  registerSkill({
    id: 'geo-2d-shapes', strand: 'geometry', name: '2D shapes and their sides', emoji: '🔷', year: 3, order: 710, prereq: [],
    lesson: {
      title: 'Shape detectives',
      steps: [
        { say: 'A <b>2D shape</b> is flat, like a drawing. We describe it by its <b>sides</b> (straight lines) and <b>corners</b> (where two sides meet). This <b>triangle</b> has <b>3 sides</b> and <b>3 corners</b>.', vis: { kind: 'geoShape', args: ['isosceles triangle'] } },
        { say: 'A <b>right angle</b> is a square corner. The red marks show them. A <b>rectangle</b> has <b>4 sides</b> and <b>4 right angles</b>. A <b>square</b> is special: all 4 sides are <b>equal</b> too.', vis: { kind: 'geoShape', args: ['square', { marks: true }] },
          quiz: { prompt: 'A shape has 4 equal sides and 4 right angles. What is it?', options: [{ label: 'Square', ok: true }, { label: 'Pentagon', ok: false }, { label: 'Triangle', ok: false }], right: 'Yes! 4 equal sides and 4 square corners: a square.', wrong: 'Count again: 4 sides and 4 square corners make a square.' } },
        { say: 'More sides, more names! A <b>pentagon</b> has <b>5</b> sides, a <b>hexagon</b> has <b>6</b> and an <b>octagon</b> has <b>8</b>. This one is a <b>hexagon</b>.', vis: { kind: 'geoShape', args: ['hexagon'] },
          quiz: { prompt: 'How many sides does an octagon have?', options: [{ label: '5', ok: false }, { label: '6', ok: false }, { label: '8', ok: true }], right: 'Yes! Octagon = 8 sides, like an octopus has 8 arms.', wrong: 'An octagon has 8 sides. Pentagon is 5 and hexagon is 6.' } },
        { say: 'A <b>circle</b> has <b>no straight sides</b> and <b>no corners</b>. It is one smooth curved line.', vis: { kind: 'geoShape', args: ['circle'] } },
        { say: 'A <b>rhombus</b> is a pushed-over square: <b>4 equal sides</b> but <b>no right angles</b>. A <b>parallelogram</b> has two pairs of sides that run side by side (parallel).', vis: { kind: 'geoShape', args: ['rhombus'] },
          quiz: { prompt: 'Which shape has 4 equal sides but no right angles?', options: [{ label: 'Rhombus', ok: true }, { label: 'Rectangle', ok: false }, { label: 'Pentagon', ok: false }], right: 'Yes! The rhombus: 4 equal sides, no square corners.', wrong: 'A rectangle has right angles and a pentagon has 5 sides. Only the rhombus fits.' } },
        { say: 'A <b>trapezium</b> has just <b>one pair</b> of parallel sides (the top and bottom here). A <b>kite</b> has two pairs of equal sides that sit <b>next to each other</b>.', vis: { kind: 'geoShape', args: ['trapezium'] } }
      ]
    },
    trick: {
      title: 'Names hide numbers',
      say: 'Shape names hide a number! <b>Tri</b> = 3 (tricycle). <b>Quad</b> = 4 (quad bike). <b>Pent</b> = 5. <b>Hex</b> = 6. <b>Oct</b> = 8 (an octopus has 8 arms!). Count the sides, then say the name.',
      vis: { kind: 'geoShape', args: ['octagon'] },
      example: '8 sides → <b>oct</b>agon, like <b>oct</b>opus (8 arms)'
    },
    gen: {
      1: function(){
        const r = randInt(1, 4);
        if(r === 1 || r === 2) return nameQ(T1, T1, 3, 'Count the straight sides first. Does the shape have any corners at all?');
        if(r === 3){ // count sides or corners
          const name = pick(['equilateral triangle', 'isosceles triangle', 'square', 'rectangle', 'pentagon', 'hexagon', 'octagon']);
          const what = pick(['sides', 'corners']);
          const vis = draw(name), n = LITN[name];
          return mcqNum({
            prompt: 'How many ' + (what === 'sides' ? 'straight sides' : 'corners') + ' does this shape have?', visual: vis, answer: n,
            wrong: [{ v: n + 1, why: 'That is one too many. Put a dot on your starting ' + (what === 'sides' ? 'side' : 'corner') + ' so you do not count it twice.' }, { v: n - 1, why: 'That is one too few. Count every ' + (what === 'sides' ? 'side' : 'corner') + ' once, going round the shape.' }],
            valid: function(v){ return v >= 3 && v <= 10; }, count: 3,
            hint: 'Touch each ' + (what === 'sides' ? 'side' : 'corner') + ' with your finger as you count, going round the shape.',
            explain: ex('Counting the ' + what, ['Start at one ' + (what === 'sides' ? 'side' : 'corner') + ' and go round the shape.', 'Count every ' + (what === 'sides' ? 'side' : 'corner') + ' once.', 'There are <b>' + n + '</b> of them. (Every shape has the same number of sides and corners.) ✅']),
            truth: LITN[name], decode: function(){ const d = V.decodePolygon(vis); return what === 'sides' ? d.sides : d.vertices; }
          });
        }
        // which picture is a ...?
        const target = pick(T1);
        const tv = draw(target, { width: 120 }), tf = polyFacts(tv);
        const ds = shuffle(T1).filter(function(x){ return !IS[target](FACT[x]) && !IS[x](tf); }).map(function(x){ return opt(K.text(x), draw(x, { width: 120 }), 'That picture shows ' + art(x) + ', which ' + DEF[x] + '. A ' + target + ' ' + DEF[target] + '.'); });
        const q = mcq({
          prompt: 'Which picture shows ' + art(target) + '?', visual: '', correct: opt(K.text(target), tv), distractors: ds, count: 3,
          hint: 'Say what a ' + target + ' is like, then count the sides on each picture.',
          explain: ex('Finding ' + art(target), [artB(target) + ' ' + DEF[target] + '.', 'Count the sides on each picture and look for corners.', 'Only one picture fits: ' + art(target).replace(target, '<b>' + target + '</b>') + '. ✅']),
          truth: K.text(target)
        });
        q.optionsAreVisual = true;
        q.decodeKey = function(){ for(let i = 0; i < q.options.length; i++) if(picKey(q.options[i].label, true) !== q.options[i].key) return 'option ' + i + ' picture does not match its key'; return q.options[q.correct].key; };
        return q;
      },
      2: function(){
        const r = randInt(1, 4);
        if(r === 1 || r === 2) return nameQ(['rectangle', 'square', 'rhombus', 'parallelogram', 'trapezium', 'kite', 'pentagon', 'hexagon', 'octagon'], ['rectangle', 'square', 'rhombus', 'parallelogram', 'trapezium', 'kite', 'pentagon', 'hexagon', 'octagon', 'circle'], 4,
          'Count the sides first. For 4-sided shapes, check for right angles (square corners) and whether all the sides are equal.');
        if(r === 3){ // typed: right angles
          const name = pick(ALL.filter(function(n){ return n !== 'circle'; }));
          const vis = draw(name), f = polyFacts(vis), n = f.ra;
          return numeric({
            prompt: 'How many <b>right angles</b> (square corners) does this shape have?', visual: vis, answer: n,
            hint: 'A right angle looks like the corner of a book. Check each corner of the shape: does it look square?',
            explain: ex('Counting right angles', ['Go round the shape and check every corner.', 'A right angle is an exact square corner, like the corner of a page.', 'This shape has <b>' + n + '</b> right angle' + (n === 1 ? '' : 's') + '. ✅']),
            truth: LITRA[name] || 0, decode: function(){ return V.decodePolygon(vis).rightAngles; },
            wrong: function(v){ return v === f.n ? 'That is the number of corners. Only the square-looking corners are right angles.' : ''; }
          });
        }
        return propQ(P2, POOL2, false, 4);
      },
      3: function(){
        const r = randInt(1, 5);
        if(r === 1) return propQ(P3.concat(P2.slice(5)), ALL, false, 4);
        if(r === 2) return propQ(P3.concat(P2.slice(4)), ALL, true, 3, 'Check the clue against each picture in turn. Count sides and corners first, then look at the equal sides.');
        if(r === 3){ // triangle types
          const target = pick(['equilateral triangle', 'isosceles triangle', 'right-angled triangle', 'scalene triangle']);
          const vis = draw(target), f = polyFacts(vis);
          const tri = ['equilateral triangle', 'isosceles triangle', 'right-angled triangle', 'scalene triangle'];
          const ds = shuffle(tri).filter(function(x){ return !IS[x](f); }).map(function(x){ return opt(K.text(x), x, whyName(x, f)); });
          return mcq({
            prompt: 'What kind of triangle is this?', visual: vis, correct: opt(K.text(target), target), distractors: ds, count: 3, keepOrder: true,
            hint: 'Look for a square corner first. Then compare the lengths of the three sides.',
            explain: ex('Sorting triangles', ['Right angles: <b>' + f.ra + '</b>. Equal sides: <b>' + (f.allEq ? 'all 3' : (f.eqMax === 2 ? '2' : 'none')) + '</b>.', 'An <b>equilateral</b> has 3 equal sides, an <b>isosceles</b> has 2, a <b>scalene</b> has none, a <b>right-angled</b> triangle has a square corner.', 'This is a <b>' + target + '</b>. ✅']),
            truth: K.text(nameOf(polyFacts(vis))), decode: function(){ return K.text(nameOf(decFacts(vis))); }
          });
        }
        if(r === 4){ // two shapes, total corners
          const names = ['equilateral triangle', 'square', 'rectangle', 'pentagon', 'hexagon', 'octagon', 'rhombus', 'trapezium'];
          const a = pick(names), b = pick(names);
          const va = draw(a, { width: 120 }), vb = draw(b, { width: 120 });
          const vis = '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' + va + vb + '</div>';
          const ans = LITN[a] + LITN[b];
          return numeric({
            prompt: 'How many corners do these two shapes have <b>altogether</b>?', visual: vis, answer: ans,
            hint: 'Count the corners of the first shape, then the corners of the second shape, and add them.',
            explain: ex('Two shapes', ['The first shape is ' + art(a) + ': <b>' + LITN[a] + '</b> corners.', 'The second shape is ' + art(b) + ': <b>' + LITN[b] + '</b> corners.', LITN[a] + ' + ' + LITN[b] + ' = <b>' + ans + '</b> corners altogether. ✅']),
            truth: LITN[b] + LITN[a], decode: function(){ return vis.split('<svg').slice(1).reduce(function(t, s){ return t + V.decodePolygon('<svg' + s).vertices; }, 0); },
            wrong: function(v){ return v === LITN[a] || v === LITN[b] ? 'That is only one of the shapes. Add the corners of both.' : ''; }
          });
        }
        // spec question: pictures of triangles/quads - which has no right angles
        return propQ([{ text: 'has no right angles', pred: function(f){ return !f.circle && f.ra === 0; } }, { text: 'has a right angle', pred: function(f){ return f.ra >= 1; } }], ['right-angled triangle', 'square', 'rectangle', 'rhombus', 'kite', 'pentagon', 'trapezium', 'parallelogram'], true, 4, 'A right angle is a square corner. Look at every corner of each picture.');
      }
    }
  });
})();

/* ===== src/skills/logic-patterns.js ===== */
/* LOGIC 1 — Patterns. Repeating shape patterns, growing number patterns, matchstick patterns, odd-one-out numbers.
   Pictures are generated from the rule and decoded from the DRAWING (shape geometry + fill, number cards, stick lines). */
(function(){
  const INK = 'var(--vis-ink,#1B1B2F)';
  function r2(n){ return Math.round(n * 100) / 100; }
  function attr(tag, name){ const m = new RegExp(' ' + name + '="([^"]*)"').exec(tag); return m ? m[1] : null; }
  const NAMES = ['Ana', 'Marcus', 'Sophie', 'Ivan', 'Lucy', 'Diego', 'Ellen', 'Tom', 'Aisha', 'Kai', 'Mei', 'Leo'];

  /* ---------------------------------------------------------------- shape tokens */
  const TOK = {
    'red circle': { shape: 'circle', fill: '#EB5757' },
    'blue square': { shape: 'square', fill: '#4F8FE8' },
    'green triangle': { shape: 'triangle', fill: '#27AE60' },
    'yellow star': { shape: 'star', fill: '#F2C94C' },
    'purple diamond': { shape: 'diamond', fill: '#9B51E0' },
    'orange triangle': { shape: 'triangle', fill: '#F2994A' }
  };
  const TOKNAMES = Object.keys(TOK);
  const COLOUR = {}; TOKNAMES.forEach(function(n){ COLOUR[TOK[n].fill] = n.split(' ')[0]; });

  function itemSVG(name, cx, cy, r){
    const t = TOK[name];
    const st = ' fill="' + t.fill + '" stroke="' + INK + '" stroke-width="2.5" stroke-linejoin="round"/>';
    if(t.shape === 'circle') return '<circle class="pi" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + st;
    if(t.shape === 'square') return '<rect class="pi" x="' + r2(cx - r) + '" y="' + r2(cy - r) + '" width="' + r2(2 * r) + '" height="' + r2(2 * r) + '" rx="3"' + st;
    let pts = [];
    if(t.shape === 'triangle') pts = [[cx, cy - r], [cx + r * 1.0, cy + r * 0.85], [cx - r * 1.0, cy + r * 0.85]];
    else if(t.shape === 'diamond') pts = [[cx, cy - r * 1.1], [cx + r * 0.85, cy], [cx, cy + r * 1.1], [cx - r * 0.85, cy]];
    else for(let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r * 1.1; pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
    return '<polygon class="pi" points="' + pts.map(function(p){ return r2(p[0]) + ',' + r2(p[1]); }).join(' ') + '"' + st;
  }
  function wrapSvg(w, h, inner, width){
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + (width || w) + '" role="img" style="max-width:100%;height:auto;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">' + inner + '</svg>';
  }
  /* names: array of token names, null = hidden slot drawn as a dashed "?" box */
  function rowSVG(names, o){
    o = o || {};
    const sp = 46, W = names.length * sp + 8, H = 50; let s = '';
    names.forEach(function(nm, i){
      const cx = 4 + sp / 2 + i * sp, cy = 25;
      if(nm === null) s += '<rect class="pq" x="' + (cx - 19) + '" y="6" width="38" height="38" rx="8" fill="#fff" stroke="' + INK + '" stroke-width="2.5" stroke-dasharray="5 4"/><text x="' + cx + '" y="34" text-anchor="middle" font-size="24" font-weight="900" fill="#EB5757">?</text>';
      else s += itemSVG(nm, cx, cy, 16);
    });
    return wrapSvg(W, H, s, o.width || W);
  }
  function decodeRow(html){
    const re = /<(circle|rect|polygon)\b[^>]*class="(pi|pq)"[^>]*>/g, out = []; let m;
    while((m = re.exec(html))){
      const tag = m[0];
      if(m[2] === 'pq'){ out.push(null); continue; }
      let shape;
      if(m[1] === 'circle') shape = 'circle'; else if(m[1] === 'rect') shape = 'square';
      else { const n = attr(tag, 'points').trim().split(/\s+/).length; shape = n === 3 ? 'triangle' : n === 4 ? 'diamond' : n === 10 ? 'star' : '?'; }
      out.push(COLOUR[attr(tag, 'fill')] + ' ' + shape);
    }
    return out;
  }
  function minPeriod(seq){
    for(let p = 1; p < seq.length; p++){ let ok = true; for(let i = p; i < seq.length; i++) if(seq[i] !== seq[i - p]){ ok = false; break; } if(ok) return p; }
    return seq.length;
  }
  /* seq has exactly one null: smallest repeat length consistent with the visible items that can fill it */
  function inferMissing(seq){
    const m = seq.indexOf(null);
    for(let p = 1; p < seq.length; p++){
      const map = {}; let ok = true;
      for(let i = 0; i < seq.length; i++){ if(seq[i] === null) continue; const r = i % p; if(map[r] === undefined) map[r] = seq[i]; else if(map[r] !== seq[i]){ ok = false; break; } }
      if(ok && map[m % p] !== undefined) return map[m % p];
    }
    return '?';
  }
  V.extra.lgRow = {
    render: function(names){ return rowSVG(names); },
    verify: function(args, html){ return JSON.stringify(decodeRow(html)) === JSON.stringify(args[0]) ? '' : 'pattern row does not match'; }
  };

  /* ---------------------------------------------------------------- number cards */
  function seqHTML(vals){
    let s = '<div class="nseq" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center">';
    vals.forEach(function(v, i){

  /* ---------------------------------------------------------------- matchstick figures */

  function gapQ(tpls, count){

  /* exactly ONE number breaks the rule: every other number must fit one constant jump */

  function alternatingQ(){

        explain: ex('Two jumps taking turns', [
          'The jumps are <b>+' + a + '</b> and <b>+' + b + '</b>, taking turns.',
          'The last jump was +' + lastJ + ', so the next jump is <b>+' + (n % 2 ? a : b) + '</b>.',
          vals[n - 1] + ' + ' + (n % 2 ? a : b) + ' = <b>' + ans + '</b>. ✅'
        ]),
        truth: start + Math.ceil(n / 2) * a + Math.floor(n / 2) * b,
        decode: function(){ return inferSeq(decodeSeq(vis)); },
        wrong: function(v){ return v === vals[n - 1] + lastJ ? 'That repeats the same jump as last time. The jumps take turns, so use the OTHER jump.' : ''; }
      });
    }
    throw new Error('alternatingQ failed');
  }

  function nthNumberQ(){
    const step = randInt(2, 9), start = randInt(1, 20), n = 4, N = randInt(8, 12);
    const vals = arith(start, step, n), vis = seqHTML(vals);
    const ans = start + (N - 1) * step;
    return numeric({
      prompt: 'The pattern keeps going. What is the ' + N + 'th number?', visual: vis, answer: ans,
      hint: 'The rule is the same jump each time. From the first number you need ' + (N - 1) + ' jumps to reach number ' + N + '.',
      explain: ex('The ' + N + 'th number', [
        'The jump is <b>' + step + '</b> each time, starting at ' + start + '.',
        'To reach number ' + N + ' you make <b>' + (N - 1) + '</b> jumps: ' + (N - 1) + ' × ' + step + ' = ' + (N - 1) * step + '.',
        start + ' + ' + (N - 1) * step + ' = <b>' + ans + '</b>. ✅'
      ]),
      truth: (function(){ let v = start; for(let i = 1; i < N; i++) v += step; return v; })(),
      decode: function(){ const g = decodeSeq(vis); return g[0] + (N - 1) * jump(g); },
      wrong: function(v){ return v === ans + step ? 'That is number ' + (N + 1) + '. You made one jump too many.' : (v === ans - step ? 'That is number ' + (N - 1) + '. You stopped one jump early.' : ''); }
    });
  }

  /* ---------------------------------------------------------------- matchsticks */
  function sticksQ(tier){
    const kind = pick(['squares', 'triangles']), ns = [1, 2, 3];
    const vis = sticksSVG(kind, ns);
    const thing = kind === 'squares' ? 'square' : 'triangle';
    const N = tier === 2 ? pick([4, 5]) : randInt(6, 10);
    const c = ns.map(function(n){ return stickFormula(kind, n); });
    const ans = c[0] + (N - 1) * (c[1] - c[0]);
    const d = c[1] - c[0];
    const decodeAns = function(){ const cs = decodeSticks(vis); return sticksOK(cs) ? sticksAt(cs, N) : NaN; };
    const explain = ex('Matchstick pattern', [
      'Pattern 1 uses <b>' + c[0] + '</b> sticks. Each new ' + thing + ' adds <b>' + d + '</b> more sticks (they share a stick).',
      'To get to pattern ' + N + ' we add ' + d + ' a total of ' + (N - 1) + ' times: ' + (N - 1) + ' × ' + d + ' = ' + (N - 1) * d + '.',
      c[0] + ' + ' + (N - 1) * d + ' = <b>' + ans + '</b> sticks. ✅'
    ]);
    const hint = 'Count the sticks in each pattern. How many MORE does each new ' + thing + ' need?';
    if(tier === 2){
      return mcqNum({
        prompt: 'How many sticks do you need to make pattern ' + N + ' (' + N + ' ' + thing + 's in a row)?', visual: vis, answer: ans, count: 4,
        wrong: [
          { v: (kind === 'squares' ? 4 : 3) * N, why: 'That counts every ' + thing + ' as if it had its own sticks. But neighbouring ' + thing + 's share a stick!' },
          { v: ans - d, why: 'That is the number for pattern ' + (N - 1) + '. Add one more ' + thing + '.' },
          { v: ans + d, why: 'That is pattern ' + (N + 1) + '. You added one jump too many.' },
          { v: c[2] + N, why: 'Each new ' + thing + ' needs ' + d + ' more sticks, not 1.' }
        ],
        hint: hint, explain: explain, truth: stickFormula(kind, N), decode: decodeAns
      });
    }
    const variant = chance(0.35);
    if(variant){ // reverse: how many shapes with S sticks
      const total = stickFormula(kind, N), who = pick(NAMES);
      let best = 0; for(let k = 1; k < 40; k++) if(stickFormula(kind, k) <= total) best = k;
      return numeric({
        prompt: who + ' has ' + total + ' matchsticks. How many ' + thing + 's can ' + who + ' make in a row, like this pattern?', visual: vis, answer: N,
        hint: 'Take away the first stick that starts it off. Then see how many sticks each ' + thing + ' needs.',
        explain: ex('Working backwards', [
          'Pattern 1 has ' + c[0] + ' sticks and each new ' + thing + ' adds ' + d + '.',
          total + ' − ' + c[0] + ' = ' + (total - c[0]) + ' sticks left to share out in groups of ' + d + '.',
          (total - c[0]) + ' ÷ ' + d + ' = ' + (N - 1) + ' more ' + thing + 's, plus the first one makes <b>' + N + '</b> ' + thing + 's. ✅'
        ]),
        truth: best, decode: function(){ const cs = decodeSticks(vis); return sticksOK(cs) ? (total - cs[0]) / (cs[1] - cs[0]) + 1 : NaN; },
        wrong: function(v){ return v === N - 1 ? 'The first ' + thing + ' is special — it needs ' + c[0] + ' sticks, then every other one adds ' + d + '.' : (v === Math.floor(total / c[0]) ? 'You shared sticks equally between separate ' + thing + 's, but in a row neighbours share.' : ''); }
      });
    }
    return numeric({
      prompt: 'How many sticks do you need to make pattern ' + N + ' (' + N + ' ' + thing + 's in a row)?', visual: vis, answer: ans,
      hint: hint, explain: explain, truth: stickFormula(kind, N), decode: decodeAns,
      wrong: function(v){ return v === (kind === 'squares' ? 4 : 3) * N ? 'Neighbouring ' + thing + 's share a stick, so you need fewer than that.' : (v === ans - d ? 'That is the answer for pattern ' + (N - 1) + '.' : ''); }
    });
  }

  /* ---------------------------------------------------------------- the skill */
  registerSkill({
    id: 'logic-patterns', strand: 'logic', name: 'Patterns and rules', emoji: '🔷', year: 3, order: 910, prereq: [],
    lesson: {
      title: 'Spot the pattern, find the rule',
      steps: [
        { say: 'A <b>pattern</b> is something that repeats in the same order again and again. Look: red circle, blue square, red circle, blue square…', vis: { kind: 'lgRow', args: [['red circle', 'blue square', 'red circle', 'blue square', 'red circle', 'blue square']] } },
        { say: 'To carry a pattern on, find the part that <b>repeats</b>. Here it is <b>red circle, blue square</b>. After the blue square, the repeat starts again.', vis: { kind: 'lgRow', args: [['red circle', 'blue square', 'red circle', 'blue square', 'red circle', null]] },
          quiz: { prompt: 'What goes in the box?', options: [{ label: 'Blue square', ok: true }, { label: 'Red circle', ok: false }, { label: 'Green triangle', ok: false }], right: 'Yes! The repeat is red circle, blue square. After a red circle comes a blue square.', wrong: 'The repeat is red circle, blue square. The last shape before the box is a red circle, so a blue square comes next.' } },
        { say: 'Number patterns have a <b>rule</b> too. Look at the <b>jump</b> between the numbers. 3, 6, 9, 12: each time we <b>add 3</b>.', vis: { kind: 'lgNums', args: [[3, 6, 9, 12, null]] } },
        { say: 'Patterns can <b>grow</b>. Pattern 1 has 4 sticks. Pattern 2 has 7 sticks. Pattern 3 has 10. Every new square adds <b>3 more sticks</b>.', vis: { kind: 'lgSticks', args: ['squares', [1, 2, 3]] },
          quiz: { prompt: 'How many sticks will pattern 4 need?', options: [{ label: '13', ok: true }, { label: '12', ok: false }, { label: '16', ok: false }], right: 'Yes! 10 + 3 = 13 sticks.', wrong: 'Pattern 3 has 10 sticks, and each new square adds 3. So 10 + 3 = 13.' } }
      ]
    },
    trick: {
      title: 'Find the jump, check the jump',
      say: 'For number patterns, <b>subtract two neighbours</b> to find the jump. Then <b>check</b> it with another pair. For shapes, find where the <b>first shape comes back</b>: everything before it is the repeat.',
      vis: { kind: 'lgNums', args: [[4, 9, 14, 19, null]] },
      example: '4 → 9 is +5, 9 → 14 is +5 ✅ So the rule is <b>add 5</b> and the next number is 19 + 5 = <b>24</b>.'
    },
    gen: {
      1: function(){
        const f = randInt(0, 2);
        if(f === 0) return nextQ(['AB', 'AAB', 'ABB'], 3, 1);
        if(f === 1) return gapQ(['AB', 'ABC'], 3);
        return numNextQ({ steps: [1, 2, 5, 10], down: false, nMin: 4, nMax: 5, startMin: 0, startMax: 20, count: 3 });
      },
      2: function(){
        const f = randInt(0, 6);
        if(f === 0) return nextQ(['ABC', 'AABB', 'AAB', 'ABB'], 4);
        if(f === 1) return gapQ(['ABC', 'AABB', 'AAB'], 4);
        if(f === 2) return numNextQ({ steps: [2, 3, 4, 5, 6, 7, 8, 9], down: true, nMin: 4, nMax: 5, startMin: 1, startMax: 40, count: 4 });
        if(f === 3) return ruleQ(4);
        if(f === 4) return numGapQ({ steps: [2, 3, 4, 5, 6, 7, 8, 9], startMin: 1, startMax: 40, count: 4 });
        if(f === 5) return oddNumberQ({ steps: [2, 3, 4, 5, 10], n: 6, startMin: 1, startMax: 30, big: 5, down: true });
        return sticksQ(2);
      },
      3: function(){
        const f = randInt(0, 6);
        if(f === 0) return sticksQ(3);
        if(f === 1) return nthNumberQ();
        if(f === 2) return alternatingQ();
        if(f === 3) return nthShapeQ();
        if(f === 4) return countShapeQ();
        if(f === 5) return numGapQ({ steps: [3, 4, 6, 7, 8, 9, 11, 12], startMin: 10, startMax: 90, typed: true });
        return oddNumberQ({ steps: [3, 4, 6, 7, 8, 9], n: 7, startMin: 5, startMax: 80, big: 4, down: true, idxMin: 0 });
      }
    }
  });
})();

/* ===== src/skills/measure-length.js ===== */
/* MEASURE — length: read a ruler (cm, half-cm, mm), compare lengths, choose a sensible unit.
   Every ruler question decodes the DRAWN ruler (object width against the printed numbers). */
(function(){
  const OBJ = [['pencil', '✏️'], ['crayon', '🖍️'], ['ribbon', '🎀'], ['worm', '🪱'], ['leaf', '🍃'], ['key', '🔑'], ['paper clip', '📎'], ['feather', '🪶'], ['carrot', '🥕'], ['toothbrush', '🪥'], ['snake toy', '🐍'], ['straw', '🥤'], ['fish finger', '🐟'], ['sock', '🧦']];
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function pickObj(){ return pick(OBJ); }
  function twoObjs(){ const a = pickObj(); let b = pickObj(); while(b[0] === a[0]) b = pickObj(); return [a, b]; }
  function halfTxt(v){ return Number.isInteger(v) ? v + ' cm' : Math.floor(v) + '½ cm'; }   // 7 cm, 7½ cm
  function cmTxt(v){ return v + ' cm'; }
  function mmTxt(v){ return v + ' mm'; }
  function cmmm(mm){ return mm % 10 === 0 ? (mm / 10) + ' cm' : Math.floor(mm / 10) + ' cm ' + (mm % 10) + ' mm'; }
  function rd1(x){ return Math.round(x * 10) / 10; }
  function maxFor(len, extra){ return Math.min(13, Math.ceil(len) + (extra || 1)); }

  // a ruler whose object may start away from 0 (same class names as V.ruler, so the same style of decoding works)
  function rulerAt(start, len, o){
    o = o || {};
    const maxCm = o.maxCm, x0 = 20, pxCm = Math.min(30, Math.floor(300 / maxCm));
    let s = '<rect x="10" y="44" width="' + (maxCm * pxCm + 20) + '" height="42" rx="4" fill="#FFE9A8" stroke="#1B1B2F" stroke-width="2"/>';
    for(let mm = 0; mm <= maxCm * 10; mm++){
      const x = x0 + mm * pxCm / 10, isCm = mm % 10 === 0, isHalf = mm % 5 === 0;
      s += '<line class="tk" x1="' + x.toFixed(2) + '" y1="44" x2="' + x.toFixed(2) + '" y2="' + (44 + (isCm ? 20 : (isHalf ? 14 : 8))) + '" stroke="#1B1B2F" stroke-width="' + (isCm ? 2 : 1) + '"/>';
      if(isCm) s += '<text class="lbl" data-v="' + (mm / 10) + '" x="' + x.toFixed(2) + '" y="80" text-anchor="middle" font-size="12" font-weight="800" fill="#1B1B2F">' + (mm / 10) + '</text>';
    }
    s += '<rect class="obj" x="' + (x0 + start * pxCm).toFixed(2) + '" y="8" width="' + (len * pxCm).toFixed(2) + '" height="26" rx="6" fill="var(--vis-a,#4F8FE8)" stroke="#1B1B2F" stroke-width="2"/>';
    s += '<text x="' + (x0 + (start + len / 2) * pxCm).toFixed(2) + '" y="27" text-anchor="middle" font-size="15" fill="#fff" font-weight="800">' + (o.emoji || '') + '</text>';
    const w = maxCm * pxCm + 40;
    return '<svg viewBox="0 0 ' + w + ' 92" width="' + Math.min(w, 340) + '" role="img" style="max-width:100%;height:auto;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">' + s + '</svg>';
  }
  function attr(tag, name){ const m = new RegExp(name + '="([^"]*)"').exec(tag); return m ? m[1] : null; }
  function tagsWith(html, cls){ return html.match(new RegExp('<[a-z]+[^>]*class="' + cls + '"[^>]*>', 'g')) || []; }
  function readAt(html){   // -> {start,end} in cm, read from where the object sits against the printed numbers
    const L = tagsWith(html, 'lbl').map(function(t){ return { v: parseFloat(attr(t, 'data-v')), x: parseFloat(attr(t, 'x')) }; });
    const o = tagsWith(html, 'obj')[0], ox = parseFloat(attr(o, 'x')), ow = parseFloat(attr(o, 'width'));
    const a = L[0], b = L[L.length - 1];
    function val(x){ return a.v + (x - a.x) / (b.x - a.x) * (b.v - a.v); }
    return { start: rd1(val(ox)), end: rd1(val(ox + ow)) };
  }
  function lenOf(html){ return rd1(V.decodeRuler(html)); }
  function stack(parts){   // several labelled rulers in one picture
    return '<div style="display:flex;flex-direction:column;gap:4px;align-items:center">' + parts.map(function(p){ return '<div style="font-weight:800;font-size:15px">' + p.label + '</div>' + p.svg; }).join('') + '</div>';
  }

  // sensible units: size in mm decides the unit (independent of the table's own "unit" field)
  const THINGS = [
    ['the thickness of a coin', 2], ['a grain of rice', 6], ['an ant', 4], ['a ladybird', 7],
    ['a pencil', 150], ['a school book', 250], ['your hand span', 180], ['a shoe', 200], ['a pencil case', 220], ['a snail', 60], ['a mobile phone', 140],
    ['a door', 2000], ['a classroom floor', 8000], ['a bus', 11000], ['a swimming pool', 25000], ['a football pitch', 100000], ['a tall tree', 15000], ['a playground', 40000],
    ['the way from London to Brighton', 80000000], ['a walk to school', 1200000], ['a long train journey', 250000000]
  ];
  function unitFor(mm){ return mm < 20 ? 'mm' : mm < 1000 ? 'cm' : mm < 1000000 ? 'm' : 'km'; }
  const UN = { mm: 'millimetres (mm)', cm: 'centimetres (cm)', m: 'metres (m)', km: 'kilometres (km)' };
  const UWHY = {
    mm: 'This is a tiny length, so we need the tiniest unit: millimetres.',
    cm: 'This is a small length, bigger than a few mm but much shorter than a metre: centimetres.',
    m: 'This is a long length, much more than a metre rule: metres.',
    km: 'This is a very long way — we use kilometres for journeys.'
  };
  function unitQ(tier){
    let pool = THINGS.filter(function(t){ return tier === 1 ? (t[1] >= 100 && t[1] <= 100000) && unitFor(t[1]) !== 'mm' : true; });
    const t = pick(pool);
    const u = unitFor(t[1]);
    const sets = { mm: ['mm', 'cm', 'm'], cm: ['mm', 'cm', 'm'], m: ['cm', 'm', 'km'], km: ['m', 'km', 'cm'] };
    const alts = sets[u].filter(function(x){ return x !== u; });
    const ds = alts.map(function(x){ return opt(K.text(x), UN[x], 'Not quite: ' + UN[x] + ' is not the best fit here. ' + UWHY[u]); });
    return mcq({
      prompt: 'Which unit is best for measuring ' + t[0] + '?', visual: '',
      correct: opt(K.text(u), UN[u]), distractors: ds, count: 3,
      hint: 'Picture it. A millimetre is tiny (a pinhead), a centimetre is a fingertip width, a metre is a big stride, a kilometre is a walk.',
      explain: ex('Choosing a unit', ['Think about how big ' + t[0] + ' is.', UWHY[u], 'The best unit is <b>' + UN[u] + '</b>. ✅']),
      truth: K.text(['mm', 'cm', 'm', 'km'][(t[1] >= 20) + (t[1] >= 1000) + (t[1] >= 1000000)])
    });
  }

  registerSkill({
    id: 'measure-length', strand: 'measure', name: 'Measuring length with a ruler', emoji: '📏', year: 3, order: 610, prereq: ['number-place-value'],
    lesson: {
      title: 'Using a ruler',
      steps: [
        { say: 'Put one end of the object on the <b>0</b>. Then read the number at the <b>other end</b>. This pencil ends at the 6, so it is <b>6 cm</b> long. (cm means centimetres.)', vis: { kind: 'ruler', args: [6, { emoji: '✏️' }] } },
        { say: 'Sometimes the end is <b>between</b> two numbers. The longer little line halfway is <b>half a centimetre</b>. This ribbon ends halfway after 7, so it is <b>7½ cm</b>.', vis: { kind: 'ruler', args: [7.5, { emoji: '🎀' }] } },
        { say: 'The tiny lines are <b>millimetres</b> (mm). There are <b>10 mm</b> in 1 cm. This leaf is 4 cm and 3 small marks: <b>4 cm 3 mm</b>, which is <b>43 mm</b>.', vis: { kind: 'ruler', args: [4.3, { emoji: '🍃' }] },
          quiz: { prompt: 'A key is 5 cm 2 mm long. How many millimetres is that?', options: [{ label: '52 mm', ok: true }, { label: '7 mm', ok: false }, { label: '502 mm', ok: false }], right: 'Yes! 5 cm = 50 mm, plus 2 mm makes 52 mm.', wrong: '5 cm is 5 × 10 = 50 mm. Then add the 2 extra mm: 52 mm.' } },
        { say: 'Pick a <b>sensible unit</b>: <b>mm</b> for tiny things, <b>cm</b> for pencils and books, <b>m</b> for rooms, <b>km</b> for long journeys.',
          vis: { kind: 'html', args: ['<div style="font:700 17px system-ui;line-height:1.7;text-align:center">🐜 ant → <b>mm</b><br>✏️ pencil → <b>cm</b><br>🚪 door → <b>m</b><br>🚌 bus trip → <b>km</b></div>'] },
          quiz: { prompt: 'Which unit would you use for the length of a classroom?', options: [{ label: 'metres (m)', ok: true }, { label: 'millimetres (mm)', ok: false }, { label: 'centimetres (cm)', ok: false }], right: 'Yes! A classroom is long, so we use metres.', wrong: 'A classroom is much longer than a pencil. Metres are the best unit.' } }
      ]
    },
    trick: {
      title: 'Start at zero, big marks then small',
      say: 'First check the object starts exactly at <b>0</b>. Then say the last <b>big number</b> you pass, then count the <b>small marks</b> after it. 5 is half-way between big numbers, 1 mark = 1 mm.',
      vis: { kind: 'ruler', args: [9.4, { emoji: '🥕' }] },
      example: 'Last big number is <b>9</b>, then <b>4</b> small marks: <b>9 cm 4 mm</b> = 94 mm'
    },
    gen: {
      1: function(){ return pick([t1Read, t1Read, t1Read, t1Longer, t1Unit])(); },
      2: function(){ return pick([t2Half, t2Half, t2Longer, t2Diff, t2Nearest, t2Unit])(); },
      3: function(){ return pick([t3Mm, t3Mm, t3CmMm, t3Offset, t3OffsetHalf, t3DiffMm, t3Words])(); }
    }
  });

  /* ------------------------------ tier 1 ------------------------------ */
  function t1Read(){
    const len = randInt(2, 12), ob = pickObj(), mx = Math.min(13, len + randInt(1, 3));
    const vis = V.ruler(len, { emoji: ob[1], maxCm: mx });
    return mcqNum({
      prompt: 'How long is the ' + ob[0] + '?', visual: vis, answer: len, fmt: cmTxt,
      wrong: [
        { v: len + 1, why: 'The ' + ob[0] + ' starts at 0, not 1. Read the number at the END of the ' + ob[0] + '.' },
        { v: len - 1, why: 'Look again: the ' + ob[0] + ' reaches the ' + len + ', not the number before it.' },
        { v: mx, why: 'That is where the ruler ends, not where the ' + ob[0] + ' ends.' }
      ],
      nearby: [2, -2, 3, -3],
      valid: function(v){ return v > 0; },
      hint: 'The ' + ob[0] + ' starts at 0. Find the number just under the other end.',
      explain: ex('Reading the ruler', ['The ' + ob[0] + ' starts at <b>0</b>.', 'Its other end is exactly on the <b>' + len + '</b>.', 'So the ' + ob[0] + ' is <b>' + len + ' cm</b> long. ✅']),
      truth: (len + 5) - 5, decode: function(){ return lenOf(vis); }
    });
  }
  function t1Longer(){
    const o = twoObjs(), a = randInt(3, 11);
    let b; do { b = randInt(3, 11); } while(Math.abs(a - b) < 2);
    const mx = Math.min(13, Math.max(a, b) + 1);
    const va = V.ruler(a, { emoji: o[0][1], maxCm: mx }), vb = V.ruler(b, { emoji: o[1][1], maxCm: mx });
    const vis = stack([{ label: 'The ' + o[0][0], svg: va }, { label: 'The ' + o[1][0], svg: vb }]);
    const longer = a > b ? o[0] : o[1], shorter = a > b ? o[1] : o[0];
    return mcq2({
      prompt: 'Which is longer, the ' + o[0][0] + ' or the ' + o[1][0] + '?', visual: vis,
      correct: opt(K.text(longer[0]), 'The ' + longer[0]),
      other: opt(K.text(shorter[0]), 'The ' + shorter[0], 'Read both rulers: the ' + shorter[0] + ' is the shorter one (' + Math.min(a, b) + ' cm, not ' + Math.max(a, b) + ' cm).'),
      hint: 'Read each ruler at the end of the object. The bigger number is the longer object.',
      explain: ex('Comparing lengths', ['The ' + o[0][0] + ' is <b>' + a + ' cm</b>.', 'The ' + o[1][0] + ' is <b>' + b + ' cm</b>.', Math.max(a, b) + ' is more than ' + Math.min(a, b) + ', so <b>The ' + longer[0] + '</b> is longer. ✅']),
      truth: K.text([[a, o[0][0]], [b, o[1][0]]].sort(function(x, y){ return y[0] - x[0]; })[0][1]),
      decode: function(){ return K.text(lenOf(va) > lenOf(vb) ? o[0][0] : o[1][0]); }
    });
  }
  function t1Unit(){ return unitQ(1); }

  /* ------------------------------ tier 2 ------------------------------ */
  function halfWrongs(len){
    const f = Math.floor(len), half = !Number.isInteger(len);
    if(half) return [
      { v: f, why: 'The end is past the ' + f + ' — it is half way to ' + (f + 1) + '. Do not forget the half.' },
      { v: f + 1, why: 'The end has not reached ' + (f + 1) + ' yet. It is half way between ' + f + ' and ' + (f + 1) + '.' },
      { v: len + 1, why: 'Count from 0 and use the long half-way mark.' },
      { v: len - 1, why: 'Look at the end of the object again: it is after the ' + f + '.' }
    ];
    return [
      { v: len + 0.5, why: 'The end is exactly ON the number ' + len + ' — there is no extra half.' },
      { v: len - 0.5, why: 'The end is exactly on the number ' + len + ', not half way before it.' },
      { v: len + 1, why: 'The object starts at 0. Read the number at the end.' },
      { v: len - 1, why: 'Look again: the end reaches ' + len + '.' }
    ];

/* MEASURE — money: coins and notes, £ and p, adding, change, "enough money?" (all amounts kept in PENCE) */
(function(){
  const NAMES = ['Ana', 'Marcus', 'Sophie', 'Ivan', 'Lucy', 'Diego', 'Ellen', 'Tom', 'Aisha', 'Kai', 'Mei', 'Leo'];
  const ITEMS = ['a bun', 'an apple', 'a pencil', 'a rubber', 'a lolly', 'a comic', 'a sticker book', 'a balloon', 'a postcard', 'a bookmark', 'a keyring', 'a banana', 'a sharpener', 'a cookie'];
  const ITEM_PL = ['buns', 'apples', 'pencils', 'rubbers', 'lollies', 'comics', 'sticker books', 'balloons', 'postcards', 'bookmarks', 'keyrings', 'bananas', 'sharpeners', 'cookies'];

  function mt(p){ return p < 100 ? p + 'p' : '£' + (p % 100 === 0 ? String(p / 100) : (p / 100).toFixed(2)); }   // natural text
  function fp(p){ return '£' + (p / 100).toFixed(2); }                                                           // option label, pounds mode
  function fq(p){ return p + 'p'; }                                                                              // option label, pence mode
  function fmtFor(a){ return a >= 100 ? fp : fq; }
  function sumKey(list){ const c = {}; list.forEach(function(d){ c[d] = (c[d] || 0) + 1; }); return Object.keys(c).reduce(function(t, d){ return t + (+d) * c[d]; }, 0); }  // independent: denomination x how many
  function sum(list){ return list.reduce(function(a, b){ return a + b; }, 0); }
  function desc(list){ return list.slice().sort(function(a, b){ return b - a; }); }

  // a random, tidy way to make `total` from the pool (few coins), largest first
  function coinsFor(total, pool, maxN){
    for(let t = 0; t < 80; t++){
      let rem = total; const out = [];
      while(rem > 0 && out.length <= maxN){
        const ok = pool.filter(function(d){ return d <= rem; });
        const c = chance(0.55) ? Math.max.apply(null, ok) : pick(ok);
        out.push(c); rem -= c;
      }
      if(rem === 0 && out.length <= maxN) return desc(out);
    }
    const out = []; let rem = total;
    pool.slice().sort(function(a, b){ return b - a; }).forEach(function(d){ while(rem >= d){ out.push(d); rem -= d; } });
    return out;
  }
  function phrase(arr){ return arr.length > 1 ? arr.map(mt).join(' + ') + ' = <b>' + mt(sum(arr)) + '</b>' : '<b>' + mt(arr[0]) + '</b>'; }
  function addUp(list){   // explanation lines for adding coins
    const big = list.filter(function(c){ return c >= 100; }), small = list.filter(function(c){ return c < 100; });
    const st = [];
    if(big.length && small.length){
      st.push('Pounds first: ' + phrase(big) + '.');
      st.push('Now the pence: ' + phrase(small) + '.');
    } else if(list.length > 1) {
      st.push('Add them one at a time: ' + phrase(list) + '.');
    } else {
      st.push('There is just one coin, worth <b>' + mt(list[0]) + '</b>.');
    }
    return st;
  }
  function two(){ const a = randInt(0, ITEMS.length - 1); let b = randInt(0, ITEMS.length - 1); while(b === a) b = randInt(0, ITEMS.length - 1); return [ITEMS[a], ITEMS[b]]; }
  // the "count up" way of finding change, as words
  function countUp(price, pay){
    const next = Math.ceil(price / 10) * 10;
    if(price % 100 === 0 || pay - price <= 0) return '';
    const bits = [];
    let cur = price;
    if(next > cur && next < pay){ bits.push(mt(next - cur) + ' to reach ' + mt(next)); cur = next; }
    const nextP = Math.ceil(cur / 100) * 100;
    if(nextP > cur && nextP < pay){ bits.push(mt(nextP - cur) + ' to reach ' + mt(nextP)); cur = nextP; }
    bits.push(mt(pay - cur) + ' to reach ' + mt(pay));
    return 'Count up from ' + mt(price) + ': ' + bits.join(', then ') + '.';
  }

  registerSkill({
    id: 'measure-money', strand: 'measure', name: 'Money: coins, £ and p, change', emoji: '🪙', year: 3, order: 660, prereq: ['number-place-value'],
    lesson: {

        { say: 'Every coin has a <b>value</b>. To find how much money you have, add up what each coin is <b>worth</b>. Here: 10p + 5p + 2p = <b>17p</b>.', vis: { kind: 'coins', args: [[10, 5, 2]] } },
        { say: 'A pound coin is worth <b>100p</b>. So <b>£1</b> and a 50p coin make 100p + 50p = <b>150p</b>.', vis: { kind: 'coins', args: [[100, 50]] } },
        { say: 'We can write money with a <b>£ sign and a point</b>. 100p + 45p = 145p = <b>£1.45</b>. The numbers after the point are the pence.', vis: { kind: 'coins', args: [[100, 20, 20, 5]] },
          quiz: { prompt: 'How many pence is £1.45?', options: [{ label: '145p', ok: true }, { label: '14p', ok: false }, { label: '1450p', ok: false }], right: 'Yes! £1 is 100p, and 45p more makes 145p.', wrong: 'Think: £1 is 100p, then add the 45p. That is 145p.' } },
        { say: '<b>Change</b> is what the shop gives back. Pay £1 for a 65p lolly? Count up: 65p → 70p is 5p, 70p → £1 is 30p. 5p + 30p = <b>35p</b> change.', vis: { kind: 'coins', args: [[20, 10, 5]] } },
        { say: 'To check if you have <b>enough</b> money, add up your coins, then compare with the price. 70p is <b>not enough</b> for a 75p cookie: you need 5p more.', vis: { kind: 'coins', args: [[50, 20]] },
          quiz: { prompt: 'You have these coins (70p). A balloon costs 60p. Is it enough?', options: [{ label: 'Yes, 70p is more than 60p', ok: true }, { label: 'No, it is not enough', ok: false }], right: 'Yes! 70p is more than 60p, so you have enough.', wrong: '70p is bigger than 60p, so you do have enough.' } }
      ]
    },
    trick: {
      title: 'Count up to give change',
      say: 'Do not take away — <b>count up</b> like a shopkeeper! Start at the price, jump to the next <b>10p</b>, then jump to the next <b>pound</b>. Add the jumps up and that is your change.',
      vis: { kind: 'coins', args: [[20, 10, 5]] },
      example: 'Price 65p, pay £1: 65p → 70p (<b>5p</b>) → £1 (<b>30p</b>). 5p + 30p = <b>35p change</b>'
    },
    gen: {

        return pick([t1Coins, t1Coins, t1Pounds, t1Which])();
      },

  /* ------------------------------ tier 1 ------------------------------ */
  function t1Coins(){

    list = desc(list);
    const vis = V.coins(list);
    return mcqNum({
      prompt: 'How much money is this?', visual: vis, answer: total, fmt: fq,
      wrong: [

        { v: total - list[0], why: 'It looks like the biggest coin was left out. Add every coin.' },
        { v: total + list[list.length - 1], why: 'One coin was counted twice. Add each coin just once.' }
      ],
      nearby: [10, -10, 5, -5, 1, -1, 2, -2, 20, -20],

      explain: ex('Adding coins', ['Each coin shows its value: ' + list.map(mt).join(', ') + '.'].concat(addUp(list)).concat(['So the money is <b>' + fq(total) + '</b>. ✅'])),
      truth: sumKey(list), decode: function(){ return V.decodeCoins(vis); }
    });
  }
  function t1Pounds(){
    const N = randInt(1, 5);

      prompt: '£' + N + ' is the same as how many pence?', answer: N * 100, fmt: fq,
      wrong: [

(function(){

    o.push(opt(K.text(sent(g, p, t + p)), sent(g, p, t + p), 'The × sentence is right but the total is one group too big. ' + g + ' groups of ' + p + ' is ' + t + '.'));
    o.push(opt(K.text(sent(g, p, t - p)), sent(g, p, t - p), 'The × sentence is right but the total is one group too small. ' + g + ' groups of ' + p + ' is ' + t + '.'));
    if(g !== p){

      o.push(opt(K.text(sent(g, g, g * g)), sent(g, g, g * g), 'That uses ' + g + ' twice. There are ' + g + ' groups with ' + p + ' in each.'));

    o.push(opt(K.text(g + ' + ' + p + ' = ' + t), g + ' + ' + p + ' = ' + t, 'Adding ' + g + ' and ' + p + ' makes ' + (g + p) + ', not ' + t + '. Use × for equal groups.'));

  /* independent truth: step up/down one jump at a time */
  function walk(n, step, more){

  function word(more){ return more ? 'more' : 'less'; }
