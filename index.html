<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Matemagics</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#3a1f39">
<style>
:root{
  --accent:#9B51E0; --accent2:#F2A6D8; --good:#27AE60; --bad:#EB5757; --warm:#F2C94C;
  --bg1:#3a1f39; --bg2:#9B51E0; --card:#ffffff; --ink:#1B1B2F; --ink-soft:#5b5b72;
  --vis-ink:#1B1B2F; --vis-a:#4F8FE8; --vis-b:#9B51E0; --vis-warm:#F2C94C; --vis-soft:#EEF1FB; --vis-good:#27AE60; --vis-bad:#EB5757;
  --radius:22px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overscroll-behavior:none;}
body{
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:linear-gradient(160deg,var(--bg1),var(--bg2)); background-attachment:fixed;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
#app{position:fixed; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:calc(14px + var(--safe-t)) 14px calc(28px + var(--safe-b));}
.wrap{max-width:560px; margin:0 auto;}
h1,h2,h3,p{margin:0;}
.white{color:#fff;}
.center{text-align:center;}
.row{display:flex; align-items:center; gap:10px;}
.between{justify-content:space-between;}
.grow{flex:1;}
.gap{height:12px;}
.gap2{height:20px;}

/* ---------- buttons ---------- */
.btn{border:none; border-radius:18px; padding:15px 22px; font-size:18px; font-weight:900; color:#fff; background:var(--accent); box-shadow:0 5px 0 rgba(0,0,0,.22); cursor:pointer; font-family:inherit; min-height:52px;}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.22);}
.btn.good{background:var(--good);} .btn.warm{background:var(--warm); color:#3a2a00;} .btn.ghost{background:#ffffff26; box-shadow:none; color:#fff;}
.btn.small{font-size:15px; padding:10px 14px; min-height:42px; border-radius:14px;}
.btn.block{display:block; width:100%;}
.btn[disabled]{opacity:.45; box-shadow:none;}
.icon-btn{background:#ffffff26; color:#fff; border:none; border-radius:14px; min-width:44px; min-height:44px; font-size:22px; font-family:inherit;}
.pill{display:inline-flex; align-items:center; gap:6px; background:#ffffff2b; color:#fff; border-radius:999px; padding:7px 14px; font-weight:900; font-size:16px;}
.pill.warn{background:#F2994Aaa;} .pill.danger{background:#EB5757cc;}

/* ---------- cards ---------- */
.card{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:0 8px 24px rgba(0,0,0,.2);}
.card.glass{background:#ffffff1f; color:#fff; box-shadow:none;}
.card + .card, .card + .gap{margin-top:12px;}
.title{font-size:28px; font-weight:900; color:#fff; line-height:1.15;}
.subtitle{font-size:17px; color:#ffffffd9; line-height:1.45;}
.muted{color:var(--ink-soft);} .small{font-size:14px;}
.mascot{font-size:64px; line-height:1; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)); animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes rise{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
.pop{animation:pop .45s ease-out;} .rise{animation:rise .35s ease-out;} .shake{animation:shake .35s;}
@media (prefers-reduced-motion:reduce){ .mascot,.pop,.rise,.shake{animation:none;} }

/* ---------- hub ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
.hero{display:flex; align-items:center; gap:14px; padding:16px; border-radius:var(--radius); background:#ffffff1f; color:#fff;}
.xpbar{height:12px; border-radius:99px; background:#00000033; overflow:hidden;}
.xpbar>i{display:block; height:100%; background:linear-gradient(90deg,var(--warm),#fff3b0); border-radius:99px; transition:width .6s;}
.quest{background:linear-gradient(135deg,#fff,#fff7d6); border:3px solid var(--warm);}
.quest h3{font-size:20px; margin-bottom:8px;}
.task{display:flex; align-items:center; gap:10px; padding:8px 0; font-weight:800; font-size:16px;}
.task .chk{width:28px; height:28px; border-radius:50%; border:3px solid #bbb; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;}
.task.done .chk{background:var(--good); border-color:var(--good); color:#fff;}
.region{display:flex; align-items:center; gap:12px; padding:14px; border-radius:var(--radius); background:#fff; margin-top:10px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.18);}
.region .em{font-size:34px; width:54px; height:54px; border-radius:16px; display:flex; align-items:center; justify-content:center; flex:none;}
.region b{font-size:18px;} .region .sub{font-size:13px; color:var(--ink-soft); font-weight:700;}
.ring{--p:0; width:50px; height:50px; border-radius:50%; background:conic-gradient(var(--good) calc(var(--p)*1%), #e6e8f0 0); display:flex; align-items:center; justify-content:center; flex:none;}
.ring span{width:38px; height:38px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900;}
.menu-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px;}
.menu-grid button{background:#ffffff26; border:none; color:#fff; border-radius:18px; padding:12px 4px; font-weight:900; font-size:13px; font-family:inherit;}
.menu-grid button .em{display:block; font-size:28px; margin-bottom:2px;}
.goal{display:flex; align-items:center; gap:10px; background:#ffffff1f; color:#fff; border-radius:18px; padding:10px 14px; margin-top:12px;}

/* ---------- skill path ---------- */
.node{display:flex; align-items:center; gap:12px; padding:12px; border-radius:20px; background:#fff; margin-top:10px; cursor:pointer; box-shadow:0 5px 14px rgba(0,0,0,.16); position:relative;}
.node.locked{opacity:.6; background:#ffffffd0;}
.node .em{font-size:30px; width:50px; height:50px; border-radius:50%; background:var(--vis-soft); display:flex; align-items:center; justify-content:center; flex:none;}
.node b{font-size:17px; display:block;} .node .sub{font-size:13px; color:var(--ink-soft); font-weight:700;}
.medals{display:flex; gap:3px; font-size:20px; margin-left:auto; flex:none;}
.medal{filter:grayscale(1); opacity:.35;} .medal.on{filter:none; opacity:1;}
.tag{font-size:11px; font-weight:900; padding:3px 8px; border-radius:999px; background:#EEF1FB; color:#4a4a68; margin-left:6px; vertical-align:middle;}
.tag.y4{background:#E6D4FF; color:#5b2a9b;} .tag.wobbly{background:#FFE2C2; color:#9a4b00;}

/* ---------- question ---------- */
.progress{display:flex; gap:6px; margin:6px 0 12px;}
.progress i{flex:1; height:10px; border-radius:99px; background:#ffffff40;}
.progress i.cur{background:#fff;} .progress i.ok{background:#6FCF97;} .progress i.half{background:var(--warm);} .progress i.bad{background:#EB5757;}
.qcard{background:#fff; border-radius:26px; padding:16px; box-shadow:0 10px 28px rgba(0,0,0,.25);}
.qvis{display:flex; justify-content:center; align-items:center; min-height:20px; margin-bottom:10px; padding:4px; overflow-x:auto;}
.qvis:empty{display:none;}
.qprompt{font-size:21px; font-weight:900; line-height:1.3; text-align:center; margin:4px 2px 14px;}
.opts{display:grid; gap:10px;}
.opts.vis{grid-template-columns:1fr 1fr;} .opts.vis.three{grid-template-columns:1fr 1fr;}
.opt{border:3px solid #d9dcf0; background:#f7f8ff; border-radius:18px; min-height:58px; padding:10px 12px; font-size:21px; font-weight:900; color:var(--ink); font-family:inherit; display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer;}
.opt:active{transform:scale(.98);}
.opt.vis{min-height:104px; padding:6px;}
.opt.correct{background:#d8f6e3; border-color:var(--good);} .opt.incorrect{background:#ffe0e0; border-color:var(--bad); animation:shake .35s;} .opt.dim{opacity:.35;}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1; margin:0 2px;}
.frac .fn{border-bottom:3px solid currentColor; padding:0 6px 3px; font-weight:900;} .frac .fd{padding-top:3px; font-weight:900;}
.hintbar{margin-top:12px; text-align:center;}
.hint-text{margin-top:10px; background:#FFF3C4; color:#5b4600; border-radius:16px; padding:12px; font-size:16px; text-align:left; line-height:1.45; font-weight:700;}
.explain{margin-top:14px; background:#EEF1FB; border-radius:18px; padding:14px; font-size:17px; line-height:1.5; text-align:left; animation:rise .3s;}
.explain .eh{font-weight:900; font-size:18px; margin-bottom:6px;}
.explain .step{padding:6px 0; border-bottom:1px dashed #cfd3ea;} .explain .step:last-child{border-bottom:none;}
.explain b{color:var(--accent);}
.why{margin-top:12px; background:#FFF0E0; border-left:6px solid #F2994A; border-radius:12px; padding:10px 12px; font-weight:800; font-size:16px; line-height:1.4; text-align:left;}
.feedback{margin-top:12px; font-size:22px; font-weight:900; text-align:center;}
.feedback.ok{color:var(--good);} .feedback.no{color:#c0392b;}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
.keypad button{background:#f1f3ff; border:3px solid #d9dcf0; border-radius:16px; min-height:54px; font-size:24px; font-weight:900; font-family:inherit; color:var(--ink);}
.numdisplay{min-height:62px; border:3px dashed #b9bde0; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:900; gap:8px; background:#fbfbff;}
.numdisplay .unit{font-size:20px; color:var(--ink-soft);} .numdisplay .ph{color:#c3c6e0;}
.seglist{display:flex; gap:6px; justify-content:center; margin:6px 0 10px;}
.seg{flex:1; max-width:60px; height:64px; border:4px solid var(--ink); border-radius:10px; background:#fff; cursor:pointer;} .seg.on{background:var(--vis-a);}
.clockctl{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:8px 0;}
.chip{border:3px solid #d9dcf0; background:#f7f8ff; border-radius:16px; padding:10px 16px; font-size:22px; font-weight:900; min-width:56px; text-align:center; font-family:inherit; color:var(--ink);}
.chip.used{opacity:.25;} .chip.picked{background:#d8e8ff; border-color:var(--vis-a);}
.slots{display:flex; gap:6px; justify-content:center; margin:8px 0; flex-wrap:wrap;}
.slot{min-width:56px; min-height:52px; border:3px dashed #b9bde0; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; background:#fbfbff;}
.slot.filled{border-style:solid; border-color:var(--vis-a); background:#eaf2ff;}
.speak{border:none; background:#EEF1FB; border-radius:12px; font-size:20px; min-width:40px; min-height:40px; float:right; margin:-4px 0 4px 8px;}

/* ---------- lesson ---------- */
.lesson-card{background:#fff; border-radius:26px; padding:18px; box-shadow:0 10px 28px rgba(0,0,0,.25);}
.lesson-say{font-size:20px; line-height:1.45; font-weight:700;} .lesson-say b{color:var(--accent);}
.trickcard{background:linear-gradient(135deg,#FFF7D6,#FFE0F3); border:4px solid var(--warm); border-radius:26px; padding:18px; text-align:center;}
.trickcard h3{font-size:24px; margin:6px 0;}
.badgeline{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px;}
.badge{background:#ffffff2e; color:#fff; border-radius:999px; padding:6px 12px; font-weight:900; font-size:15px;}

/* ---------- stickers ---------- */
.sgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px;}
.sticker{aspect-ratio:1; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:38px; position:relative; border:4px solid #ffffffaa; box-shadow:0 4px 10px rgba(0,0,0,.2);}
.sticker .acc{position:absolute; top:-4px; right:-2px; font-size:22px;} .sticker .cnt{position:absolute; bottom:2px; right:6px; font-size:12px; font-weight:900; background:#0007; color:#fff; border-radius:8px; padding:0 6px;}
.sticker.rare{border-color:#56CCF2;} .sticker.epic{border-color:#BB6BD9; box-shadow:0 0 14px #BB6BD9;} .sticker.legendary{border-color:#F2C94C; box-shadow:0 0 18px #F2C94C; animation:glow 2s infinite;}
@keyframes glow{50%{box-shadow:0 0 28px #fff3b0;}}
.sticker.big{width:150px; height:150px; font-size:88px; margin:0 auto; aspect-ratio:auto;}
.rarity{display:inline-block; font-weight:900; font-size:14px; padding:3px 12px; border-radius:99px; background:#ffffff33; color:#fff; text-transform:uppercase; letter-spacing:1px;}

/* ---------- rewards ---------- */
.reward-card{display:flex; align-items:center; gap:12px; background:#fff; border-radius:20px; padding:12px; margin-top:10px;}
.reward-card.locked{opacity:.75;} .rc-emoji{font-size:34px;} .rc-body{flex:1;} .rc-title{font-weight:900; font-size:16px;} .rc-cost{font-size:13px; color:var(--ink-soft); font-weight:800;}

/* ---------- parent ---------- */
.parent h3{margin:16px 0 8px; color:#fff; font-size:19px;}
.prow{display:flex; align-items:center; justify-content:space-between; gap:8px; background:#ffffff1f; color:#fff; border-radius:14px; padding:10px 12px; margin-top:6px; font-size:15px;}
.pbar{flex:1; height:10px; background:#00000033; border-radius:99px; overflow:hidden; margin:0 8px; min-width:50px;} .pbar>i{display:block; height:100%; background:var(--good);}
.seg-btn{background:#ffffff2b; color:#fff; border:none; border-radius:12px; padding:8px 12px; font-weight:900; font-size:14px; font-family:inherit;} .seg-btn.on{background:var(--warm); color:#3a2a00;}
.input{width:100%; border:none; border-radius:12px; padding:11px; font-size:16px; font-family:inherit;}
.err{background:#fff; border-radius:14px; padding:10px 12px; margin-top:8px; color:var(--ink); font-size:14px; line-height:1.4;}
.err b{color:#c0392b;}
.confetti{position:fixed; top:-12px; width:10px; height:14px; border-radius:2px; z-index:99; animation:fall 2.1s linear forwards; pointer-events:none;}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);}}
.toast{position:fixed; left:50%; bottom:calc(24px + var(--safe-b)); transform:translateX(-50%); background:#1B1B2F; color:#fff; padding:12px 18px; border-radius:16px; font-weight:800; z-index:100; animation:rise .3s; max-width:88vw; text-align:center;}

</style></head><body><div id="app"></div>
<script>
/* ===== src/core.js ===== */
/* =====================================================================
   MATEMAGICS v4 — CORE
   Runs unchanged in the browser and in Node (tools/audit.js).
   Everything a skill needs: RNG, text helpers, question builders,
   the skill registry and the validator that guards every question.
   ===================================================================== */
/* ---------- Seedable RNG (seed only used by the auditor; app uses Math.random) ---------- */
let _seed = null;
function setSeed(s){ _seed = (s === null || s === undefined) ? null : (s >>> 0); }
function rng(){
  if(_seed === null) return Math.random();
  _seed = (Math.imul(_seed, 1664525) + 1013904223) >>> 0;
  return _seed / 4294967296;
}
function randInt(a, b){ return a + Math.floor(rng() * (b - a + 1)); }
function pick(arr){ return arr[Math.floor(rng() * arr.length)]; }
function chance(p){ return rng() < p; }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function sample(arr, n){ return shuffle(arr).slice(0, n); }

/* ---------- Text helpers ---------- */
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function gcd(a, b){ return b === 0 ? a : gcd(b, a % b); }
function stripTags(s){ return String(s).replace(/<\/span><span class="fd">/g, '/').replace(/<[^>]*>/g, '').replace(/&[a-z]+;/g, ' ').replace(/\s+/g, ' ').trim(); }
function money(pence){ return pence >= 100 ? '£' + (pence / 100).toFixed(2) : pence + 'p'; }
function numWord(n){
  const w = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
  return (n >= 0 && n <= 12) ? w[n] : String(n);
}
/* Stacked fraction for option labels / text: fracHTML(3,4). stripTags() reads it back as "3/4". */
function fracHTML(n, d){ return '<span class="frac"><span class="fn">' + n + '</span><span class="fd">' + d + '</span></span>'; }
/* Explanation builder: title + array of steps -> HTML. Use <b> for the key numbers. */
function ex(title, steps){
  let html = '<div class="eh">🧠 ' + title + '</div>';
  steps.forEach(function(s){ html += '<div class="step">' + s + '</div>'; });
  return html;
}

/* ---------- Canonical keys ----------
   Every answer has a KEY. Two options with the same key mean the same thing,
   so the engine will never offer both (this is what stops "2/4" next to "1/2"
   or two clock faces showing the same time). */
const K = {
  num:  function(n){ return 'n:' + (Math.round(n * 1e6) / 1e6); },
  frac: function(n, d){ const g = gcd(Math.abs(n), d) || 1; return 'f:' + (n / g) + '/' + (d / g); },
  time: function(h, m){ return 't:' + ((((h % 12) * 60 + m) % 720 + 720) % 720); },       // 12-hour clock position
  time24: function(h, m){ return 'T:' + (h * 60 + m); },
  text: function(s){ return 's:' + String(s).toLowerCase().trim(); },
  bool: function(b){ return 'b:' + (b ? 'yes' : 'no'); }
};

/* ---------- Skill registry ---------- */
const SKILLS = [];
function registerSkill(def){
  const need = ['id','strand','name','emoji','year','lesson','trick','gen'];
  need.forEach(function(k){ if(def[k] === undefined) throw new Error('Skill ' + (def.id || '?') + ' missing "' + k + '"'); });
  if(SKILLS.some(function(s){ return s.id === def.id; })) throw new Error('Duplicate skill id ' + def.id);
  [1,2,3].forEach(function(t){ if(typeof def.gen[t] !== 'function') throw new Error('Skill ' + def.id + ' missing gen[' + t + ']'); });
  def.prereq = def.prereq || [];
  def.order = def.order || 0;
  SKILLS.push(def);
  return def;
}
function skillById(id){ for(let i = 0; i < SKILLS.length; i++) if(SKILLS[i].id === id) return SKILLS[i]; return null; }

/* =====================================================================
   QUESTION BUILDERS
   Every question is a plain object:
   { type:'mcq'|'num'|'shade'|'setclock'|'order',
     prompt, visual(html), hint, explain(html),
     options:[{key,label}], correct(index)          <- mcq only
     answer(number)                                  <- num only
     model:{...}                                     <- interactive types
     correctKey                                      <- canonical key of the right answer
     truthKey                                        <- SAME answer recomputed independently from the raw data
     decodeKey()                                     <- (optional) reads the answer back out of the DRAWN visual
     wrongWhy(respKey)->string                       <- targeted feedback for a typical mistake
     skill, tier }
   The validator (validateQuestion) refuses anything inconsistent.
   ===================================================================== */

/* opt(): build an option. label may contain HTML (e.g. a drawn clock) */
function opt(key, label, why){ return { key: key, label: String(label), why: why || '' }; }

/* mcq: one correct option + distractors. Distractors whose KEY equals the correct key,
   or another distractor, are silently dropped. Throws when fewer than (count-1) remain. */
function mcq(o){
  const count = o.count || 4;
  const correct = o.correct;
  const seen = {}; seen[correct.key] = true;
  const ds = [];
  (o.distractors || []).forEach(function(d){
    if(d && !seen[d.key]){ seen[d.key] = true; ds.push(d); }
  });
  if(ds.length < count - 1) throw new Error('mcq: not enough distinct distractors for "' + o.prompt + '" (' + ds.length + ')');
  // keepOrder: take misconception distractors first (in the order given); otherwise random
  const finalDs = o.keepOrder ? ds.slice(0, count - 1) : shuffle(ds).slice(0, count - 1);
  const opts = shuffle([correct].concat(finalDs));
  const whys = {};
  opts.forEach(function(x){ if(x.why) whys[x.key] = x.why; });
  return {
    type: 'mcq', prompt: o.prompt, visual: o.visual || '', hint: o.hint || '', explain: o.explain || '',
    options: opts, correct: opts.findIndex(function(x){ return x.key === correct.key; }),
    correctKey: correct.key, truthKey: o.truth, decodeKey: o.decode || null,
    wrongWhy: function(respKey){ return whys[respKey] || ''; },
    optionsAreVisual: !!o.optionsAreVisual, model: o.model || null
  };
}

/* Convenience for number answers: builds the options from a list of
   {v, why} wrong values (misconceptions first) followed by generic nearby values. */
function mcqNum(o){
  const fmt = o.fmt || String;
  const nearby = (o.nearby || [1,-1,2,-2,3,-3,5,-5,10,-10]).map(function(d){ return o.answer + d; });
  const wrongs = (o.wrong || []).concat(nearby.map(function(v){ return { v: v }; }));
  const ok = o.valid || function(v){ return v >= 0; };
  const ds = [];
  wrongs.forEach(function(w){
    if(w.v !== o.answer && ok(w.v) && isFinite(w.v)) ds.push(opt(K.num(w.v), fmt(w.v), w.why));
  });
  return mcq({
    prompt: o.prompt, visual: o.visual, hint: o.hint, explain: o.explain,
    correct: opt(K.num(o.answer), fmt(o.answer)),
    distractors: ds, count: o.count || 4, keepOrder: true,
    truth: K.num(o.truth === undefined ? o.answer : o.truth), decode: o.decode ? function(){ const r = o.decode(); return typeof r === 'number' ? K.num(r) : r; } : undefined, model: o.model
  });
}

/* Two-choice / true-false style question */
function mcq2(o){
  return mcq({ prompt: o.prompt, visual: o.visual, hint: o.hint, explain: o.explain,
    correct: o.correct, distractors: [o.other], count: 2, truth: o.truth, decode: o.decode, model: o.model });
}

/* Typed number answer (keypad). */
function numeric(o){
  return {
    type: 'num', prompt: o.prompt, visual: o.visual || '', hint: o.hint || '', explain: o.explain || '',
    answer: o.answer, unit: o.unit || '', correctKey: K.num(o.answer), truthKey: K.num(o.truth === undefined ? o.answer : o.truth),
    decodeKey: o.decode ? function(){ const r = o.decode(); return typeof r === 'number' ? K.num(r) : r; } : null, model: o.model || null,
    wrongWhy: function(respKey){ const v = parseFloat(String(respKey).slice(2)); return (o.wrong && o.wrong(v)) || ''; }
  };
}

/* Interactive: shade `num` of `den` equal parts. UI draws the bar from model.den. */
function shade(o){
  return {
    type: 'shade', prompt: o.prompt, visual: o.visual || '', hint: o.hint || '', explain: o.explain || '',
    model: { den: o.den, num: o.num, shape: o.shape || 'bar' },
    correctKey: K.num(o.num), truthKey: K.num(o.truth === undefined ? o.num : o.truth), decodeKey: null,
    wrongWhy: function(respKey){ const v = parseFloat(String(respKey).slice(2)); return v > o.num ? 'That is too many parts — the top number says how many to colour.' : 'That is not enough parts coloured yet.'; }
  };
}

/* Interactive: set the clock hands to h:m. */
function setclock(o){
  return {
    type: 'setclock', prompt: o.prompt, visual: o.visual || '', hint: o.hint || '', explain: o.explain || '',
    model: { hour: o.hour, minute: o.minute, roman: !!o.roman, step: o.step || 5 },
    correctKey: K.time(o.hour, o.minute), truthKey: K.time(o.truthHour === undefined ? o.hour : o.truthHour, o.truthMinute === undefined ? o.minute : o.truthMinute), decodeKey: null,
    wrongWhy: function(){ return 'Check the SHORT hand for the hour and the LONG hand for the minutes.'; }
  };
}

/* Interactive: tap items into the right order. items are given IN CORRECT ORDER,
   the UI shuffles them. item = {key,label}. The correct answer key is the keys joined with '|'. */
function order(o){
  const keys = o.items.map(function(i){ return i.key; });
  return {
    type: 'order', prompt: o.prompt, visual: o.visual || '', hint: o.hint || '', explain: o.explain || '',
    model: { items: o.items }, correctKey: 'o:' + keys.join('|'), truthKey: o.truth, decodeKey: null,
    wrongWhy: function(){ return 'Not quite in order yet — look at which one is smallest and start there.'; }
  };
}

/* =====================================================================
   VALIDATION — runs in the auditor on thousands of samples AND in the app
   on every question before the child sees it.
   Returns an array of error strings (empty = OK).
   ===================================================================== */
function validateQuestion(q){
  const errs = [];
  const bad = /undefined|NaN|\[object|null\b/;
  if(!q || typeof q !== 'object') return ['not an object'];
  if(['mcq','num','shade','setclock','order'].indexOf(q.type) === -1) errs.push('bad type ' + q.type);
  if(!q.prompt || stripTags(q.prompt).length < 5) errs.push('empty prompt');
  if(bad.test(q.prompt + ' ' + q.explain + ' ' + q.hint + ' ' + q.visual)) errs.push('text contains undefined/NaN/null: ' + stripTags(q.prompt).slice(0, 60));
  if(!q.hint || stripTags(q.hint).length < 8) errs.push('missing hint');
  if(!q.explain || stripTags(q.explain).length < 30) errs.push('missing/short explanation');
  if(q.truthKey === undefined || q.truthKey === null) errs.push('no truthKey (answer not recomputed independently)');
  else if(q.truthKey !== q.correctKey) errs.push('ANSWER MISMATCH: engine says ' + q.correctKey + ' but independent recompute says ' + q.truthKey + ' :: ' + stripTags(q.prompt).slice(0, 70));
  if(q.decodeKey){
    let d; try { d = q.decodeKey(); } catch(e){ d = 'THROW ' + e.message; }
    if(d !== q.correctKey) errs.push('VISUAL MISMATCH: picture shows ' + d + ' but answer is ' + q.correctKey + ' :: ' + stripTags(q.prompt).slice(0, 70));
  }
  if(q.type === 'mcq'){
    const keys = q.options.map(function(o){ return o.key; });
    const labels = q.options.map(function(o){ return stripTags(o.label) || o.label; });
    if(q.options.length < 2 || q.options.length > 4) errs.push('option count ' + q.options.length);
    if(new Set(keys).size !== keys.length) errs.push('two options mean the same thing (duplicate key)');
    if(!q.optionsAreVisual && new Set(labels).size !== labels.length) errs.push('duplicate option labels');
    if(!(q.correct >= 0 && q.correct < q.options.length)) errs.push('correct index out of range');
    else if(q.options[q.correct].key !== q.correctKey) errs.push('correct index does not point at the correct key');
    if(keys.filter(function(k){ return k === q.correctKey; }).length !== 1) errs.push('correct answer must appear exactly once');
    if(!q.optionsAreVisual){
      const lab = stripTags(q.options[q.correct] ? q.options[q.correct].label : '');
      const exTxt = stripTags(q.explain);
      if(lab && lab.length <= 14 && exTxt.indexOf(lab) === -1) errs.push('explanation never states the answer "' + lab + '"');
    }
  }
  if(q.type === 'num'){
    if(!isFinite(q.answer)) errs.push('numeric answer not finite');
    const exTxt = stripTags(q.explain);
    if(exTxt.indexOf(String(q.answer)) === -1) errs.push('explanation never states the answer "' + q.answer + '"');
  }
  if(q.type === 'shade'){
    const m = q.model;
    if(!(m.den >= 2 && m.den <= 12 && m.num >= 0 && m.num <= m.den)) errs.push('bad shade model');
  }
  if(q.type === 'setclock'){
    const m = q.model;
    if(!(m.hour >= 1 && m.hour <= 12 && m.minute >= 0 && m.minute < 60)) errs.push('bad clock model');
  }
  if(q.type === 'order'){
    const ks = q.model.items.map(function(i){ return i.key; });
    if(new Set(ks).size !== ks.length) errs.push('order items repeat');
    if(ks.length < 3 || ks.length > 5) errs.push('order needs 3-5 items');
  }
  return errs;
}

/* Generate a validated question for a skill/tier. Retries on invalid output so
   the child never sees a broken question; reports through onBad (used by the auditor). */
function makeQuestion(skill, tier, onBad){
  for(let i = 0; i < 25; i++){
    let q;
    try { q = skill.gen[tier](); } catch(e){ if(onBad) onBad(skill.id, tier, 'THROW ' + e.message); continue; }
    q.skill = skill.id; q.tier = tier;
    const errs = validateQuestion(q);
    if(errs.length === 0) return q;
    if(onBad) onBad(skill.id, tier, errs.join(' ; '));
  }
  return null;
}


/* =====================================================================
   LESSON VALIDATION  (lessons are data: steps with {say, vis, quiz?})
   skill.lesson = { title, steps:[ { say:'html', vis:{kind,args}|null, quiz?:{prompt, options:[{label, ok:true|false}], right:'feedback', wrong:'feedback'} } ] }
   skill.trick  = { title, say:'html', vis:{kind,args}|null, example:'html' }
   ===================================================================== */
function validateSkillDef(sk, V){
  const errs = [];
  const bad = /undefined|NaN|\[object/;
  if(!/^[a-z0-9-]+$/.test(sk.id)) errs.push('id must be kebab-case');
  if(!sk.name || sk.name.length > 40) errs.push('name missing/too long');
  if([3,4].indexOf(sk.year) === -1 && sk.year !== 2) errs.push('year must be 2 (review), 3 or 4 (bridge)');
  const L = sk.lesson;
  if(!L || !L.title || !Array.isArray(L.steps)) errs.push('lesson needs title and steps');
  else {
    if(L.steps.length < 3 || L.steps.length > 6) errs.push('lesson needs 3-6 steps (has ' + L.steps.length + ')');
    L.steps.forEach(function(st, i){
      const t = stripTags(st.say || '');
      if(t.length < 20 || t.length > 360) errs.push('lesson step ' + (i + 1) + ': text length ' + t.length + ' (aim for 20-360 chars, short sentences for an 8 year old)');
      if(bad.test(st.say || '')) errs.push('lesson step ' + (i + 1) + ' text has undefined/NaN');
      if(st.vis){
        try { const e = V.verify(st.vis); if(e) errs.push('lesson step ' + (i + 1) + ' picture wrong: ' + e); } catch(e){ errs.push('lesson step ' + (i + 1) + ' vis throws: ' + e.message); }
      }
      if(st.quiz){
        const oks = (st.quiz.options || []).filter(function(o){ return o.ok; }).length;
        if(oks !== 1) errs.push('lesson quiz ' + (i + 1) + ' needs exactly 1 ok option');
        if(!st.quiz.options || st.quiz.options.length < 2 || st.quiz.options.length > 4) errs.push('lesson quiz ' + (i + 1) + ' needs 2-4 options');
        if(!st.quiz.right || !st.quiz.wrong) errs.push('lesson quiz ' + (i + 1) + ' needs right/wrong feedback');
      }
    });
    if(!L.steps.some(function(s){ return s.vis; })) errs.push('lesson must contain at least one picture');
    if(!L.steps.some(function(s){ return s.quiz; })) errs.push('lesson must contain at least one quiz step (learn by doing)');
  }
  const T = sk.trick;
  if(!T || !T.title || !T.say || stripTags(T.say).length < 30) errs.push('trick needs title and say (>=30 chars)');
  else {
    if(!T.example || stripTags(T.example).length < 8) errs.push('trick needs a worked example');
    if(bad.test(T.say + ' ' + T.example)) errs.push('trick text has undefined/NaN');
    if(T.vis){ try { const e = V.verify(T.vis); if(e) errs.push('trick picture wrong: ' + e); } catch(e){ errs.push('trick vis throws: ' + e.message); } }
  }
  return errs;
}
if(typeof module !== 'undefined') module.exports.validateSkillDef = validateSkillDef;

/* ===== src/visuals.js ===== */
/* =====================================================================
   MATEMAGICS v4 — VISUALS
   Every drawing is SVG/HTML produced from numbers, and every drawing has
   a matching DECODER that reads the number back out of the *geometry*
   (hand angles, element counts, pixel positions) — never from the data
   the question was built from. Questions wire `decodeKey` to these, so the
   auditor can prove "what the child sees" == "what the answer says".
   ===================================================================== */
const V = {};
const INK = 'var(--vis-ink,#1B1B2F)', BLUE = 'var(--vis-a,#4F8FE8)', PURPLE = 'var(--vis-b,#9B51E0)',
      WARM = 'var(--vis-warm,#F2C94C)', SOFT = 'var(--vis-soft,#EEF1FB)', GREEN = 'var(--vis-good,#27AE60)', RED = 'var(--vis-bad,#EB5757)';

function nums(s){ return (s.match(/-?\d+(?:\.\d+)?/g) || []).map(Number); }

function tagsOf(html, cls){ // every element whose class attribute contains cls (as a whole word)
  const re = new RegExp('<[a-z]+[^>]*class="[^"]*\\b' + cls + '\\b[^"]*"[^>]*>', 'g');
  return html.match(re) || [];
}
function svgWrap(w, h, inner, extra){
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + (extra && extra.width || w) + '" role="img" style="max-width:100%;height:auto;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">' + inner + '</svg>';

/* ------------------------------------------------------------------ CLOCK */
const ROMAN = ['', 'I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
V.clock = function(h, m, o){
  o = o || {};

  let s = '<circle cx="100" cy="100" r="94" fill="#fff" stroke="' + INK + '" stroke-width="4"/>';
  for(let i = 0; i < 60; i++){
    const a = i * 6 * Math.PI / 180, major = i % 5 === 0;
    const r1 = major ? 80 : 86, r2 = 91;
    s += '<line x1="' + f2(cx + r1 * Math.sin(a)) + '" y1="' + f2(cy - r1 * Math.cos(a)) + '" x2="' + f2(cx + r2 * Math.sin(a)) + '" y2="' + f2(cy - r2 * Math.cos(a)) + '" stroke="' + INK + '" stroke-width="' + (major ? 2.4 : 1) + '"/>';

      s += '<text x="' + f2(cx + r * Math.sin(a)) + '" y="' + f2(cy - r * Math.cos(a) + (o.roman ? 4 : 6)) + '" text-anchor="middle" font-size="' + (o.roman ? 13 : 17) + '" font-weight="800" fill="' + INK + '">' + (o.roman ? ROMAN[n] : n) + '</text>';
    }

/* decode -> {h (1..12), m (0..59)} from the drawn hand tips */
V.decodeClock = function(html){
  const hh = tagsOf(html, 'hand-h')[0], mm = tagsOf(html, 'hand-m')[0];
  function ang(tag){ const x = parseFloat(attrOf(tag, 'x2')) - 100, y = 100 - parseFloat(attrOf(tag, 'y2')); let d = Math.atan2(x, y) * 180 / Math.PI; if(d < 0) d += 360; return d; }
  const am = ang(mm), ah = ang(hh);
  const minute = Math.round(am / 6) % 60;
  let hour = Math.round((ah - minute * 0.5) / 30) % 12; if(hour === 0) hour = 12;
  return { h: hour, m: minute };
};

/* digital time (text) */
V.digital = function(h, m, o){

/* ---------------------------------------------------------- NUMBER LINE */
/* o: {min,max,minor (tick step), major (label step), marks:[{value, kind:'dot'|'q', color}], width, fracDen} */
V.numberLine = function(o){

    s += '<line class="tk" x1="' + f2(X(v)) + '" y1="' + (y - (isMajor ? 12 : 7)) + '" x2="' + f2(X(v)) + '" y2="' + (y + (isMajor ? 12 : 7)) + '" stroke="' + INK + '" stroke-width="' + (isMajor ? 2.6 : 1.6) + '"/>';

/* decode: value of the FIRST mark, read from pixel positions of ticks (not the generator's numbers) */
V.decodeNumberLine = function(html){
  const ticks = tagsOf(html, 'tk').map(function(t){ return parseFloat(attrOf(t, 'x1')); });
  const lbls = tagsOf(html.replace(/<text/g, '<text'), 'lbl');

  o = o || {};

  const perRow = Math.max(1, Math.floor(320 / (gw + 14)));
  let s = '';
  for(let g = 0; g < n; g++){
    const gx = 6 + (g % perRow) * (gw + 14), gy = 6 + Math.floor(g / perRow) * (gh + 14);
    s += '<rect class="grp" x="' + gx + '" y="' + gy + '" width="' + gw + '" height="' + gh + '" rx="14" fill="' + SOFT + '" stroke="' + PURPLE + '" stroke-width="2.5" stroke-dasharray="5 4"/>';
    for(let k = 0; k < per; k++)
      s += '<circle class="dot" cx="' + (gx + 20 + (k % 5) * 20) + '" cy="' + (gy + 20 + Math.floor(k / 5) * 20) + '" r="7" fill="' + (o.color || BLUE) + '" stroke="' + INK + '" stroke-width="1.2"/>';
  }
  const rowsUsed = Math.ceil(n / perRow);
  return svgWrap(Math.min(perRow, n) * (gw + 14) + 6, rowsUsed * (gh + 14) + 6, s, { width: Math.min(Math.min(perRow, n) * (gw + 14) + 6, 340) });
};
V.decodeGroups = function(html){
  const g = tagsOf(html, 'grp').length, d = tagsOf(html, 'dot').length;
  return { groups: g, per: g ? d / g : 0, total: d };
};
/* sharing: total dots (to be shared) drawn in a tray */
V.dots = function(n, o){
  o = o || {};
  const cols = Math.min(n, o.cols || 10), rows = Math.ceil(n / cols); let s = '';
  for(let i = 0; i < n; i++) s += '<circle class="dot" cx="' + (16 + (i % cols) * 26) + '" cy="' + (16 + Math.floor(i / cols) * 26) + '" r="10" fill="' + (o.color || WARM) + '" stroke="' + INK + '" stroke-width="1.5"/>';
  return svgWrap(cols * 26 + 6, rows * 26 + 6, s, { width: Math.min(cols * 26 + 6, 340) });
};
V.decodeDots = function(html){ return tagsOf(html, 'dot').length; };

/* ------------------------------------------------------------- MEASURES */
/* Ruler with an object of a given length. unit 'cm' (mm ticks) */
V.ruler = function(lengthCm, o){
  o = o || {};
  const maxCm = o.maxCm || Math.ceil(lengthCm + 1), x0 = 20, pxCm = Math.min(30, Math.floor(300 / maxCm));
  let s = '<rect x="10" y="44" width="' + (maxCm * pxCm + 20) + '" height="42" rx="4" fill="#FFE9A8" stroke="' + INK + '" stroke-width="2"/>';
  for(let mm = 0; mm <= maxCm * 10; mm++){
    const x = x0 + mm * pxCm / 10, isCm = mm % 10 === 0, isHalf = mm % 5 === 0;
    s += '<line class="tk" x1="' + f2(x) + '" y1="44" x2="' + f2(x) + '" y2="' + (44 + (isCm ? 20 : (isHalf ? 14 : 8))) + '" stroke="' + INK + '" stroke-width="' + (isCm ? 2 : 1) + '"/>';
    if(isCm) s += '<text class="lbl" data-v="' + (mm / 10) + '" x="' + f2(x) + '" y="80" text-anchor="middle" font-size="12" font-weight="800" fill="' + INK + '">' + (mm / 10) + '</text>';
  }
  const w = lengthCm * pxCm;
  s += '<rect class="obj" x="' + x0 + '" y="8" width="' + f2(w) + '" height="26" rx="6" fill="' + (o.color || BLUE) + '" stroke="' + INK + '" stroke-width="2"/>';
  s += '<text x="' + (x0 + w / 2) + '" y="27" text-anchor="middle" font-size="15" fill="#fff" font-weight="800">' + (o.emoji || '') + '</text>';
  return svgWrap(maxCm * pxCm + 40, 92, s, { width: Math.min(maxCm * pxCm + 40, 340) });
};
V.decodeRuler = function(html){ // length in cm from object width vs label spacing
  const L = tagsOf(html, 'lbl').map(function(t){ return { v: parseFloat(attrOf(t, 'data-v')), x: parseFloat(attrOf(t, 'x')) }; });
  const obj = tagsOf(html, 'obj')[0];
  const a = L[0], b = L[L.length - 1];
  const ox = parseFloat(attrOf(obj, 'x')), ow = parseFloat(attrOf(obj, 'width'));
  const end = a.v + ((ox + ow) - a.x) / (b.x - a.x) * (b.v - a.v);
  const start = a.v + (ox - a.x) / (b.x - a.x) * (b.v - a.v);
  return Math.round((end - start) * 100) / 100;
};

/* Measuring jug: water level; unit labels */
V.jug = function(value, max, o){
  o = o || {};
  const minor = o.minor || max / 10, major = o.major || max / 2;
  const top = 14, bot = 170, H = bot - top, x0 = 60, w = 80;
  function Y(v){ return bot - v / max * H; }
  let s = '<rect x="' + x0 + '" y="' + top + '" width="' + w + '" height="' + H + '" fill="#fff" stroke="' + INK + '" stroke-width="3" rx="6"/>';
  s += '<rect class="water" x="' + (x0 + 2) + '" y="' + f2(Y(value)) + '" width="' + (w - 4) + '" height="' + f2(bot - Y(value) - 1.5) + '" fill="' + (o.color || '#6EC6FF') + '" opacity=".85"/>';
  const n = Math.round(max / minor);
  for(let i = 0; i <= n; i++){
    const v = i * minor, isMajor = Math.abs(v / major - Math.round(v / major)) < 1e-9;
    s += '<line class="jt" x1="' + (x0 + w - (isMajor ? 26 : 14)) + '" y1="' + f2(Y(v)) + '" x2="' + (x0 + w) + '" y2="' + f2(Y(v)) + '" stroke="' + INK + '" stroke-width="' + (isMajor ? 2.2 : 1.4) + '"/>';
    if(isMajor) s += '<text class="jl" data-v="' + v + '" x="' + (x0 + w + 8) + '" y="' + f2(Y(v) + 5) + '" font-size="13" font-weight="800" fill="' + INK + '">' + v + (o.unit ? ' ' + o.unit : '') + '</text>';
  }
  return svgWrap(240, 184, s, { width: 200 });
};
V.decodeJug = function(html){
  const L = tagsOf(html, 'jl').map(function(t){ return { v: parseFloat(attrOf(t, 'data-v')), y: parseFloat(attrOf(t, 'y')) }; });
  const a = L[0], b = L[L.length - 1];
  const w = tagsOf(html, 'water')[0], wy = parseFloat(attrOf(w, 'y'));
  // label y is tick y + 5; level y is the water top
  const v = a.v + ((a.y - 5) - wy) / ((a.y - 5) - (b.y - 5)) * (b.v - a.v);
  return Math.round(v * 100) / 100;
};

/* Dial scales (kitchen scales): needle over 0..max, 270-degree sweep from -135deg to +135deg */
V.dial = function(value, max, o){
  o = o || {};
  const cx = 100, cy = 100, minor = o.minor || max / 20, major = o.major || max / 4;
  function A(v){ return (-135 + v / max * 270) * Math.PI / 180; }
  let s = '<circle cx="100" cy="100" r="92" fill="#fff" stroke="' + INK + '" stroke-width="4"/>';
  const n = Math.round(max / minor);
  for(let i = 0; i <= n; i++){
    const v = i * minor, a = A(v), isMajor = Math.abs(v / major - Math.round(v / major)) < 1e-9;
    s += '<line x1="' + f2(cx + (isMajor ? 66 : 76) * Math.sin(a)) + '" y1="' + f2(cy - (isMajor ? 66 : 76) * Math.cos(a)) + '" x2="' + f2(cx + 84 * Math.sin(a)) + '" y2="' + f2(cy - 84 * Math.cos(a)) + '" stroke="' + INK + '" stroke-width="' + (isMajor ? 2.6 : 1.3) + '"/>';
    if(isMajor && v < max) s += '<text class="dl" data-v="' + v + '" x="' + f2(cx + 52 * Math.sin(a)) + '" y="' + f2(cy - 52 * Math.cos(a) + 5) + '" text-anchor="middle" font-size="13" font-weight="800" fill="' + INK + '">' + v + '</text>';
  }
  s += '<text x="100" y="152" text-anchor="middle" font-size="14" font-weight="800" fill="' + PURPLE + '">' + (o.unit || '') + '</text>';
  const a = A(value);
  s += '<line class="needle" x1="100" y1="100" x2="' + f2(cx + 74 * Math.sin(a)) + '" y2="' + f2(cy - 74 * Math.cos(a)) + '" stroke="' + RED + '" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="' + RED + '"/>';
  return svgWrap(200, 200, s, { width: 200 });
};
V.decodeDial = function(html){
  function ang(x, y){ let d = Math.atan2(x - 100, 100 - y) * 180 / Math.PI; return d; }
  const L = tagsOf(html, 'dl').map(function(t){ return { v: parseFloat(attrOf(t, 'data-v')), a: ang(parseFloat(attrOf(t, 'x')), parseFloat(attrOf(t, 'y')) - 5) }; });
  const nd = tagsOf(html, 'needle')[0];
  const na = ang(parseFloat(attrOf(nd, 'x2')), parseFloat(attrOf(nd, 'y2')));
  const a = L[0], b = L[L.length - 1];
  const v = a.v + (na - a.a) / (b.a - a.a) * (b.v - a.v);
  return Math.round(v * 100) / 100;
};

/* ----------------------------------------------------------- STATISTICS */
/* Bar chart. items [{label,value}], scale = gridline step, axisMax. */
V.barChart = function(items, o){
  o = o || {};
  const scale = o.scale || 1, axisMax = o.axisMax || (Math.ceil(Math.max.apply(null, items.map(function(i){ return i.value; })) / scale) * scale);
  const W = 320, H = 200, left = 38, bot = 160, top = 14, pxU = (bot - top) / axisMax;
  const bw = Math.min(48, (W - left - 10) / items.length - 12);
  let s = '';
  const lblEvery = o.labelEvery || scale;
  for(let v = 0; v <= axisMax + 1e-9; v += scale){
    const y = bot - v * pxU;
    s += '<line x1="' + left + '" y1="' + f2(y) + '" x2="' + (W - 6) + '" y2="' + f2(y) + '" stroke="#C9CEE0" stroke-width="1"/>';
    if(Math.abs(v / lblEvery - Math.round(v / lblEvery)) < 1e-9) s += '<text class="yl" data-v="' + v + '" x="' + (left - 6) + '" y="' + f2(y + 4) + '" text-anchor="end" font-size="12" font-weight="700" fill="' + INK + '">' + v + '</text>';
  }
  s += '<line x1="' + left + '" y1="' + top + '" x2="' + left + '" y2="' + bot + '" stroke="' + INK + '" stroke-width="2.5"/><line x1="' + left + '" y1="' + bot + '" x2="' + (W - 6) + '" y2="' + bot + '" stroke="' + INK + '" stroke-width="2.5"/>';
  const slot = (W - left - 10) / items.length;
  items.forEach(function(it, i){
    const bx = left + 6 + i * slot + (slot - 6 - bw) / 2, h = it.value * pxU;
    s += '<rect class="bar" data-label="' + it.label + '" x="' + f2(bx) + '" y="' + f2(bot - h) + '" width="' + f2(bw) + '" height="' + f2(h) + '" rx="3" fill="' + (it.color || (i % 2 ? PURPLE : BLUE)) + '" stroke="' + INK + '" stroke-width="1.5"/>';
    s += '<text class="cat" x="' + f2(bx + bw / 2) + '" y="' + (bot + 16) + '" text-anchor="middle" font-size="12" font-weight="800" fill="' + INK + '">' + it.label + '</text>';
  });
  if(o.yTitle) s += '<text x="8" y="12" font-size="11" font-weight="800" fill="' + PURPLE + '">' + o.yTitle + '</text>';
  return svgWrap(W, H, s, { width: W });
};
/* decode -> {label:value,...} from bar HEIGHTS measured against the y-axis labels */
V.decodeBarChart = function(html){
  const L = tagsOf(html, 'yl').map(function(t){ return { v: parseFloat(attrOf(t, 'data-v')), y: parseFloat(attrOf(t, 'y')) - 4 }; });
  const a = L[0], b = L[L.length - 1];
  const out = {};
  tagsOf(html, 'bar').forEach(function(t){
    const top = parseFloat(attrOf(t, 'y'));
    out[attrOf(t, 'data-label')] = Math.round((a.v + (top - a.y) / (b.y - a.y) * (b.v - a.v)) * 100) / 100;
  });
  return out;
};

/* Pictogram: rows [{label, count (may end in .5), emoji}], key = value of one symbol */
V.pictogram = function(rows, key){
  let s = '<div class="pict" style="display:inline-block;text-align:left;background:#fff;border:3px solid ' + INK + ';border-radius:14px;padding:10px 14px;color:' + INK + '">';
  rows.forEach(function(r){
    const whole = Math.floor(r.count + 1e-9), half = (r.count - whole) > 0.25;
    let syms = '';
    for(let i = 0; i < whole; i++) syms += '<span class="sym" style="font-size:24px">' + r.emoji + '</span>';
    if(half) syms += '<span class="sym half" style="font-size:24px;display:inline-block;width:.55em;overflow:hidden;vertical-align:bottom">' + r.emoji + '</span>';
    s += '<div class="prow" data-label="' + r.label + '" style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="width:84px;font-weight:800">' + r.label + '</span><span>' + syms + '</span></div>';
  });
  s += '<div style="margin-top:6px;font-weight:800;border-top:2px dashed #C9CEE0;padding-top:6px">Key: <span style="font-size:20px">' + rows[0].emoji + '</span> = ' + key + '</div></div>';
  return s;
};
V.decodePictogram = function(html){
  const key = parseFloat(/=\s*([\d.]+)\s*</.exec(html)[1]);
  const out = {};
  html.split('<div class="prow"').slice(1).forEach(function(chunk){
    const label = /data-label="([^"]*)"/.exec(chunk)[1];
    const whole = (chunk.match(/<span class="sym" /g) || []).length, half = (chunk.match(/<span class="sym half"/g) || []).length;
    out[label] = (whole + half * 0.5) * key;
  });
  return out;
};

/* Tally marks */
V.tally = function(n){
  const groups = Math.floor(n / 5), rem = n % 5; let s = '', x = 10;
  for(let g = 0; g < groups; g++){
    for(let i = 0; i < 4; i++) s += '<line class="tal" x1="' + (x + i * 9) + '" y1="8" x2="' + (x + i * 9) + '" y2="44" stroke="' + INK + '" stroke-width="3.5" stroke-linecap="round"/>';
    s += '<line class="talx" x1="' + (x - 6) + '" y1="38" x2="' + (x + 33) + '" y2="14" stroke="' + RED + '" stroke-width="3.5" stroke-linecap="round"/>';
    x += 52;
  }
  for(let i = 0; i < rem; i++) s += '<line class="tal" x1="' + (x + i * 9) + '" y1="8" x2="' + (x + i * 9) + '" y2="44" stroke="' + INK + '" stroke-width="3.5" stroke-linecap="round"/>';
  return svgWrap(x + rem * 9 + 10, 52, s, { width: Math.min(x + rem * 9 + 10, 340) });
};
V.decodeTally = function(html){ return tagsOf(html, 'tal').length + tagsOf(html, 'talx').length; };

/* ---------------------------------------------------------------- MONEY */
V.coins = function(list){
  let s = '<div class="coins" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:320px">';
  list.forEach(function(p){
    const isNote = p >= 500, isPound = p >= 100 && p < 500, silver = [1, 2].indexOf(p) === -1;
    const label = p >= 100 ? '£' + (p / 100) : p + 'p';
    if(isNote) s += '<div class="coin note" data-p="' + p + '" style="min-width:74px;height:44px;border-radius:6px;background:#A8E6A3;border:3px solid #3C8D40;color:#1B4D1E;display:flex;align-items:center;justify-content:center;font:800 17px system-ui">' + label + '</div>';
    else s += '<div class="coin" data-p="' + p + '" style="width:' + (p >= 50 ? 52 : p >= 20 ? 46 : 44) + 'px;height:' + (p >= 50 ? 52 : p >= 20 ? 46 : 44) + 'px;border-radius:50%;background:' + (isPound ? 'linear-gradient(135deg,#F2C94C,#C0C0C0)' : (silver ? '#D9DCE4' : '#D98E5F')) + ';border:3px solid ' + INK + ';color:' + INK + ';display:flex;align-items:center;justify-content:center;font:800 15px system-ui">' + label + '</div>';
  });

};
V.decodeCoins = function(html){

};

/* ------------------------------------------------------------- GEOMETRY */
/* Polygons are drawn from explicit points so the decoder can measure sides & angles */
V.SHAPES = {
  triangle_equilateral: [[100,20],[170,140],[30,140]],
  triangle_right:       [[40,30],[40,140],[170,140]],
  triangle_isosceles:   [[100,20],[160,140],[40,140]],
  triangle_scalene:     [[30,140],[170,140],[120,24]],
  square:               [[50,30],[150,30],[150,130],[50,130]],
  rectangle:            [[30,45],[170,45],[170,125],[30,125]],
  rhombus:              [[100,20],[160,80],[100,140],[40,80]],
  parallelogram:        [[60,40],[170,40],[140,130],[30,130]],
  trapezium:            [[70,40],[130,40],[170,130],[30,130]],
  kite:                 [[100,16],[150,60],[100,150],[50,60]],
  pentagon:             null, hexagon: null, octagon: null   // regular, generated
};
V.regularPoints = function(n, cx, cy, r, rot){
  const pts = []; rot = rot === undefined ? -Math.PI / 2 : rot;
  for(let i = 0; i < n; i++){ const a = rot + i * 2 * Math.PI / n; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return pts;
};
V.shapePoints = function(name){
  if(name === 'pentagon') return V.regularPoints(5, 100, 85, 68);
  if(name === 'hexagon') return V.regularPoints(6, 100, 85, 68, 0);
  if(name === 'octagon') return V.regularPoints(8, 100, 85, 68, Math.PI / 8);
  return V.SHAPES[name];
};
V.polygon = function(pts, o){
  o = o || {};
  const pstr = pts.map(function(p){ return f2(p[0]) + ',' + f2(p[1]); }).join(' ');
  let s = '<polygon class="poly" points="' + pstr + '" fill="' + (o.fill || '#CFE1FF') + '" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round"/>';
  if(o.marks){ // tiny square marks at right angles
    const n = pts.length;
    for(let i = 0; i < n; i++){
      const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
      const v1 = [p0[0] - p1[0], p0[1] - p1[1]], v2 = [p2[0] - p1[0], p2[1] - p1[1]];
      const l1 = Math.hypot(v1[0], v1[1]), l2 = Math.hypot(v2[0], v2[1]);
      if(Math.abs(v1[0] * v2[0] + v1[1] * v2[1]) / (l1 * l2) < 0.01){
        const u1 = [v1[0] / l1 * 12, v1[1] / l1 * 12], u2 = [v2[0] / l2 * 12, v2[1] / l2 * 12];
        s += '<polyline class="rtmark" points="' + f2(p1[0] + u1[0]) + ',' + f2(p1[1] + u1[1]) + ' ' + f2(p1[0] + u1[0] + u2[0]) + ',' + f2(p1[1] + u1[1] + u2[1]) + ' ' + f2(p1[0] + u2[0]) + ',' + f2(p1[1] + u2[1]) + '" fill="none" stroke="' + RED + '" stroke-width="2.5"/>';
      }
    }
  }
  return svgWrap(200, 170, s, { width: o.width || 190 });
};
V.shape2D = function(name, o){ return V.polygon(V.shapePoints(name), o); };
V.circle = function(o){
  return svgWrap(200, 170, '<circle class="circ" cx="100" cy="85" r="66" fill="#CFE1FF" stroke="' + INK + '" stroke-width="4"/>', { width: (o && o.width) || 190 });
};
/* geometric decoder: reads the polygon's points, returns facts */
V.decodePolygon = function(html){
  const tag = tagsOf(html, 'poly')[0]; if(!tag) return null;
  const pts = []; const m = attrOf(tag, 'points').trim().split(/\s+/);
  m.forEach(function(p){ const xy = p.split(',').map(Number); pts.push(xy); });
  const n = pts.length; const sides = [], angles = [];
  for(let i = 0; i < n; i++){
    const a = pts[i], b = pts[(i + 1) % n], c = pts[(i + n - 1) % n];
    sides.push(Math.hypot(b[0] - a[0], b[1] - a[1]));
    const v1 = [c[0] - a[0], c[1] - a[1]], v2 = [b[0] - a[0], b[1] - a[1]];
    angles.push(Math.acos((v1[0] * v2[0] + v1[1] * v2[1]) / (Math.hypot(v1[0], v1[1]) * Math.hypot(v2[0], v2[1]))) * 180 / Math.PI);
  }
  const tol = 0.8;
  let rightAngles = angles.filter(function(a){ return Math.abs(a - 90) < tol; }).length;
  let equalSides = 0; // number of sides equal to the longest-frequency length
  const groups = {}; sides.forEach(function(s){ const k = Math.round(s / 1.5); groups[k] = (groups[k] || 0) + 1; });
  equalSides = Math.max.apply(null, Object.keys(groups).map(function(k){ return groups[k]; }));
  // parallel pairs among the sides
  let parallel = 0;
  for(let i = 0; i < n; i++) for(let j = i + 1; j < n; j++){
    const a1 = pts[i], a2 = pts[(i + 1) % n], b1 = pts[j], b2 = pts[(j + 1) % n];
    const d1 = [a2[0] - a1[0], a2[1] - a1[1]], d2 = [b2[0] - b1[0], b2[1] - b1[1]];
    if(Math.abs(d1[0] * d2[1] - d1[1] * d2[0]) / (Math.hypot(d1[0], d1[1]) * Math.hypot(d2[0], d2[1])) < 0.004) parallel++;
  }
  return { vertices: n, sides: n, rightAngles: rightAngles, equalSides: equalSides, parallelPairs: parallel, allEqual: new Set(Object.keys(groups)).size === 1 };
};
V.decodeCircle = function(html){ return tagsOf(html, 'circ').length === 1 ? { vertices: 0, sides: 0, curved: true } : null; };

/* 3D shapes: simple clear SVG pictures (facts come from V.FACTS3D, a hand-checked table) */
V.FACTS3D = {
  cube:      { faces: 6, edges: 12, vertices: 8, flat: 6, curved: 0 },
  cuboid:    { faces: 6, edges: 12, vertices: 8, flat: 6, curved: 0 },
  'square-based pyramid': { faces: 5, edges: 8, vertices: 5, flat: 5, curved: 0 },
  'triangular prism':     { faces: 5, edges: 9, vertices: 6, flat: 5, curved: 0 },
  cylinder:  { faces: 3, edges: 2, vertices: 0, flat: 2, curved: 1 },
  cone:      { faces: 2, edges: 1, vertices: 1, flat: 1, curved: 1 },
  sphere:    { faces: 1, edges: 0, vertices: 0, flat: 0, curved: 1 }
};
V.shape3D = function(name){
  const st = 'stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"';
  let s = '';

/* addsub-difference — find the difference by counting on (bridging through 10 or 100); how many more; change */
(function(){
  const NAMES = ['Ana', 'Marcus', 'Sophie', 'Ivan', 'Lucy', 'Diego', 'Ellen', 'Tom', 'Aisha', 'Kai', 'Mei', 'Leo'];
  const THINGS = ['stickers', 'marbles', 'shells', 'stars', 'beads', 'cards', 'points', 'books'];
  const ITEMS = ['pencil', 'rubber', 'toy car', 'balloon', 'bag of sweets', 'unicorn sticker', 'bouncy ball', 'notebook', 'badge'];
  function dg(n, i){ return Math.floor(n / Math.pow(10, i)) % 10; }

  /* the counting-on jumps from lo to hi: [[from,to],...] */
  function jumps(lo, hi){
    const js = []; let x = lo;
    function go(t){ if(t > x && t <= hi){ js.push([x, t]); x = t; } }
    if(x % 10 !== 0 || (x >= 100 && x % 100 !== 0)){
      if(x >= 100 && Math.ceil(x / 100) * 100 <= hi) go(Math.ceil(x / 100) * 100);
      else go(Math.ceil(x / 10) * 10);
    }
    if(hi - x >= 100) go(x + Math.floor((hi - x) / 100) * 100);
    if(hi - x >= 10) go(x + Math.floor((hi - x) / 10) * 10);
    go(hi);
    return js;
  }
  function jumpSum(js){ return js.reduce(function(t, j){ return t + (j[1] - j[0]); }, 0); }
  function jumpText(js){ let s = '<b>' + js[0][0] + '</b>'; js.forEach(function(j){ s += ' → <b>' + j[1] + '</b> (+' + (j[1] - j[0]) + ')'; }); return s; }
  function explainDiff(lo, hi, intro){
    const js = jumps(lo, hi), parts = js.map(function(j){ return j[1] - j[0]; });
    return ex(intro || 'Difference between ' + lo + ' and ' + hi, [
      'Count on from the <b>smaller</b> number, using friendly stops: ' + jumpText(js) + '.',
      'Add the jumps: ' + parts.join(' + ') + ' = <b>' + (hi - lo) + '</b>.',
      'Check: ' + lo + ' + ' + (hi - lo) + ' = ' + hi + '. ✅'
    ]);
  }
  function swapSub(hi, lo){ let v = 0; for(let i = 2; i >= 0; i--) v = v * 10 + Math.abs(dg(hi, i) - dg(lo, i)); return v; }
  function wrongList(lo, hi){
    const ans = hi - lo, js = jumps(lo, hi), out = [];
    out.push({ v: ans + 1, why: 'You counted the starting number too. Count the JUMPS, not the numbers you land on.' });
    out.push({ v: ans - 1, why: 'Close! You missed one. Add up all the jumps carefully.' });
    const sw = swapSub(hi, lo);
    if(sw !== ans) out.push({ v: sw, why: 'You took the smaller digit from the bigger digit in each column. Counting on from the smaller number avoids this.' });
    if(js.length > 1) out.push({ v: ans - (js[0][1] - js[0][0]), why: 'You left out the first jump (the one up to the next ten or hundred).' });
    if(lo + hi < 1000) out.push({ v: lo + hi, why: 'You added the two numbers. The difference is how far apart they are.' });
    return out;
  }
  const NEAR = [10, -10, 2, -2, 3, -3, 5, -5, 20, -20];

  function nlRange(lo, hi){
    const span = hi - lo; let major, minor;
    if(span <= 30){ major = 5; minor = 1; } else if(span <= 120){ major = 20; minor = 10; } else { major = 100; minor = span <= 400 ? 10 : 50; }
    let min = Math.floor(lo / major) * major, max = Math.ceil(hi / major) * major;
    if(max === min) max = min + major;
    return { min: min, max: max, minor: minor, major: major };
  }
  function nlVis(lo, hi, extra){
    const r = nlRange(lo, hi);
    return V.numberLine({ min: r.min, max: r.max, minor: r.minor, major: r.major, marks: [{ value: lo }, { value: hi, color: 'var(--vis-b,#9B51E0)' }] });
  }
  function marksOf(html){
    const L = []; let m; const re = /<text class="lbl" data-v="([^"]*)" x="([^"]*)"/g;
    while((m = re.exec(html))) L.push({ v: parseFloat(m[1]), x: parseFloat(m[2]) });
    const out = []; const re2 = /<circle class="mark" cx="([^"]*)"/g, a = L[0], b = L[L.length - 1];
    while((m = re2.exec(html))) out.push(Math.round(a.v + (parseFloat(m[1]) - a.x) / (b.x - a.x) * (b.v - a.v)));
    return out;
  }
  function diffOf(html){ const mk = marksOf(html); return Math.abs(mk[1] - mk[0]); }
  function pairGen(lmin, lmax, smin, smax, o){
    o = o || {};
    for(let i = 0; i < 1000; i++){
      const lo = randInt(lmin, lmax), s = randInt(smin, smax), hi = lo + s;
      if(hi > 999 && !o.big) continue;
      if(o.crossTen && Math.floor(lo / 10) === Math.floor(hi / 10)) continue;
      if(o.crossHundred && Math.floor(lo / 100) === Math.floor(hi / 100)) continue;
      if(lo % 10 === 0 || hi % 10 === 0) continue;
      return { lo: lo, hi: hi };
    }
    throw new Error('difference: no pair');
  }
  function numQ(p, prompt, visual, hint, intro){
    return mcqNum({ prompt: prompt, visual: visual, answer: jumpSum(jumps(p.lo, p.hi)), wrong: wrongList(p.lo, p.hi), nearby: NEAR, valid: function(v){ return v >= 1 && v < 1000; },
      hint: hint || 'Count on from the smaller number. Stop at the next ten (or hundred) first, then jump to the bigger number.',
      explain: explainDiff(p.lo, p.hi, intro), truth: p.hi - p.lo, decode: visual ? function(){ return diffOf(visual); } : undefined });
  }
  function wrongNum(wl){ return function(v){ for(let i = 0; i < wl.length; i++) if(wl[i].v === v) return wl[i].why; return ''; }; }
  function twoNames(){ const s = sample(NAMES, 2); return s; }

  function moreStory(p, big){
    const n = twoNames(), th = pick(THINGS);
    return n[0] + ' has <b>' + p.lo + '</b> ' + th + '. ' + n[1] + ' has <b>' + p.hi + '</b>. How many more ' + th + ' does ' + n[1] + ' have?';
  }
  function changeQ(price, pay, typed){
    const n = pick(NAMES), it = pick(ITEMS), payTxt = pay === 100 ? 'a £1 coin (100p)' : (pay === 200 ? 'a £2 coin (200p)' : 'a £5 note (500p)');

    const ans = jumpSum(jumps(price, pay)), js = jumps(price, pay);
    const exp = ex('Change from ' + pay + 'p', ['Count on from the price up to ' + pay + 'p: ' + jumpText(js) + '.', 'Add the jumps: ' + js.map(function(j){ return j[1] - j[0]; }).join(' + ') + ' = <b>' + ans + 'p</b>.', 'Check: ' + price + 'p + ' + ans + 'p = ' + pay + 'p. ✅']);
    const vis = pay === 100 || pay === 200 ? nlVis(price, pay) : '';
    const hint = 'Count on from the price to the amount paid. Stop at the next 10p (or £1) on the way.';
    const wl = wrongList(price, pay).filter(function(w){ return w.v !== pay + price; }).concat([{ v: price, why: 'That is the price. The change is how much more is needed to reach what was paid.' }]);
    if(typed) return numeric({ prompt: prompt, visual: vis, answer: ans, unit: 'p', hint: hint, explain: exp, truth: pay - price, decode: vis ? function(){ return diffOf(vis); } : undefined, wrong: wrongNum(wl) });
    return mcqNum({ prompt: prompt, visual: vis, answer: ans, wrong: wl, nearby: [10, -10, 1, -1, 5, -5, 20], fmt: function(v){ return v + 'p'; }, valid: function(v){ return v >= 1 && v < 200; },
      hint: hint, explain: exp, truth: pay - price, decode: vis ? function(){ return diffOf(vis); } : undefined });
  }

  registerSkill({
    id: 'addsub-difference', strand: 'addsub', name: 'Find the difference', emoji: '↔️', year: 3, order: 240, prereq: ['addsub-sub-column'],
    lesson: {
      title: 'Counting on to find the difference',
      steps: [
        { say: 'The <b>difference</b> is how far apart two numbers are. Start at the smaller number, <b>47</b>, and count on to the bigger number, <b>53</b>.', vis: { kind: 'numberLine', args: [{ min: 45, max: 55, minor: 1, major: 5, marks: [{ value: 47 }, { value: 53, color: 'var(--vis-b,#9B51E0)' }] }] } },
        { say: 'Stop at the next ten to make it easy. <b>47 → 50</b> is a jump of 3. <b>50 → 53</b> is a jump of 3. Add the jumps: 3 + 3 = <b>6</b>. The difference is 6.', vis: { kind: 'numberLine', args: [{ min: 45, max: 55, minor: 1, major: 5, marks: [{ value: 47 }, { value: 53, color: 'var(--vis-b,#9B51E0)' }] }] },
          quiz: { prompt: 'What is the difference between 28 and 34?', options: [{ label: '6', ok: true }, { label: '7', ok: false }, { label: '5', ok: false }], right: 'Yes! 28 → 30 is 2, then 30 → 34 is 4. 2 + 4 = 6.', wrong: 'Count on: 28 → 30 is 2, then 30 → 34 is 4. 2 + 4 = 6.' } },
        { say: 'It works for change too! A toy costs <b>63p</b>. You pay <b>100p</b>. Count on: 63 → 70 is 7. 70 → 100 is 30. Change = 7 + 30 = <b>37p</b>.', vis: { kind: 'numberLine', args: [{ min: 60, max: 100, minor: 10, major: 20, marks: [{ value: 63 }, { value: 100, color: 'var(--vis-b,#9B51E0)' }] }] } },
        { say: 'With bigger numbers, stop at the next <b>hundred</b>. From <b>286</b> to <b>412</b>: 286 → 300 is 14. 300 → 400 is 100. 400 → 412 is 12. Total: 14 + 100 + 12 = <b>126</b>.', vis: { kind: 'numberLine', args: [{ min: 200, max: 500, minor: 10, major: 100, marks: [{ value: 286 }, { value: 412, color: 'var(--vis-b,#9B51E0)' }] }] },
          quiz: { prompt: 'Sam has 72 stickers. Maya has 91. How many more has Maya?', options: [{ label: '19', ok: true }, { label: '29', ok: false }, { label: '20', ok: false }], right: 'Yes! 72 → 80 is 8, then 80 → 91 is 11. 8 + 11 = 19.', wrong: 'Count on from 72: 72 → 80 is 8, then 80 → 91 is 11. 8 + 11 = 19.' } }
      ]
    },
    trick: {
      title: 'Count on, don’t take away',
      say: 'To find the difference, <b>count on</b> from the smaller number in friendly jumps: first to the next <b>ten</b> (or <b>hundred</b>), then the big jump, then the last little jump. Add the jumps up!',
      vis: { kind: 'numberLine', args: [{ min: 60, max: 100, minor: 10, major: 20, marks: [{ value: 63 }, { value: 100, color: 'var(--vis-b,#9B51E0)' }] }] },
      example: '100 − 63 → 63 → 70 (+7) → 100 (+30) → 7 + 30 = <b>37</b>'
    },
    gen: {
      1: function(){
        const f = randInt(0, 2);
        if(f === 0){ const p = pairGen(11, 88, 3, 11, { crossTen: true }); return numQ(p, 'What is the <b>difference</b> between <b>' + p.lo + '</b> and <b>' + p.hi + '</b>? Count on along the line.', nlVis(p.lo, p.hi)); }
        if(f === 1){ const p = pairGen(11, 88, 3, 11, { crossTen: true }); return numQ(p, moreStory(p), nlVis(p.lo, p.hi), 'Start at the smaller number and count on to the bigger one.', 'How many more?'); }
        const p = pairGen(11, 88, 3, 11, { crossTen: true }), first = Math.ceil(p.lo / 10) * 10 - p.lo, vis = nlVis(p.lo, p.hi);
        return mcqNum({ prompt: 'Counting on from <b>' + p.lo + '</b> to <b>' + p.hi + '</b>. How big is the <b>first jump</b>, to the next ten?', visual: vis, answer: first,
          wrong: [{ v: p.hi - p.lo, why: 'That is the whole difference. The first jump only goes as far as the next ten.' }, { v: p.lo % 10, why: 'That is the ones digit of ' + p.lo + '. We need how many MORE to reach the next ten.' }, { v: 10 - first, why: 'That is the part of the ten you have already. The jump is the part still missing.' }],
          nearby: [1, -1, 2, -2, 3], valid: function(v){ return v >= 1 && v <= 10; },

/* addsub-mental-3d — add and subtract ones, tens and hundreds to/from a 3-digit number, in your head */
(function(){
  const UNIT = { o: 1, t: 10, h: 100 }, UNAME = { o: 'ones', t: 'tens', h: 'hundreds' }, USING = { o: 'one', t: 'ten', h: 'hundred' };
  function dg(n, k){ return k === 'o' ? n % 10 : (k === 't' ? Math.floor(n / 10) % 10 : Math.floor(n / 100) % 10); }

  /* correct answers use direct arithmetic; truth is recomputed by counting up/down one unit at a time */
  function stepTruth(c){ let x = c.a; for(let i = 0; i < c.d; i++) x = c.op === '+' ? x + c.u : x - c.u; return x; }

  function genCase(o){
    for(let i = 0; i < 600; i++){
      const k = pick(o.kinds), op = pick(o.ops), d = randInt(1, 9), u = UNIT[k];
      const a = randInt(o.min || 100, o.max || 999), amt = d * u;
      const ans = op === '+' ? a + amt : a - amt;
      if(ans < (o.minAns || 100) || ans > 999) continue;
      const dig = dg(a, k);
      const cross = op === '+' ? dig + d > 9 : dig - d < 0;
      if(o.cross === true && !cross) continue;
      if(o.cross === false && cross) continue;
      if(k === 'h' && cross) continue;
      if(cross && op === '-' && a % (u * 10) === 0) continue;
      if(o.chain && !(k === 'o' && dg(a, 't') === (op === '+' ? 9 : 0))) continue;
      if(a % 100 === 0 || (k === 'o' && a % 10 === 0)) continue;
      return { a: a, op: op, k: k, d: d, u: u, amt: amt, ans: ans, cross: cross };
    }
    throw new Error('mental: no case');
  }
  function uw(d, k){ return d === 1 ? USING[k] : UNAME[k]; }
  function sym(op){ return op === '+' ? '+' : '−'; }
  function sentence(c){ return c.a + ' ' + sym(c.op) + ' ' + c.amt; }

  function wrongList(c){
    const out = [], a = c.a, ans = c.ans, other = ['o', 't', 'h'].filter(function(k){ return k !== c.k; });
    other.forEach(function(k){
      const v = c.op === '+' ? a + c.d * UNIT[k] : a - c.d * UNIT[k];
      out.push({ v: v, why: 'You changed the ' + UNAME[k] + ' digit. But ' + c.amt + ' is ' + c.d + ' ' + uw(c.d, c.k) + ', so the ' + UNAME[c.k] + ' digit changes.' });
    });
    out.push({ v: c.op === '+' ? a - c.amt : a + c.amt, why: 'You ' + (c.op === '+' ? 'took away' : 'added') + ' instead of ' + (c.op === '+' ? 'adding' : 'taking away') + '. Look at the sign again.' });
    if(c.cross){
      if(c.op === '+') out.unshift({ v: ans - c.u * 10, why: 'You forgot the carried ' + (c.k === 'o' ? 'ten' : 'hundred') + '. When you go past ' + (c.k === 'o' ? '9 ones' : '9 tens') + ' the next digit goes up by 1.' });
      else out.unshift({ v: ans + c.u * 10, why: 'You forgot to take 1 from the next digit. Going below 0 ' + UNAME[c.k] + ' means the ' + (c.k === 'o' ? 'tens' : 'hundreds') + ' digit goes down by 1.' });
    }
    return out;
  }
  const NEAR = [10, -10, 100, -100, 1, -1, 2, -2, 20, -20];
  function valid3(v){ return v >= 10 && v < 1000; }

  function explainCase(c){
    const a = c.a, d = c.d, t = [];
    const nm = UNAME[c.k], nxt = c.k === 'o' ? 'tens' : 'hundreds';
    if(!c.cross){
      const dig = dg(a, c.k), nd = c.op === '+' ? dig + d : dig - d;
      t.push('<b>' + c.amt + '</b> is ' + d + ' ' + uw(d, c.k) + ', so only the <b>' + nm + '</b> digit changes.');
      t.push('The ' + nm + ' digit is ' + dig + '. ' + dig + ' ' + sym(c.op) + ' ' + d + ' = <b>' + nd + '</b>.');
      t.push(a + ' ' + sym(c.op) + ' ' + c.amt + ' = <b>' + c.ans + '</b>. ✅');
    } else if(c.k === 'o'){
      const B = 10, s1 = c.op === '+' ? B - a % B : a % B, s2 = c.amt - s1, mid = c.op === '+' ? a + s1 : a - s1;
      t.push(c.op === '+' ? 'Make a ten first: ' + a + ' + ' + s1 + ' = <b>' + mid + '</b>.' : 'Go back to the ten first: ' + a + ' − ' + s1 + ' = <b>' + mid + '</b>.');
      t.push('You have used ' + s1 + ' of the ' + c.amt + '. That leaves ' + c.amt + ' − ' + s1 + ' = <b>' + s2 + '</b> to go.');
      t.push(mid + ' ' + sym(c.op) + ' ' + s2 + ' = <b>' + c.ans + '</b>. ✅');
    } else {
      const dig = dg(a, 't');
      if(c.op === '+'){
        t.push('Look at the tens: ' + dig + ' tens + ' + d + ' ' + uw(d, 't') + ' = <b>' + (dig + d) + ' tens</b>.');
        t.push((dig + d) + ' tens is 1 hundred and ' + (dig + d - 10) + ' tens, so the hundreds go up by 1 and the tens digit is ' + (dig + d - 10) + '.');
      } else {
        t.push('We cannot take ' + d + ' ' + uw(d, 't') + ' from ' + dig + ' tens. Swap 1 hundred for 10 tens: ' + (dig + 10) + ' tens.');
        t.push((dig + 10) + ' tens − ' + d + ' ' + uw(d, 't') + ' = <b>' + (dig + 10 - d) + ' tens</b>, and the hundreds digit goes down by 1.');
      }
      t.push(a + ' ' + sym(c.op) + ' ' + c.amt + ' = <b>' + c.ans + '</b>. ✅');
    }

  }
  function hintCase(c){
    if(c.cross && c.k === 'o') return c.op === '+' ? 'Make a ten first: how many more to reach the next ten? Then add what is left over.' : 'Count back to the ten first, then take away what is left over.';

  }
  function nlFor(c){
    const lo = Math.min(c.a, c.ans), hi = Math.max(c.a, c.ans);
    if(c.k === 'o') return V.numberLine({ min: Math.floor(lo / 10) * 10, max: Math.ceil(hi / 10) * 10, minor: 1, major: 5, marks: [{ value: c.a }] });

  function nlStart(html){ return Math.round(V.decodeNumberLine(html)); }
  function wordsOf(c){

  }
  function numQ(c, prompt, visual, decode){
    const q = mcqNum({ prompt: prompt, visual: visual, answer: c.ans, wrong: wrongList(c), nearby: NEAR, valid: valid3,
      hint: hintCase(c), explain: explainCase(c), truth: stepTruth(c), decode: decode });

  }

  registerSkill({
    id: 'addsub-mental-3d', strand: 'addsub', name: 'Add & subtract 1s, 10s, 100s', emoji: '🧮', year: 3, order: 210, prereq: ['number-place-value'],
    lesson: {
      title: 'Adding and taking away in your head',
      steps: [
        { say: 'Every 3-digit number is made of <b>hundreds</b>, <b>tens</b> and <b>ones</b>. This is <b>346</b>: 3 hundreds, 4 tens and 6 ones.', vis: { kind: 'baseTen', args: [3, 4, 6] } },
        { say: 'To add <b>20</b>, add 2 tens. Only the <b>tens</b> change: 4 tens + 2 tens = 6 tens. So <b>346 + 20 = 366</b>. The hundreds and ones stay the same.', vis: { kind: 'baseTen', args: [3, 6, 6] } },
        { say: 'Here is <b>512</b>. To take away <b>300</b>, we remove 3 hundreds. Only the <b>hundreds</b> change: 5 − 3 = 2.', vis: { kind: 'baseTen', args: [5, 1, 2] },
          quiz: { prompt: 'What is 512 − 300?', options: [{ label: '212', ok: true }, { label: '482', ok: false }, { label: '509', ok: false }], right: 'Yes! Only the hundreds change: 5 − 3 = 2, so 212.', wrong: 'Take 3 HUNDREDS from the hundreds digit (5 − 3 = 2). The tens and ones stay: 212.' } },
        { say: 'What if the ones go past 9? Try <b>285 + 7</b>. Jump to the next ten first: 285 + 5 = 290. Then add the 2 left over: 290 + 2 = <b>292</b>.', vis: { kind: 'numberLine', args: [{ min: 280, max: 300, minor: 1, major: 5, marks: [{ value: 285 }] }] } },
        { say: 'Use the same trick for <b>396 + 7</b>. Jump to the next hundred first. How far is it from 396 to 400?', vis: { kind: 'numberLine', args: [{ min: 390, max: 410, minor: 1, major: 5, marks: [{ value: 396 }] }] },
          quiz: { prompt: 'What is 396 + 7?', options: [{ label: '403', ok: true }, { label: '393', ok: false }, { label: '413', ok: false }], right: 'Yes! 396 + 4 = 400, then 400 + 3 = 403.', wrong: 'Jump to 400 first (that is 4), then add the 3 left over: 400 + 3 = 403.' } }
      ]
    },
    trick: {

      example: '78 + 5 → 78 + 2 = 80 → 80 + 3 = <b>83</b>'

    gen: {

        const c = genCase({ kinds: ['o', 't', 'h'], ops: ['+', '-'], cross: false, min: 110, max: 899 });

/* ===== src/skills/addsub-sub-column.js ===== */
/* addsub-sub-column — column subtraction up to 3 digits, with exchanging (borrowing), including zeros */
(function(){
  const COLN = ['ones', 'tens', 'hundreds'], COLH = ['O', 'T', 'H'], SING = ['one', 'ten', 'hundred'];
  const NAMES = ['Ana', 'Marcus', 'Sophie', 'Ivan', 'Lucy', 'Diego', 'Ellen', 'Tom', 'Aisha', 'Kai', 'Mei', 'Leo'];
  function dg(n, i){ return Math.floor(n / Math.pow(10, i)) % 10; }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function cellsOf(x, cols){ const s = String(x); const out = []; for(let i = 0; i < cols; i++){ const j = s.length - cols + i; out.push(j >= 0 ? s.charAt(j) : ''); } return out; }

  /* exchange state: the digits of a AFTER all exchanges, just before subtracting each column */
  function exchState(a, b){
    const cur = [dg(a, 0), dg(a, 1), dg(a, 2)], bd = [dg(b, 0), dg(b, 1), dg(b, 2)], changed = [false, false, false], events = [];
    for(let i = 0; i < 3; i++){
      if(cur[i] < bd[i]){
        let j = i + 1; while(j < 3 && cur[j] === 0) j++;
        for(let k = j; k > i; k--){ cur[k] -= 1; cur[k - 1] += 10; changed[k] = true; changed[k - 1] = true; events.push({ from: k, col: i }); }
      }
    }
    return { cur: cur, changed: changed, events: events, exchanges: events.length };
  }
  function colSub(a, b){ // builds `correct` column by column
    const st = exchState(a, b); let v = 0;
    for(let i = 2; i >= 0; i--) v = v * 10 + (st.cur[i] - dg(b, i));
    return v;
  }

  function colTable(o){
    const cols = o.cols || Math.max(String(o.a).length, 2), A = cellsOf(o.a, cols), B = cellsOf(o.b, cols), R = o.res === undefined || o.res === null ? null : cellsOf(o.res, cols);
    const td = 'width:42px;height:40px;padding:0;text-align:center;', INK = 'var(--vis-ink,#1B1B2F)';
    let s = '<table class="colsum" style="border-collapse:collapse;margin:0 auto;font:800 28px ui-monospace,Menlo,monospace;color:' + INK + '">';
    s += '<tr><td style="width:28px"></td>';
    for(let i = 0; i < cols; i++) s += '<td style="' + td + 'height:20px;font-size:13px;color:var(--vis-b,#9B51E0)">' + COLH[cols - 1 - i] + '</td>';
    s += '</tr>';
    if(o.exch){
      s += '<tr><td></td>';
      for(let i = 0; i < cols; i++) s += '<td class="dx" style="' + td + 'height:28px;font-size:18px;color:var(--vis-bad,#EB5757)">' + (o.exch[cols - 1 - i] === null || o.exch[cols - 1 - i] === undefined ? '' : o.exch[cols - 1 - i]) + '</td>';
      s += '</tr>';
    }
    s += '<tr><td></td>';
    for(let i = 0; i < cols; i++) s += '<td class="da" style="' + td + '">' + A[i] + '</td>';
    s += '</tr><tr><td style="font-size:26px">−</td>';
    for(let i = 0; i < cols; i++) s += '<td class="db" style="' + td + '">' + B[i] + '</td>';
    s += '</tr><tr><td style="border-top:3px solid ' + INK + '"></td>';
    for(let i = 0; i < cols; i++) s += '<td class="dr" style="' + td + 'border-top:3px solid ' + INK + ';color:var(--vis-a,#4F8FE8)">' + (R ? R[i] : (A[i] !== '' ? '?' : '')) + '</td>';
    return s + '</tr></table>';
  }
  function exchRow(a, b){ const st = exchState(a, b); return [0, 1, 2].map(function(i){ return st.changed[i] ? st.cur[i] : null; }); }
  function readRow(html, cls){ const re = new RegExp('<td class="' + cls + '"[^>]*>([^<]*)</td>', 'g'); let m, out = ''; while((m = re.exec(html))) out += m[1]; return out; }
  function readDiff(html){ return parseInt(readRow(html, 'da'), 10) - parseInt(readRow(html, 'db'), 10); }

  /* wrong methods */
  function wrongSwap(a, b){ let v = 0; for(let i = 2; i >= 0; i--) v = v * 10 + Math.abs(dg(a, i) - dg(b, i)); return v; }
  function wrongNoReduce(a, b){ let v = 0; for(let i = 2; i >= 0; i--){ let x = dg(a, i); const y = dg(b, i); if(x < y) x += 10; v = v * 10 + (x - y); } return v; }
  const WHY = {
    swap: 'You took the smaller digit from the bigger one in each column. The top digit must stay on top: if it is too small, exchange 1 from the next column.',
    noReduce: 'You exchanged, but forgot to make the next column 1 smaller. If you take 1 ten (or hundred) away to swap it, it is gone from that column.',
    add: 'You added instead of taking away. Look at the minus sign.'
  };
  function wrongList(a, b){
    const ans = a - b, out = [];
    [['swap', wrongSwap(a, b)], ['noReduce', wrongNoReduce(a, b)]].forEach(function(p){ if(p[1] !== ans) out.push({ v: p[1], why: WHY[p[0]] }); });

  const NEAR = [10, -10, 100, -100, 1, -1, 20, -20];

  function subExplain(a, b){
    const L = Math.max(String(a).length, 1), steps = [], cur = [dg(a, 0), dg(a, 1), dg(a, 2)], bd = [dg(b, 0), dg(b, 1), dg(b, 2)];
    for(let i = 0; i < Math.min(3, Math.max(String(a).length, String(b).length)); i++){
      let t = '<b>' + cap(COLN[i]) + ':</b> ';

        t += 'Now ' + cur[i] + ' − ' + bd[i] + ' = <b>' + (cur[i] - bd[i]) + '</b>.';
      } else t += cur[i] + ' − ' + bd[i] + ' = <b>' + (cur[i] - bd[i]) + '</b>.';

    steps.push('The answer is <b>' + (a - b) + '</b>. Check: ' + (a - b) + ' + ' + b + ' = ' + a + ' ✅');
    return ex(a + ' − ' + b, steps);
  }

  function gen(o){

      const a = randInt(o.amin, o.amax), b = randInt(o.bmin, o.bmax);

  registerSkill({
    id: 'addsub-sub-column', strand: 'addsub', name: 'Column subtraction', emoji: '➖', year: 3, order: 230, prereq: ['addsub-add-column'],

      vis: { kind: 'html', args: [colTable({ a: 83, b: 46, exch: exchRow(83, 46) })] },

        }

        return mcq({ prompt: 'In <b>' + c.a + ' − ' + c.b + '</b>, the ones need an exchange but the tens digit is 0. What happens first?', visual: vis,

          distractors: [opt(K.text('t2o'), 'Swap 1 ten for 10 ones', 'There is no ten to swap — the tens digit is 0! First get some tens from the hundreds.'),
