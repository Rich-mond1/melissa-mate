/* ===== src/skills/fractions-nonunit.js ===== */
/* frac-nonunit — fractions with a numerator bigger than 1: bars, circles and sets of counters.
   Registers a small picture kind V.extra.fracSet (counters, some coloured) with a geometry decoder. */
(function(){
  const DENS = [2, 3, 4, 5, 6, 8, 10];
  const NAMES = { 2: ['half', 'halves'], 3: ['third', 'thirds'], 4: ['quarter', 'quarters'], 5: ['fifth', 'fifths'], 6: ['sixth', 'sixths'], 8: ['eighth', 'eighths'], 10: ['tenth', 'tenths'] };
  function F(n, d){ return fracHTML(n, d); }
  function fK(n, d){ return K.frac(n, d); }
  function words(n, d){ return numWord(n) + ' ' + NAMES[d][n === 1 ? 0 : 1]; }

  /* ---- picture kind: a tray of counters, `s` coloured out of `t` ---- */
  const FINK = 'var(--vis-ink,#1B1B2F)', FBLUE = 'var(--vis-a,#4F8FE8)';
  function fracSetRender(s, t){
    const per = t > 5 ? Math.ceil(t / 2) : t, rows = Math.ceil(t / per), gap = 34;
    let inner = '';
    for(let i = 0; i < t; i++){
      inner += '<circle class="ctr ' + (i < s ? 'on' : 'off') + '" cx="' + (22 + (i % per) * gap) + '" cy="' + (22 + Math.floor(i / per) * gap) + '" r="13" fill="' + (i < s ? FBLUE : '#fff') + '" stroke="' + FINK + '" stroke-width="2.5"/>';
    }
    const w = per * gap + 10, h = rows * gap + 10;
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" role="img" style="max-width:100%;height:auto;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
  }
  V.decodeFracSet = function(html){
    const c = html.match(/<circle[^>]*class="ctr (on|off)"/g) || [];
    return { num: c.filter(function(x){ return /ctr on/.test(x); }).length, den: c.length };
  };
  V.extra.fracSet = {
    render: fracSetRender,
    verify: function(a, html){ const r = V.decodeFracSet(html); return (r.num === a[0] && r.den === a[1]) ? '' : 'fracSet draws ' + r.num + '/' + r.den; }
  };

  function picOf(kind, n, d){ return kind === 'bar' ? V.fractionBar(n, d) : kind === 'circle' ? V.fractionCircle(n, d) : fracSetRender(n, d); }
  function readPic(html){
    if(/class="seg /.test(html)) return V.decodeFractionBar(html);
    if(/class="wedge /.test(html)) return V.decodeFractionCircle(html);
    return V.decodeFracSet(html);
  }

  /* misconception list for "name the fraction"; deep fallback pool so de-duplication by value never starves the options */
  function wrongsFor(n, d, unit, asWords){
    const w = [
      { n: d, d: n, why: 'You flipped it. The top number is how many ' + unit + ' are coloured, the bottom is ALL the ' + unit + '.' },
      { n: d - n, d: d, why: 'That counts the WHITE ' + unit + '. The top number counts the coloured ones.' },
      { n: 1, d: d, why: 'That is only ONE ' + unit.replace(/s$/, '') + '. Count every coloured one for the top number.' },
      { n: n, d: d - n, why: 'You compared coloured with white. The bottom number must count ALL the ' + unit + ', coloured and white.' }
    ];
    const same = [], other = [];
    for(let k = 1; k < d; k++) same.push({ n: k, d: d, why: 'Count the coloured ' + unit + ' carefully: there are ' + n + ', not ' + k + '.' });
    shuffle(DENS).sort(function(a, b){ return Math.abs(a - d) - Math.abs(b - d); }).forEach(function(dd){ if(dd !== d) for(let k = 1; k < dd; k++) other.push({ n: k, d: dd, why: 'Count ALL the ' + unit + ' for the bottom number: there are ' + d + '.' }); });
    return w.concat(shuffle(same), shuffle(other)).filter(function(x){
      if(x.d < 2 || x.n < 1 || x.n === x.d) return false;
      if(asWords) return x.n < x.d && !!NAMES[x.d];
      return true;
    });
  }

  function nameQ(kind, n, d, asWords){
    const vis = picOf(kind, n, d);
    const what = kind === 'bar' ? 'the bar' : kind === 'circle' ? 'the pizza' : 'the counters';
    const unit = kind === 'bar' ? 'parts' : kind === 'circle' ? 'slices' : 'counters';
    const lab = asWords ? words : F;
    const ds = wrongsFor(n, d, unit, asWords).map(function(x){ return opt(fK(x.n, x.d), lab(x.n, x.d), x.why); });
    return mcq({
      prompt: asWords ? 'Which words describe the coloured part of ' + what + '?' : 'What fraction of ' + what + (kind === 'set' ? ' are' : ' is') + ' coloured?', visual: vis,
      correct: opt(fK(n, d), lab(n, d)), distractors: ds, keepOrder: true,
      hint: 'Count ALL the ' + unit + ' first (bottom number). Then count only the coloured ones (top number).',
      explain: ex('Naming the fraction', [
        'Count <b>all</b> the ' + unit + ': <b>' + d + '</b>. That is the bottom number' + (asWords ? ', so we say ' + NAMES[d][1] + '.' : '.'),
        'Count the <b>coloured</b> ' + unit + ': <b>' + n + '</b>. That is the top number.',
        'So <b>' + (asWords ? words(n, d) : n + '/' + d) + '</b> of ' + what + (kind === 'set' ? ' are' : ' is') + ' coloured' + (asWords ? ' (' + n + '/' + d + ')' : '') + '. ✅'
      ]),
      truth: fK(n * 2, d * 2),
      decode: function(){ const r = readPic(vis); return fK(r.num, r.den); }
    });
  }

  function compQ(kind, n, d){
    const vis = picOf(kind, n, d);
    const what = kind === 'bar' ? 'bar' : kind === 'circle' ? 'pizza' : 'counters';
    const unit = kind === 'bar' ? 'parts' : kind === 'circle' ? 'slices' : 'counters';
    const w = d - n;
    const list = [
      { n: n, d: d, why: 'That is the COLOURED part. The question asks about the white part.' },
      { n: w, d: n, why: 'The bottom number must count ALL the ' + unit + ', not only the coloured ones.' },
      { n: 1, d: d, why: 'That is only one ' + unit.replace(/s$/, '') + '. Count all the white ones.' },
      { n: d, d: w, why: 'You flipped it. The top number is how many white ' + unit + ', the bottom is ALL of them.' }
    ].concat(wrongsFor(n, d, unit, false));
    const ds = list.filter(function(x){ return x.d >= 2 && x.n >= 1 && x.n !== x.d; }).map(function(x){ return opt(fK(x.n, x.d), F(x.n, x.d), x.why); });
    return mcq({
      prompt: 'What fraction of the ' + what + (kind === 'set' ? ' are' : ' is') + ' NOT coloured?', visual: vis,
      correct: opt(fK(w, d), F(w, d)), distractors: ds, keepOrder: true,
      hint: 'Count the WHITE ' + unit + ' for the top number. The bottom number is still ALL the ' + unit + '.',
      explain: ex('The white part', [
        'There are <b>' + d + '</b> ' + unit + ' altogether, so the bottom number is ' + d + '.',
        '<b>' + n + '</b> are coloured, so ' + d + ' − ' + n + ' = <b>' + w + '</b> are NOT coloured.',
        'The white part is <b>' + w + '/' + d + '</b>. ✅'
      ]),
      truth: fK(d * d - n * d, d * d),
      decode: function(){ const r = readPic(vis); return fK(r.den - r.num, r.den); }
    });
  }

  function shadeQ(n, d){
    return shade({
      prompt: 'Colour ' + n + '/' + d + ' of the bar.', den: d, num: n,
      hint: 'The bottom number (' + d + ') says how many equal parts the bar has. Tap exactly ' + n + ' of them.',
      explain: ex('Colouring ' + n + '/' + d, ['The bar is cut into <b>' + d + '</b> equal parts.', 'The top number <b>' + n + '</b> says how many parts to colour.', 'Colour <b>' + n + '</b> parts and leave ' + (d - n) + ' white. ✅'])
    });
  }

  function typedQ(kind, n, d){
    const vis = picOf(kind, n, d);
    const unit = kind === 'bar' ? 'parts' : kind === 'circle' ? 'slices' : 'counters';
    const what = kind === 'bar' ? 'bar' : kind === 'circle' ? 'pizza' : 'row of counters';
    const w = d - n;
    return numeric({
      prompt: (kind === 'set' ? 'There are ' + d + ' counters. ' + n + '/' + d + ' of them are coloured.' : 'The ' + what + ' is split into ' + d + ' equal ' + unit + '. ' + n + '/' + d + ' of it is coloured.') + ' How many ' + unit + ' are NOT coloured?', visual: vis, answer: w,
      hint: 'Count the white ' + unit + ' in the picture, or take the coloured ones away from ' + d + '.',
      explain: ex('Counting the white ' + unit, ['There are <b>' + d + '</b> ' + unit + ' altogether.', '<b>' + n + '</b> are coloured.', d + ' − ' + n + ' = <b>' + w + '</b> ' + unit + ' are white. ✅']),
      truth: w, decode: function(){ const r = readPic(vis); return r.den - r.num; },
      wrong: function(v){ return v === n ? 'That is the number of COLOURED ' + unit + '. We want the white ones.' : v === d ? 'That is ALL the ' + unit + '.' : ''; }
    });
  }

  function oddQ(){
    const d = randInt(4, 9), n = randInt(2, d - 2);
    const cands = [[n + 1, d], [n - 1, d], [n, d + 1], [n, d - 1], [d - n, d]].filter(function(c){ return c[0] >= 1 && c[0] < c[1] && c[1] <= 10 && fK(c[0], c[1]) !== fK(n, d); });
    const odd = pick(cands);
    const kinds = shuffle(['bar', 'circle', 'set']);
    const shown = kinds.map(function(k){ return opt('shown:' + k, picOf(k, n, d), 'That picture DOES show ' + n + '/' + d + '. We want the one that does NOT.'); });
    const oddKind = pick(kinds);
    const q = mcq({
      prompt: 'Three of these pictures show ' + n + '/' + d + '. Which picture does NOT?', visual: '',
      correct: opt(fK(odd[0], odd[1]), picOf(oddKind, odd[0], odd[1])), distractors: shown, count: 4, keepOrder: true,
      hint: 'For each picture count ALL the parts (bottom number) and then the coloured parts (top number). Look for the one that is not ' + n + '/' + d + '.',
      explain: ex('Finding the odd one out', [
        n + '/' + d + ' means <b>' + d + '</b> equal parts with <b>' + n + '</b> coloured.',
        'Three pictures match that. One picture shows <b>' + odd[0] + '/' + odd[1] + '</b> instead.',
        'That picture is the one that does NOT show ' + n + '/' + d + '. ✅'
      ]),
      truth: fK(odd[0] * 3, odd[1] * 3)
    });
    q.optionsAreVisual = true;
    const target = fK(n, d);
    q.decodeKey = function(){
      let found = null;
      for(let i = 0; i < q.options.length; i++){
        const r = readPic(q.options[i].label), k = fK(r.num, r.den);
        if(k === target){ if(q.options[i].key.indexOf('shown:') !== 0) return 'shown option has a wrong key'; }
        else { if(found !== null) return 'two odd pictures'; found = k; if(q.options[i].key !== k) return 'odd option key does not match picture'; }
      }
      return found;
    };
    return q;
  }

  registerSkill({
    id: 'frac-nonunit', strand: 'fractions', name: 'Fractions with more than one part', emoji: '🍰', year: 3, order: 420, prereq: ['frac-read'],
    lesson: {
      title: 'More than one part',
      steps: [
        { say: 'A <b>unit fraction</b> has 1 on top, like 1/4. Now we can take MORE parts! Here <b>3</b> of the <b>4</b> equal parts are coloured. That is <b>3/4</b>, said “three quarters”.', vis: { kind: 'fractionBar', args: [3, 4] } },
        { say: 'The <b>top</b> number counts the parts we have. The <b>bottom</b> number says how many equal parts make the whole. This pizza shows <b>2/3</b>: 2 slices out of 3.', vis: { kind: 'fractionCircle', args: [2, 3] } },
        { say: 'Fractions work for groups of things too. There are <b>5</b> counters and <b>3</b> are coloured. So <b>3/5</b> of the counters are coloured.', vis: { kind: 'fracSet', args: [3, 5] } },
        { say: 'Your turn! Look at the counters. Count them all, then count the coloured ones.', vis: { kind: 'fracSet', args: [2, 5] },
          quiz: { prompt: 'What fraction of the counters is coloured?', options: [{ label: '2/5', ok: true }, { label: '5/2', ok: false }, { label: '3/5', ok: false }], right: 'Yes! 2 coloured out of 5 counters is 2/5.', wrong: 'There are 5 counters altogether (bottom) and 2 coloured (top). So 2/5.' } },
        { say: 'The white part is a fraction too! 3 parts are coloured and <b>1</b> is white, so the white part is <b>1/4</b>. Coloured + white make the whole bar: 3/4 + 1/4 = 4/4.', vis: { kind: 'fractionBar', args: [3, 4] },
          quiz: { prompt: 'This bar has 5 parts and 3 are coloured. What fraction is white?', options: [{ label: '3/5', ok: false }, { label: '2/5', ok: true }, { label: '2/3', ok: false }], right: 'Yes! 5 − 3 = 2 white parts out of 5, so 2/5.', wrong: 'White parts: 5 − 3 = 2. The bottom number is still all 5 parts. So 2/5.' } }
      ]
    },
    trick: {
      title: 'Top = I have, bottom = all',
      say: 'Say a fraction like counting: <b>3/5</b> is “<b>three</b> lots of <b>one fifth</b>”. The <b>bottom</b> number tells you the size of each part. The <b>top</b> number tells you how many of them you have.',
      vis: { kind: 'fractionBar', args: [3, 5] },
      example: '3/5 → 5 equal parts, colour 3 → “three fifths”'
    },
    gen: {
      1: function(){
        const d = pick([3, 4, 5, 6]), n = randInt(2, d - 1);
        if(chance(0.25)) return shadeQ(n, d);
        return nameQ(pick(['bar', 'bar', 'circle', 'set']), n, d, false);
      },
      2: function(){
        const d = pick([4, 5, 6, 8, 10]), n = randInt(2, d - 1), r = randInt(0, 4);
        if(r === 0) return shadeQ(n, d);
        if(r === 1) return nameQ(pick(['bar', 'circle']), n, d, true);
        return nameQ(pick(['bar', 'circle', 'set']), n, d, false);
      },
      3: function(){
        const r = randInt(0, 5);
        if(r <= 1) return oddQ();
        if(r === 2){ const d = pick([5, 6, 8, 10]); return shadeQ(randInt(2, d - 1), d); }
        let d = pick([5, 6, 7, 8, 9, 10]), n = randInt(2, d - 1);
        if(2 * n === d) n = n + 1;
        const kind = pick(['bar', 'circle', 'set']);
        if(r === 3) return compQ(kind, n, d);
        if(r === 4) return typedQ(kind, n, d);
        if(!NAMES[d]){ d = pick([5, 6, 8, 10]); n = randInt(2, d - 1); if(2 * n === d) n = n + 1; }
        return nameQ(kind, n, d, true);
      }
    }
  });
})();

/* ===== src/skills/fractions-number-line.js ===== */
/* frac-number-line — fractions on a 0-1 number line (and 0-2 in tier 3, read as "one and two quarters").
   All lines use width 300 (or 240 for small option lines) so tick positions are exact and the decoders can read the
   denominator from the number of drawn ticks and the numerator from the marker position. */
(function(){
  const DENS = [2, 3, 4, 5, 6, 8, 10];
  const NAMES = { 2: ['half', 'halves'], 3: ['third', 'thirds'], 4: ['quarter', 'quarters'], 5: ['fifth', 'fifths'], 6: ['sixth', 'sixths'], 8: ['eighth', 'eighths'], 10: ['tenth', 'tenths'] };
  function F(n, d){ return fracHTML(n, d); }
  function fK(n, d){ return K.frac(n, d); }
  function words(n, d){ return numWord(n) + ' ' + NAMES[d][n === 1 ? 0 : 1]; }
  function mixedWords(w, n, d){ return (w ? numWord(w) + ' and ' : '') + words(n, d); }

  /* 0-1 line cut into d equal steps; dot/question mark at n/d (n === null: no marker); o.all prints every fraction */
  function line01(d, n, o){
    o = o || {};
    return V.numberLine({
      min: 0, max: 1, minor: 1 / d, major: o.all ? 1 / d : 1, width: o.width || 300,
      marks: n === null ? [] : [{ value: n / d, kind: o.dot ? 'dot' : 'q' }],
      labels: function(v){ const k = Math.round(v * d); return k === 0 ? '0' : k === d ? '1' : (o.all ? k + '/' + d : ''); }
    });
  }
  function line02(d, n, o){ // dot at 1 + n/d, whole numbers 0, 1, 2 labelled
    return V.numberLine({ min: 0, max: 2, minor: 1 / d, major: 1, width: 300, marks: [{ value: 1 + n / d, kind: (o && o.dot) ? 'dot' : 'q' }], labels: function(v){ return String(Math.round(v)); } });
  }
  /* read back from the DRAWING: steps in one whole = ticks, position of the marker */
  function readFrac(html, wholes){
    const den = (V.countTicks(html) - 1) / wholes;
    const v = V.decodeNumberLine(html);
    return { num: Math.round(v * den), den: den };
  }

  function readWrongs(n, d){
    const w = [];
    if(n + 1 < d) w.push({ n: n + 1, d: d, why: 'You counted the 0 mark as a step. Start counting the JUMPS from 0 (0 is zero jumps).' });
    w.push({ n: n, d: d + 1, why: 'You counted the tick marks (' + (d + 1) + '). Count the equal STEPS between 0 and 1: there are ' + d + '.' });
    w.push({ n: d - n, d: d, why: 'You counted from the 1 going backwards. Count the steps from 0 to the dot.' });
    if(n - 1 >= 1) w.push({ n: n - 1, d: d, why: 'Count the jumps again — you are one jump short.' });
    w.push({ n: 1, d: d, why: 'That is only one step from 0. Count every step up to the dot.' });
    const same = [], other = [];
    for(let k = 1; k < d; k++) same.push({ n: k, d: d, why: 'Count the steps from 0 to the dot carefully.' });
    shuffle(DENS).sort(function(a, b){ return Math.abs(a - d) - Math.abs(b - d); }).forEach(function(dd){ if(dd !== d) for(let k = 1; k < dd; k++) other.push({ n: k, d: dd, why: 'The line from 0 to 1 is cut into ' + d + ' steps, so the bottom number is ' + d + '.' }); });
    return w.concat(shuffle(same), other).filter(function(x){ return x.d >= 2 && x.n >= 1 && x.n < x.d; });
  }

  function readQ(d, n, all){
    const vis = line01(d, n, { all: all });
    return mcq({
      prompt: all ? 'The number line from 0 to 1 has ' + d + ' equal steps. Which fraction is the ? pointing to?' : 'The number line from 0 to 1 is cut into ' + d + ' equal steps. What fraction is the ? at?', visual: vis,
      correct: opt(fK(n, d), F(n, d)), keepOrder: true,
      distractors: readWrongs(n, d).map(function(x){ return opt(fK(x.n, x.d), F(x.n, x.d), x.why); }),
      hint: 'Count the JUMPS from 0 to the ?. The bottom number is how many equal steps are in the whole line from 0 to 1.',
      explain: ex('Reading the number line', [
        'The line from 0 to 1 has <b>' + d + '</b> equal steps, so each step is 1/' + d + '.',
        'From 0 to the ? there ' + (n === 1 ? 'is' : 'are') + ' <b>' + plural(n, 'step') + '</b>.',
        'So the ? is at <b>' + n + '/' + d + '</b>. ✅'
      ]),
      truth: fK(n * 2, d * 2),
      decode: function(){ const r = readFrac(vis, 1); return fK(r.num, r.den); }
    });
  }

  function typedQ(d, n){
    const vis = line01(d, n, {});
    return numeric({
      prompt: 'The number line from 0 to 1 is cut into ' + d + ' equal steps. The ? is at ?/' + d + '. Type the missing top number.', visual: vis, answer: n,
      hint: 'Count the jumps from 0 to the ?. That number goes on the top.',
      explain: ex('Counting the steps', ['The ? is <b>' + plural(n, 'step') + '</b> along from 0.', 'Each step is 1/' + d + ', so the fraction is ' + n + '/' + d + '.', 'The missing top number is <b>' + n + '</b>. ✅']),
      truth: n, decode: function(){ return readFrac(vis, 1).num; },
      wrong: function(v){ return v === n + 1 ? 'You counted the 0 mark as a step. Count the jumps instead.' : v === d - n ? 'You counted from the 1. Count the jumps from 0.' : v === d ? 'That is the bottom number. We want the top number: the steps from 0.' : ''; }
    });
  }

  function pictureQ(d, n){
    const ds = [];
    for(let k = 1; k < d; k++) if(k !== n) ds.push(opt(fK(k, d), line01(d, k, { width: 240 }), 'That dot is at ' + k + '/' + d + ', not ' + n + '/' + d + '.'));
    const q = mcq({
      prompt: 'Which number line has the ? at ' + n + '/' + d + '?', visual: '',
      correct: opt(fK(n, d), line01(d, n, { width: 240 })), distractors: shuffle(ds), count: Math.min(3, d - 1 >= 3 ? 3 : 2),
      hint: 'Each line is cut into ' + d + ' equal steps. Count ' + n + ' steps along from 0.',
      explain: ex('Placing ' + n + '/' + d, ['The line from 0 to 1 is cut into <b>' + d + '</b> equal steps.', 'The top number says to walk <b>' + plural(n, 'step') + '</b> from 0.', 'Only one line has its ? at <b>' + n + '/' + d + '</b>. ✅']),
      truth: fK(n * 3, d * 3)
    });
    q.optionsAreVisual = true;
    q.decodeKey = function(){
      for(let i = 0; i < q.options.length; i++){ const r = readFrac(q.options[i].label, 1); if(r.den !== d || fK(r.num, r.den) !== q.options[i].key) return 'option ' + i + ' picture does not match its key'; }
      return q.options[q.correct].key;
    };
    return q;
  }

  function mixedQ(d, n){
    const vis = line02(d, n);
    const val = function(w, k){ return K.num(w + k / d); };
    const list = [
      { w: 1, k: d - n, why: 'You counted back from the 2. Count the steps after the 1, going right.' },
      { w: 0, k: n, why: 'You forgot the whole one. The ? is PAST the 1, so it is one and a bit.' },
      { w: 2, k: n, why: 'The ? is between 1 and 2, so it is “one and…”, not “two and…”.' },
      { w: 1, k: n + 1, why: 'You counted the 1 as a step. Start counting steps AFTER the 1.' },
      { w: 1, k: n - 1, why: 'Count the steps after the 1 again — you are one short.' }
    ];
    for(let k = 1; k < d; k++) list.push({ w: 1, k: k, why: 'Count the steps after the 1 carefully: there are ' + n + '.' });
    const ds = list.filter(function(x){ return x.k >= 1 && x.k < d; }).map(function(x){ return opt(val(x.w, x.k), mixedWords(x.w, x.k, d), x.why); });
    return mcq({
      prompt: 'The number line goes from 0 to 2. Each whole is cut into ' + d + ' equal steps. What number is the ? at?', visual: vis,
      correct: opt(val(1, n), mixedWords(1, n, d)), distractors: ds, keepOrder: true, count: Math.min(4, new Set(ds.map(function(o){ return o.key; }).filter(function(k){ return k !== val(1, n); })).size + 1),
      hint: 'The ? is past the 1. First say how many wholes (1), then count the steps after the 1.',
      explain: ex('Reading past 1', [
        'The ? is just after the <b>1</b>, so we say “one and…”.',
        'After the 1 there ' + (n === 1 ? 'is' : 'are') + ' <b>' + plural(n, 'step') + '</b>, and each step is 1/' + d + ' (' + NAMES[d][1] + ').',
        'So the ? is at <b>' + mixedWords(1, n, d) + '</b>. ✅'
      ]),
      truth: K.num((d + n) / d),
      decode: function(){ const r = readFrac(vis, 2); return K.num(1 * 0 + r.num / r.den); }
    });
  }

  function ana(d, n){ // Ana says the ? is at a/d. Is she right?
    const right = chance(0.4);
    let a = right ? n : (chance(0.5) ? d - n : n + (chance(0.5) ? 1 : -1));
    if(!right && (a === n || a < 1 || a >= d)) a = n === 1 ? 2 : n - 1;
    const vis = line01(d, n, {});
    const nm = pick(['Ana', 'Marcus', 'Sophie', 'Ivan', 'Lucy', 'Diego', 'Aisha', 'Kai']);
    const yes = opt(K.bool(true), 'Yes', 'The ? really is at that fraction. Count the jumps from 0 again.');
    const no = opt(K.bool(false), 'No', 'Count the jumps from 0 to the ? again — it IS at a different fraction.');
    return mcq2({
      prompt: nm + ' says the ? is at ' + a + '/' + d + '. Is ' + nm + ' right?', visual: vis,
      correct: right ? yes : no, other: right ? no : yes,
      hint: 'Count the jumps from 0 to the ? and compare with the top number.',
      explain: right
        ? ex('Checking', ['The line has <b>' + d + '</b> equal steps.', 'The ? is <b>' + plural(n, 'step') + '</b> from 0, so it is at ' + n + '/' + d + '.', 'Yes — ' + nm + ' is right. ✅'])
        : ex('Checking', ['The line has <b>' + d + '</b> equal steps.', 'The ? is <b>' + plural(n, 'step') + '</b> from 0, so it is at ' + n + '/' + d + ', not ' + a + '/' + d + '.', 'No — ' + nm + ' is not right. ✅']),
      truth: K.bool(n === a),
      decode: function(){ const r = readFrac(vis, 1); return K.bool(r.num === a && r.den === d); }
    });
  }

  registerSkill({
    id: 'frac-number-line', strand: 'fractions', name: 'Fractions on a number line', emoji: '📏', year: 3, order: 430, prereq: ['frac-nonunit'],
    lesson: {
      title: 'Fractions between 0 and 1',
      steps: [
        { say: 'Fractions live on number lines too! The space from <b>0</b> to <b>1</b> is one whole. Here it is cut into <b>4 equal steps</b>, so each step is <b>1/4</b>.', vis: { kind: 'numberLine', args: [{ min: 0, max: 1, minor: 0.25, major: 0.25, width: 300, marks: [], labels: function(v){ const k = Math.round(v * 4); return k === 0 ? '0' : k === 4 ? '1' : k + '/4'; } }] } },
        { say: 'Count the <b>steps</b> from 0 to the dot. The dot is <b>3</b> steps along, so it is at <b>3/4</b>.', vis: { kind: 'numberLine', args: [{ min: 0, max: 1, minor: 0.25, major: 1, width: 300, marks: [{ value: 0.75, kind: 'dot' }], labels: function(v){ return v < 0.5 ? '0' : '1'; } }] } },
        { say: 'Now the line is cut into <b>3</b> equal steps. The bottom number is <b>3</b> because there are 3 steps in the whole. Count the steps to the dot.', vis: { kind: 'numberLine', args: [{ min: 0, max: 1, minor: 1 / 3, major: 1, width: 300, marks: [{ value: 2 / 3, kind: 'dot' }], labels: function(v){ return v < 0.5 ? '0' : '1'; } }] },
          quiz: { prompt: 'Which fraction is the dot at?', options: [{ label: '2/3', ok: true }, { label: '3/2', ok: false }, { label: '1/3', ok: false }], right: 'Yes! 2 steps out of 3 is 2/3.', wrong: 'The dot is 2 steps from 0 and the whole line has 3 steps. So 2/3.' } },
        { say: 'Half way along is <b>1/2</b>. The nearer a dot is to 1, the bigger the fraction.', vis: { kind: 'numberLine', args: [{ min: 0, max: 1, minor: 0.5, major: 1, width: 300, marks: [{ value: 0.5, kind: 'dot' }], labels: function(v){ return v < 0.5 ? '0' : '1'; } }] } },
        { say: 'The line can go past 1! This dot is 1 whole and then 1 more step of a quarter. We read it as <b>“one and one quarter”</b>.', vis: { kind: 'numberLine', args: [{ min: 0, max: 2, minor: 0.25, major: 1, width: 300, marks: [{ value: 1.25, kind: 'dot' }], labels: function(v){ return String(Math.round(v)); } }] },
          quiz: { prompt: 'The dot is past 1. How do we read it?', options: [{ label: 'one and one quarter', ok: true }, { label: 'one quarter', ok: false }, { label: 'two and one quarter', ok: false }], right: 'Yes! One whole, and one more quarter.', wrong: 'The dot is past the 1 but not yet at the 2, so it is “one and one quarter”.' } }
      ]
    },
    trick: {
      title: 'Count the jumps, not the stops',
      say: 'Start at 0 and <b>count the jumps</b> (the gaps) to the dot. Do NOT count the tick marks, because the 0 mark is zero jumps! The number of jumps is the <b>top</b>. The jumps in the whole line is the <b>bottom</b>.',
      vis: { kind: 'numberLine', args: [{ min: 0, max: 1, minor: 0.2, major: 1, width: 300, marks: [{ value: 0.6, kind: 'dot' }], labels: function(v){ return v < 0.5 ? '0' : '1'; } }] },
      example: '3 jumps from 0, and 5 jumps in the whole line → <b>3/5</b>'
    },
    gen: {
      1: function(){
        const d = pick([2, 3, 4, 5]), n = randInt(1, d - 1);
        return readQ(d, n, chance(0.5));
      },
      2: function(){
        const r = randInt(0, 4);
        if(r <= 1){ const d = pick(DENS.filter(function(x){ return x >= 3; })), n = randInt(1, d - 1); return readQ(d, n, false); }
        if(r === 2){ const d = pick([3, 4, 5, 6, 8]); return pictureQ(d, randInt(1, d - 1)); }
        const d = pick([4, 5, 6, 8, 10]);
        return typedQ(d, randInt(1, d - 1));
      },
      3: function(){
        const r = randInt(0, 5);
        if(r <= 1){ const d = pick([2, 3, 4, 5, 6, 8]); return mixedQ(d, randInt(1, d - 1)); }
        if(r === 2){ const d = pick([5, 6, 8, 10]); return typedQ(d, randInt(2, d - 1)); }
        if(r === 3){ const d = pick([4, 5, 6, 8, 10]); return pictureQ(d, randInt(1, d - 1)); }
        if(r === 4){ const d = pick([4, 5, 6, 8, 10]); return ana(d, randInt(1, d - 1)); }
        const d = pick([6, 8, 10]); return readQ(d, randInt(2, d - 1), false);
      }
    }
  });
})();

/* ===== src/skills/fractions-of-quantity.js ===== */
/* frac-of-quantity — unit and non-unit fractions of a quantity (1/4 of 12, 3/4 of 20).
   Registers V.extra.fracGroups: d equal groups of `per` counters with the first `hl` groups highlighted (gold),
   plus a decoder that reads the groups, the counters per group and the highlighted groups from the drawing. */
(function(){
  function F(n, d){ return fracHTML(n, d); }
  const INK = 'var(--vis-ink,#1B1B2F)', BLUE = 'var(--vis-a,#4F8FE8)', GOLD = 'var(--vis-warm,#F2C94C)', SOFTBG = 'var(--vis-soft,#EEF1FB)', PURP = 'var(--vis-b,#9B51E0)';

  function groupsRender(d, per, hl){
    const gw = 16 + Math.min(per, 5) * 20, gh = 16 + Math.ceil(per / 5) * 20, gap = 12;
    const perRow = Math.max(1, Math.floor(320 / (gw + gap)));
    let s = '';
    for(let g = 0; g < d; g++){
      const gx = 6 + (g % perRow) * (gw + gap), gy = 6 + Math.floor(g / perRow) * (gh + gap), on = g < hl;
      s += '<rect class="fgrp' + (on ? ' hl' : '') + '" x="' + gx + '" y="' + gy + '" width="' + gw + '" height="' + gh + '" rx="12" fill="' + (on ? '#FFF3C4' : SOFTBG) + '" stroke="' + (on ? INK : PURP) + '" stroke-width="' + (on ? 3.5 : 2.5) + '"' + (on ? '' : ' stroke-dasharray="5 4"') + '/>';
      for(let k = 0; k < per; k++) s += '<circle class="fdot" cx="' + (gx + 18 + (k % 5) * 20) + '" cy="' + (gy + 18 + Math.floor(k / 5) * 20) + '" r="7.5" fill="' + (on ? GOLD : BLUE) + '" stroke="' + INK + '" stroke-width="1.3"/>';
    }
    const cols = Math.min(perRow, d), rows = Math.ceil(d / perRow);
    const w = cols * (gw + gap) + 6, h = rows * (gh + gap) + 6;
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + Math.min(w, 340) + '" role="img" style="max-width:100%;height:auto;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">' + s + '</svg>';
  }
  V.decodeFracGroups = function(html){
    const g = html.match(/<rect[^>]*class="fgrp( hl)?"/g) || [];
    const dots = (html.match(/<circle[^>]*class="fdot"/g) || []).length;
    return { groups: g.length, hl: g.filter(function(t){ return / hl"/.test(t); }).length, per: g.length ? dots / g.length : 0, total: dots };
  };
  V.extra.fracGroups = {
    render: groupsRender,
    verify: function(a, html){ const r = V.decodeFracGroups(html); return (r.groups === a[0] && r.per === a[1] && r.hl === a[2]) ? '' : 'fracGroups draws ' + r.groups + ' groups of ' + r.per + ' with ' + r.hl + ' highlighted'; }
  };

  const THINGS = ['stickers', 'marbles', 'shells', 'sweets', 'football cards', 'buttons', 'stars', 'beads', 'seeds', 'pencils', 'flowers', 'stamps'];
  const NAMES = ['Ana', 'Marcus', 'Sophie', 'Ivan', 'Lucy', 'Diego', 'Ellen', 'Tom', 'Aisha', 'Kai', 'Mei', 'Leo'];
  function two(){ const a = pick(NAMES); let b = pick(NAMES); while(b === a) b = pick(NAMES); return [a, b]; }

  function explainOf(n, d, per, total, ans){
    return ex(n + '/' + d + ' of ' + total, [
      'The bottom number is <b>' + d + '</b>, so share ' + total + ' into ' + d + ' equal groups: ' + total + ' ÷ ' + d + ' = <b>' + per + '</b> in each group.',
      n === 1 ? 'The top number is <b>1</b>, so take just 1 group: <b>' + per + '</b>.' : 'The top number is <b>' + n + '</b>, so take ' + n + ' groups: ' + n + ' × ' + per + ' = <b>' + ans + '</b>.',
      n + '/' + d + ' of ' + total + ' is <b>' + ans + '</b>. ✅'
    ]);
  }
  function wrongsNum(n, d, per, total){
    const w = [];
    if(n > 1) w.push({ v: per, why: 'You found 1/' + d + ' of ' + total + ' (' + per + '). The top number is ' + n + ', so now multiply by ' + n + '.' });
    w.push({ v: d, why: 'That is the bottom number. Share ' + total + ' into ' + d + ' groups and count what is in the groups you take.' });
    w.push({ v: total, why: 'That is the whole amount. A fraction of it is smaller.' });
    if(n > 1) w.push({ v: n, why: 'That is the top number. You need to share first, then take ' + n + ' groups.' });
    w.push({ v: (d - n) * per, why: 'That is the part you did NOT take. Count the groups you take: ' + n + '.' });
    w.push({ v: n * per + per, why: 'That is one group too many. Take exactly ' + n + (n === 1 ? ' group.' : ' groups.') });
    return w;
  }
  function numQ(prompt, vis, n, d, per, decode){
    const total = d * per, ans = n * per;
    return mcqNum({
      prompt: prompt, visual: vis, answer: ans, wrong: wrongsNum(n, d, per, total),
      nearby: [1, -1, 2, -2, 3, -3, 4, 5],
      hint: 'Share ' + total + ' into ' + d + ' equal groups (÷ ' + d + '). Then take ' + n + (n === 1 ? ' group.' : ' groups.'),
      explain: explainOf(n, d, per, total, ans),
      truth: (total * n) / d, decode: decode
    });
  }
  function typedQ(prompt, vis, n, d, per, decode){
    const total = d * per, ans = n * per;
    return numeric({
      prompt: prompt, visual: vis || '', answer: ans,
      hint: 'First find 1/' + d + ': share into ' + d + ' equal groups (÷ ' + d + '). Then multiply by the top number.',
      explain: explainOf(n, d, per, total, ans),
      truth: (total * n) / d, decode: decode,
      wrong: function(v){
        if(n > 1 && v === per) return 'You found 1/' + d + ' (' + per + '). Now multiply by the top number ' + n + '.';
        if(v === d) return 'That is the bottom number. Divide ' + total + ' by it instead.';
        if(v === total) return 'That is the whole amount. A fraction of it is smaller.';
        if(v === (d - n) * per) return 'That is the part left over. Count the groups you take.';
        return '';
      }
    });
  }

  function pictureQ(n, d, per, tier){
    const total = d * per;
    const vis = groupsRender(d, per, n);
    const dec = function(){ const r = V.decodeFracGroups(vis); return r.hl * r.per; };
    const t = pick(THINGS);
    const prompts = [
      'The ' + total + ' counters are in ' + d + ' equal groups. ' + n + (n === 1 ? ' group is' : ' groups are') + ' gold. What is ' + F(n, d) + ' of ' + total + '?',
      'What is ' + F(n, d) + ' of ' + total + '? Look at the ' + d + ' equal groups. The gold ones show ' + F(n, d) + '.'
    ];
    return numQ(pick(prompts), vis, n, d, per, dec);
  }

  function wordQ(n, d, per, typed, withPic){
    const total = d * per, nm = two(), t = pick(THINGS);
    const forms = [
      nm[0] + ' has ' + total + ' ' + t + '. ' + nm[0] + ' gives ' + F(n, d) + ' of them to ' + nm[1] + '. How many does ' + nm[1] + ' get?',
      'A box holds ' + total + ' ' + t + '. ' + F(n, d) + ' of them are red. How many are red?',
      nm[0] + ' collects ' + total + ' ' + t + '. ' + F(n, d) + ' of them are shiny. How many are shiny?'
    ];
    const vis = withPic ? groupsRender(d, per, n) : '';
    const dec = withPic ? function(){ const r = V.decodeFracGroups(vis); return r.hl * r.per; } : undefined;
    const prompt = pick(forms);
    return typed ? typedQ(prompt, vis, n, d, per, dec) : numQ(prompt, vis, n, d, per, dec);
  }

  function leftQ(){ // two steps: how many are NOT ...
    const d = pick([3, 4, 5, 6, 8]), n = randInt(1, d - 1), per = randInt(2, 8), total = d * per, nm = pick(NAMES), t = pick(THINGS);
    const ans = (d - n) * per, taken = n * per;
    const form = pick([
      nm + ' has ' + total + ' ' + t + '. ' + nm + ' uses ' + F(n, d) + ' of them. How many are left?',
      'A bag has ' + total + ' ' + t + '. ' + F(n, d) + ' of them are blue. How many are NOT blue?'
    ]);
    return numeric({
      prompt: form, answer: ans,
      hint: 'Step 1: find ' + n + '/' + d + ' of ' + total + '. Step 2: take that away from ' + total + '.',
      explain: ex('Two steps', [
        'Share ' + total + ' into ' + d + ' equal groups: ' + total + ' ÷ ' + d + ' = <b>' + per + '</b> in each group.',
        n + '/' + d + ' of ' + total + ' is ' + n + ' × ' + per + ' = <b>' + taken + '</b>.',
        total + ' − ' + taken + ' = <b>' + ans + '</b> are left. ✅'
      ]),
      truth: total - (total * n) / d,
      wrong: function(v){ return v === taken ? 'That is the part that was used. The question asks how many are LEFT.' : v === per && n > 1 ? 'That is only 1/' + d + '. Find ' + n + '/' + d + ' first, then take it away.' : ''; }
    });
  }

  function reverseQ(){ // 1/d of a number is per. What is the number?
    const d = pick([2, 3, 4, 5, 6, 10]), per = randInt(2, 9), total = d * per;
    return numeric({
      prompt: F(1, d) + ' of a number is ' + per + '. What is the number?',
      answer: total,
      hint: 'The number was shared into ' + d + ' equal groups, and one group is ' + per + '. How many are there in all ' + d + ' groups?',
      explain: ex('Working backwards', ['One group (1/' + d + ') is <b>' + per + '</b>.', 'There are ' + d + ' equal groups, so multiply: ' + d + ' × ' + per + ' = <b>' + total + '</b>.', 'Check: ' + total + ' ÷ ' + d + ' = ' + per + '. The number is <b>' + total + '</b>. ✅']),
      truth: per * d,
      wrong: function(v){ return v === per ? 'That is the answer to the fraction, not the whole number. Multiply by ' + d + '.' : v === per + d ? 'You added. Remember ' + d + ' equal groups of ' + per + ' means multiply.' : ''; }
    });
  }

  registerSkill({
    id: 'frac-of-quantity', strand: 'fractions', name: 'Fractions of amounts', emoji: '🧮', year: 3, order: 440, prereq: ['frac-nonunit', 'multdiv-2-5-10'],
    lesson: {
      title: 'A fraction of a number',
      steps: [
        { say: 'To find a fraction of a number, <b>share</b> it into equal groups. 12 counters shared into <b>4</b> equal groups gives <b>3</b> in each. One group is 1/4, so <b>1/4 of 12 = 3</b>.', vis: { kind: 'fracGroups', args: [4, 3, 1] } },
        { say: 'The <b>bottom</b> number tells you how many equal groups to make. The <b>top</b> number tells you how many groups to take. Here: 2 groups, take 1.', vis: { kind: 'fracGroups', args: [2, 5, 1] },
          quiz: { prompt: 'What is 1/2 of 10?', options: [{ label: '5', ok: true }, { label: '2', ok: false }, { label: '10', ok: false }], right: 'Yes! 10 shared into 2 groups is 5 in each. 1/2 of 10 = 5.', wrong: 'Share 10 into 2 equal groups: 5 in each group. Take 1 group, so 1/2 of 10 = 5.' } },
        { say: 'What about <b>3/4 of 12</b>? Share 12 into 4 groups of 3, then take <b>3 groups</b>. 3 groups of 3 is 9. So <b>3/4 of 12 = 9</b>.', vis: { kind: 'fracGroups', args: [4, 3, 3] },
          quiz: { prompt: 'What is 3/4 of 12?', options: [{ label: '9', ok: true }, { label: '3', ok: false }, { label: '4', ok: false }], right: 'Yes! 3 groups × 3 = 9.', wrong: 'Each group has 3 and we take 3 groups: 3 × 3 = 9. Not just one group!' } },
        { say: 'Two jobs: <b>1)</b> divide by the bottom number, <b>2)</b> multiply by the top number. For 2/5 of 10: 10 ÷ 5 = 2, then 2 × 2 = <b>4</b>.', vis: { kind: 'fracGroups', args: [5, 2, 2] },
          quiz: { prompt: 'What is 2/5 of 10?', options: [{ label: '4', ok: true }, { label: '2', ok: false }, { label: '5', ok: false }], right: 'Yes! 10 ÷ 5 = 2 and 2 × 2 = 4.', wrong: '10 ÷ 5 = 2 in each group, then take 2 groups: 2 × 2 = 4.' } }
      ]
    },
    trick: {
      title: 'Bottom shares, top takes',
      say: 'The <b>bottom</b> number <b>shares</b> (divide). The <b>top</b> number <b>takes</b> (multiply). Do the sharing first, then the taking. Never answer with the bottom number itself!',
      vis: { kind: 'fracGroups', args: [5, 4, 3] },
      example: '3/5 of 20 → 20 ÷ 5 = 4 → 4 × 3 = <b>12</b>'
    },
    gen: {
      1: function(){
        const d = pick([2, 3, 4]), per = randInt(2, 5);
        if(chance(0.7)) return pictureQ(1, d, per, 1);
        return wordQ(1, d, per, false, true);
      },
      2: function(){
        const r = randInt(0, 4);
        if(r <= 1){ const d = pick([2, 3, 4, 5]), n = pick([1, 1, 2, 3].filter(function(x){ return x < d; })), per = randInt(2, 6); return pictureQ(n, d, per, 2); }
        const d = pick([2, 3, 4, 5, 6, 8]), n = r === 2 ? 1 : randInt(1, d - 1), per = randInt(2, 8);
        return wordQ(n, d, per, false, chance(0.4) && d <= 5 && per <= 6);
      },
      3: function(){
        const r = randInt(0, 5);
        if(r === 0) return leftQ();
        if(r === 1) return reverseQ();
        const d = pick([3, 4, 5, 6, 8, 10]), n = randInt(1, d - 1), per = randInt(2, 10);
        if(r === 2){ return typedQ('What is ' + F(n, d) + ' of ' + (d * per) + '?', '', n, d, per); }
        if(r === 3 && d <= 5 && per <= 6) return typedQ('What is ' + F(n, d) + ' of ' + (d * per) + '?', groupsRender(d, per, n), n, d, per, function(){ const g = V.decodeFracGroups(groupsRender(d, per, n)); return g.hl * g.per; });
        return wordQ(n, d, per, true, false);
      }
    }
  });
})();

/* ===== src/skills/fractions-read.js ===== */
/* REFERENCE SKILL #2 — fractions. Shows: stacked fraction labels, K.frac keys (equivalent fractions can never both
   appear as options), picture decode, numeric typed answer, shade-it interactive, mcqNum for number answers. */
(function(){
  const DENS = [2, 3, 4, 5, 6, 8, 10];
  function frac(n, d){ return fracHTML(n, d); }
  function fKey(n, d){ return K.frac(n, d); }

  registerSkill({
    id: 'frac-read', strand: 'fractions', name: 'Reading fractions', emoji: '🍕', year: 3, order: 410, prereq: [],
    lesson: {
      title: 'What is a fraction?',
      steps: [
        { say: 'A fraction is a <b>part of a whole</b>. This bar is split into <b>4 equal parts</b>. Equal means every part is the same size.', vis: { kind: 'fractionBar', args: [0, 4] } },
        { say: 'The <b>bottom</b> number (denominator) says how many equal parts there are altogether. The <b>top</b> number (numerator) says how many parts are coloured.', vis: { kind: 'fractionBar', args: [3, 4] } },
        { say: '3 parts are coloured out of 4 equal parts. We write <b>3/4</b> and say “three quarters”.', vis: { kind: 'fractionBar', args: [3, 4] },
          quiz: { prompt: 'This bar has 5 equal parts and 2 are coloured. Which fraction is it?', options: [{ label: '2/5', ok: true }, { label: '5/2', ok: false }, { label: '3/5', ok: false }], right: 'Yes! 2 coloured out of 5 equal parts is 2/5.', wrong: 'Top number = coloured parts (2). Bottom number = all the parts (5). So 2/5.' } },
        { say: 'A fraction can be shown on a circle too, like a pizza! Here <b>1</b> slice out of <b>8</b> is coloured: <b>1/8</b>.', vis: { kind: 'fractionCircle', args: [1, 8] } }
      ]
    },
    trick: {
      title: 'Count the cuts',
      say: 'To find the <b>bottom</b> number, count ALL the parts (coloured and white). To find the <b>top</b> number, count only the coloured ones. Bottom = all. Top = some.',
      vis: { kind: 'fractionBar', args: [2, 6] },
      example: '6 parts altogether, 2 coloured → <b>2/6</b>'
    },
    gen: {
      1: function(){ // read a shaded bar, unit and simple fractions
        const d = pick([2, 3, 4, 5, 6]), n = randInt(1, d - 1);
        const vis = V.fractionBar(n, d);
        const wrongs = [
          { n: d, d: n, why: 'You flipped it. The top number is the coloured parts, the bottom is ALL the parts.' },
          { n: d - n, d: d, why: 'That counts the WHITE parts. The top number counts the coloured ones.' },
          { n: n, d: n + 1 + (d > 2 ? 0 : 1), why: 'Count all the parts for the bottom number — coloured AND white.' }
        ];
        for(let k = 1; k < d; k++) wrongs.push({ n: k, d: d, why: 'Count the coloured parts carefully.' });
        // deep fallback pool: de-duplication by VALUE must never starve the options
        [2, 3, 4, 5, 6, 8].forEach(function(dd){ for(let k = 1; k < dd; k++) wrongs.push({ n: k, d: dd, why: 'Count all the parts for the bottom number, then the coloured ones for the top.' }); });
        const ds = wrongs.filter(function(w){ return w.d >= 2 && w.n >= 1; }).map(function(w){ return opt(fKey(w.n, w.d), frac(w.n, w.d), w.why); });
        return mcq({
          prompt: 'What fraction of the bar is coloured?', visual: vis,
          correct: opt(fKey(n, d), frac(n, d)), distractors: ds, keepOrder: true,
          hint: 'Count ALL the equal parts first (bottom number). Then count just the coloured ones (top number).',
          explain: ex('Reading the bar', [
            'Count <b>all</b> the equal parts: <b>' + d + '</b>. That is the bottom number.',
            'Count the <b>coloured</b> parts: <b>' + n + '</b>. That is the top number.',
            'The fraction is <b>' + n + '/' + d + '</b>. ✅'
          ]),
          truth: fKey(n, d),
          decode: function(){ const r = V.decodeFractionBar(vis); return fKey(r.num, r.den); }
        });
      },
      2: function(){ // circles, bigger denominators; or typed numerator
        const d = pick(DENS.filter(function(x){ return x >= 3; })), n = randInt(1, d - 1);
        if(chance(0.5)){
          const vis = V.fractionCircle(n, d);
          const ds = [opt(fKey(d, n), frac(d, n), 'You flipped it. The top number is the coloured parts.'), opt(fKey(d - n, d), frac(d - n, d), 'That counts the WHITE parts.')];
          for(let k = 1; k < d; k++) ds.push(opt(fKey(k, d), frac(k, d), 'Count the coloured slices carefully.'));
          // always keep a deep fallback pool so de-duplication by VALUE can never starve the options
          shuffle(DENS).forEach(function(dd){ for(let k = 1; k < dd; k++) ds.push(opt(fKey(k, dd), frac(k, dd), 'Count the slices again: the bottom number is ALL the slices.')); });
          return mcq({
            prompt: 'What fraction of the pizza is coloured?', visual: vis,
            correct: opt(fKey(n, d), frac(n, d)), distractors: ds.filter(function(o){ return !/f:\d+\/1$/.test(o.key); }), keepOrder: true,
            hint: 'Count all the slices for the bottom number, then the coloured slices for the top number.',
            explain: ex('Reading the pizza', [
              'There are <b>' + d + '</b> equal slices altogether — that is the bottom number.',
              '<b>' + n + '</b> slices are coloured — that is the top number.',
              'So <b>' + n + '/' + d + '</b> of the pizza is coloured. ✅'
            ]),
            truth: fKey(n, d), decode: function(){ const r = V.decodeFractionCircle(vis); return fKey(r.num, r.den); }
          });
        }
        const vis = V.fractionBar(n, d);
        return numeric({
          prompt: 'The bar is split into ' + d + ' equal parts. How many parts are coloured?', visual: vis, answer: n,
          hint: 'Just count the coloured parts — that number goes on the TOP of the fraction.',
          explain: ex('Counting coloured parts', ['The bar has <b>' + d + '</b> equal parts.', 'Counting the coloured ones gives <b>' + n + '</b>.', 'So the fraction is ' + n + '/' + d + ' and the answer is <b>' + n + '</b>. ✅']),
          truth: n, decode: function(){ return V.decodeFractionBar(vis).num; },
          wrong: function(v){ return v === d - n ? 'That is the number of WHITE parts.' : ''; }
        });
      },
      3: function(){ // shade it yourself, or "which picture shows n/d"
        const d = pick(DENS), n = randInt(1, d - 1);
        if(chance(0.5)){
          return shade({
            prompt: 'Colour ' + n + '/' + d + ' of the bar.', den: d, num: n,
            hint: 'The bottom number (' + d + ') says how many equal parts there are. Tap exactly ' + n + ' of them.',
            explain: ex('Colouring ' + n + '/' + d, ['The bar is cut into <b>' + d + '</b> equal parts.', 'The top number <b>' + n + '</b> says how many to colour.', 'Colour <b>' + n + '</b> parts and leave the other ' + (d - n) + ' white. ✅'])
          });
        }
        const picks = [];
        const seen = {}; seen[fKey(n, d)] = 1;
        const cands = [];
        for(let k = 1; k < d; k++) cands.push([k, d]);
        DENS.forEach(function(dd){ for(let k = 1; k < dd; k++) cands.push([k, dd]); });
        const ds = [];
        shuffle(cands).forEach(function(c){ const key = fKey(c[0], c[1]); if(!seen[key]){ seen[key] = 1; ds.push(opt(key, V.fractionBar(c[0], c[1]), 'That picture shows ' + c[0] + '/' + c[1] + ', not ' + n + '/' + d + '.')); } });
        const q = mcq({
          prompt: 'Which picture shows ' + n + '/' + d + '?', visual: '',
          correct: opt(fKey(n, d), V.fractionBar(n, d)), distractors: ds, count: 3,
          hint: 'The bottom number is how many equal parts the bar has. The top number is how many are coloured.',
          explain: ex('Finding ' + n + '/' + d, ['<b>' + d + '</b> on the bottom means the bar has ' + d + ' equal parts.', '<b>' + n + '</b> on the top means ' + n + ' of them are coloured.', 'Only one bar has ' + d + ' parts with ' + n + ' coloured: that is <b>' + n + '/' + d + '</b>. ✅']),
          truth: fKey(n, d)
        });
        q.optionsAreVisual = true;
        q.decodeKey = function(){ for(let i = 0; i < q.options.length; i++){ const r = V.decodeFractionBar(q.options[i].label); if(fKey(r.num, r.den) !== q.options[i].key) return 'option ' + i + ' picture does not match its key'; } return q.options[q.correct].key; };
        return q;
      }
    }
  });
})();
